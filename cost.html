  if (!m) return;
  if (!confirm(`⚠️ 删除确认\n\n确定删除材料库中的「${m.name}${m.spec ? ' · ' + m.spec : ''}」吗？\n该操作不可撤销。`)) return;
  if (libId.startsWith('c:')) {
    const cid = libId.slice(2);
    state.customMaterials = state.customMaterials.filter(x => x.id !== cid);
    state.selectedKeys.delete(libId);
    state.favoriteKeys.delete(libId);
    saveLocal();
    renderLibTabs(); renderLibBody(); renderSelbar();
    try { await supa.from('custom_materials').delete().eq('id', cid); }
    catch (e) { console.warn('云端删除失败', e); }
  } else {
    state.removedBuiltins.add(libId);
    delete state.matOverrides[libId];
    state.selectedKeys.delete(libId);
    state.favoriteKeys.delete(libId);
    saveLocal();
    renderLibTabs(); renderLibBody(); renderSelbar();
  }
}

function openStageModal() {
  renderStageList();
  $('newStageName').value = '';
  $('stageModal').classList.add('show');
  setTimeout(() => $('newStageName').focus(), 100);
}
function closeStageModal() { $('stageModal').classList.remove('show'); }

function renderStageList() {
  const box = $('stageListBox');
  const stages = allStages().filter(s => s !== '全部');
  if (!stages.length) {
    box.innerHTML = '<div style="text-align:center;color:#b8bfcd;padding:20px;font-size:12px;">暂无分类</div>';
    return;
  }
  const mats = allMaterials();
  box.innerHTML = '';
  stages.forEach(name => {
    const count = mats.filter(m => m.stage === name).length;
    const row = document.createElement('div');
    row.className = 'stage-row';
    row.innerHTML = `
      <span class="stage-row-name"></span>
      <span class="stage-row-count">${count} 项</span>
      <div class="stage-row-actions">
        <button class="lr-btn lr-edit" title="重命名">✎</button>
        <button class="lr-btn lr-del" title="删除">×</button>
      </div>
    `;
    const nameEl = row.querySelector('.stage-row-name');
    nameEl.textContent = name;
    nameEl.addEventListener('click', () => startRenameStage(name, nameEl));
    row.querySelector('.lr-edit').addEventListener('click', () => startRenameStage(name, nameEl));
    row.querySelector('.lr-del').addEventListener('click', () => confirmDeleteStage(name));
    box.appendChild(row);
  });
}

function startRenameStage(oldName, nameEl) {
  if (nameEl.querySelector('input')) return;
  const input = document.createElement('input');
  input.type = 'text'; input.value = oldName; input.maxLength = 20;
  nameEl.textContent = ''; nameEl.classList.add('editing'); nameEl.appendChild(input);
  input.focus(); input.select();
  let closed = false;
  const finish = (commit) => {
    if (closed) return; closed = true;
    if (commit) {
      const v = input.value.trim();
      if (!v || v === oldName) { nameEl.classList.remove('editing'); nameEl.textContent = oldName; return; }
      const others = allStages().filter(s => s !== '全部');
      if (others.includes(v)) {
        alert('分类已存在');
        nameEl.classList.remove('editing'); nameEl.textContent = oldName; return;
      }
      renameStage(oldName, v);
      renderStageList(); renderLibTabs(); renderLibBody();
      showToast(`已重命名为「${v}」`, 1500);
      return;
    }
    nameEl.classList.remove('editing'); nameEl.textContent = oldName;
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  });
}

function renameStage(oldName, newName) {
  BUILTIN_MATERIALS.forEach((m, i) => {
    const id = 'b:' + i;
    if (state.removedBuiltins.has(id)) return;
    const ov = state.matOverrides[id] || {};
    const curStage = ov.stage !== undefined ? ov.stage : (m.stage || '');
    if (curStage === oldName) {
      if (!state.matOverrides[id]) state.matOverrides[id] = {};
      state.matOverrides[id].stage = newName;
    }
  });
  state.customMaterials.forEach(cm => {
    if (cm.stage === oldName) {
      cm.stage = newName;
      try { supa.from('custom_materials').update({ stage: newName }).eq('id', cm.id); } catch (e) {}
    }
  });
  const idx = state.customStages.indexOf(oldName);
  if (idx >= 0) state.customStages[idx] = newName;
  saveLocal();
  if (state.libStage === oldName) state.libStage = newName;
}

async function confirmDeleteStage(name) {
  const count = allMaterials().filter(m => m.stage === name).length;
  let msg = `⚠️ 删除确认\n\n确定删除分类「${name}」吗？`;
  if (count > 0) msg += `\n该分类下 ${count} 项材料将变为「未分类」。`;
  if (!confirm(msg)) return;
  await deleteStage(name);
  renderStageList();
  renderLibTabs(); renderLibBody();
  showToast('已删除分类', 1500);
}

async function deleteStage(stageName) {
  BUILTIN_MATERIALS.forEach((m, i) => {
    const id = 'b:' + i;
    if (state.removedBuiltins.has(id)) return;
    const ov = state.matOverrides[id] || {};
    const curStage = ov.stage !== undefined ? ov.stage : (m.stage || '');
    if (curStage === stageName) {
      if (!state.matOverrides[id]) state.matOverrides[id] = {};
      state.matOverrides[id].stage = '';
    }
  });
  for (const cm of state.customMaterials) {
    if (cm.stage === stageName) {
      cm.stage = '';
      try { await supa.from('custom_materials').update({ stage: '' }).eq('id', cm.id); } catch (e) {}
    }
  }
  state.customStages = state.customStages.filter(s => s !== stageName);
  if (state.libStage === stageName) state.libStage = '全部';
  saveLocal();
}

function addStage() {
  const v = ($('newStageName').value || '').trim();
  if (!v) { $('newStageName').focus(); return; }
  if (v === '全部') { alert('「全部」是保留名称'); return; }
  const others = allStages().filter(s => s !== '全部');
  if (others.includes(v)) { alert('分类已存在'); return; }
  state.customStages.push(v);
  saveLocal();
  $('newStageName').value = '';
  renderStageList(); renderLibTabs(); renderLibBody();
  showToast(`已添加分类「${v}」`, 1500);
}

function exportData() {
  const orderNo = state.orderNo.trim();
  const payload = {
    app: 'cost', version: 6,
    exportedAt: new Date().toISOString(),
    orderNo: orderNo || '',
    orderInfo: state.orderInfo,
    installFee: state.installFee,
    shippingFee: state.shippingFee,
    consumableCost: state.consumableCost,
    installationFee: state.installationFee,
    installIncluded: state.installIncluded,
    shippingIncluded: state.shippingIncluded,
    items: state.items,
    fees: state.orderFees,
    grandTotal: calcGrandTotal(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = new Date();
  const stamp = `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}-${String(t.getHours()).padStart(2,'0')}${String(t.getMinutes()).padStart(2,'0')}`;
  const safeName = (orderNo || '成本单').replace(/[\\\/:*?"<>|]/g, '_');
  a.href = url;
  a.download = `${safeName}-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object') throw new Error('文件内容无法识别');
    const items = Array.isArray(data.items) ? data.items : [];
    const orderNo = String(data.orderNo || '').trim();
    if (!confirm(`导入将替换当前清单\n\n材料：${items.length} 项\n单号：${orderNo || '（未填）'}\n\n继续？`)) return;
    if (orderNo && !state.orderNo.trim()) {
      state.orderNo = orderNo;
      $('orderInput').value = orderNo;
    }
    state.items = items.map(normalizeItem);
    if (data.orderInfo) state.orderInfo = Object.assign(state.orderInfo, data.orderInfo);
    if (typeof data.installFee === 'number') state.installFee = data.installFee;
    if (typeof data.shippingFee === 'number') state.shippingFee = data.shippingFee;
    if (typeof data.consumableCost === 'number') state.consumableCost = data.consumableCost;
    if (typeof data.installationFee === 'number') state.installationFee = data.installationFee;
    if (typeof data.installIncluded === 'boolean') state.installIncluded = data.installIncluded;
    if (typeof data.shippingIncluded === 'boolean') state.shippingIncluded = data.shippingIncluded;
    calcOrderFees(state.orderNo);
    autoSave();
    renderInfoFields(); renderList(); renderFeeSummary(); renderPtBox();
    alert('导入成功！');
  } catch (e) {
    alert('导入失败：' + (e.message || '文件格式不正确'));
  }
}

function bind() {
  $('tabMaterials').onclick = () => switchLibTab('materials');
  $('tabOrders').onclick = () => switchLibTab('orders');

  $('orderInput').addEventListener('input', e => {
    state.orderNo = e.target.value;
    renderOrderDisplay();
    autoSave();
  });
  $('orderInput').addEventListener('blur', async () => {
    const v = state.orderNo.trim();
    if (!v) return;
    await loadOrder(v);
    calcOrderFees(v);
    renderList(); renderFeeSummary(); renderInfoFields(); renderPtBox();
    renderOrderList();
  });

  $('orderSearch').addEventListener('input', e => {
    state.orderKeyword = e.target.value;
    renderOrderList();
  });
  $('refreshOrdersBtn').onclick = async () => {
    await loadFromCloud();
    renderOrderList();
    if (state.orderNo) calcOrderFees(state.orderNo);
    renderFeeSummary(); renderPtBox();
    showToast('已从日程表刷新', 1500);
  };

  const fMap = {
    fCustomer: 'customer',
    fDeliveryTime: 'delivery_time',
    fNote: 'note',
  };
  Object.entries(fMap).forEach(([id, key]) => {
    const el = $(id); if (!el) return;
    el.addEventListener('input', e => {
      state.orderInfo[key] = e.target.value;
      autoSave();
    });
  });

  const richEditor = $('fExtraNoteEditor');
  richEditor.addEventListener('input', () => {
    state.orderInfo.extra_note = richEditor.innerHTML;
    autoSave();
  });
  richEditor.addEventListener('paste', async e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) continue;
        try {
          const base64 = await fileToBase64(file);
          document.execCommand('insertHTML', false, `<img src="${base64}" alt="粘贴图片">`);
          state.orderInfo.extra_note = richEditor.innerHTML;
          autoSave();
        } catch (err) { console.warn('图片粘贴失败', err); }
        return;
      }
    }
  });

  $('installFeeInput').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    state.installFee = Math.max(0, v);
    renderFeeSummary(); autoSave();
  });
  $('installFeeInput').addEventListener('blur', e => {
    if (e.target.value === '' || isNaN(Number(e.target.value))) e.target.value = '';
  });
  $('shippingFeeInput').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    state.shippingFee = Math.max(0, v);
    renderFeeSummary(); autoSave();
  });
  $('shippingFeeInput').addEventListener('blur', e => {
    if (e.target.value === '' || isNaN(Number(e.target.value))) e.target.value = '';
  });
  $('consumableCostInput').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    state.consumableCost = Math.max(0, v);
    renderFeeSummary(); autoSave();
  });
  $('consumableCostInput').addEventListener('blur', e => {
    if (e.target.value === '' || isNaN(Number(e.target.value))) e.target.value = '';
  });
  $('installationFeeInput').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    state.installationFee = Math.max(0, v);
    renderFeeSummary(); renderPtBox(); autoSave();
  });
  $('installationFeeInput').addEventListener('blur', e => {
    if (e.target.value === '' || isNaN(Number(e.target.value))) e.target.value = '';
  });

  $('installInclude').addEventListener('change', e => {
    state.installIncluded = e.target.checked;
    saveLocal(); renderFeeSummary(); autoSave();
  });
  $('shippingInclude').addEventListener('change', e => {
    state.shippingIncluded = e.target.checked;
    saveLocal(); renderFeeSummary(); autoSave();
  });

  $('libSearch').addEventListener('input', e => {
    state.libKeyword = e.target.value;
    renderLibBody();
  });

  $('addSelectedBtn').onclick = addSelectedMaterials;
  $('clearSelBtn').onclick = () => {
    state.selectedKeys.clear();
    renderLibBody(); renderSelbar();
  };

  $('libAddBtn').onclick = openAddMatModal;
  $('addMatClose').onclick = closeAddMatModal;
  $('addMatCancel').onclick = closeAddMatModal;
  $('addMatConfirm').onclick = saveNewMaterial;
  $('addMatModal').addEventListener('click', e => {
    if (e.target === $('addMatModal')) closeAddMatModal();
  });

  $('editMatClose').onclick = closeEditMatModal;
  $('editMatCancel').onclick = closeEditMatModal;
  $('editMatConfirm').onclick = saveEditMaterial;
  $('editMatDelete').onclick = async () => {
    if (!editingLibId) return;
    const libId = editingLibId;
    closeEditMatModal();
    await deleteLibMaterial(libId);
  };
  $('editMatModal').addEventListener('click', e => {
    if (e.target === $('editMatModal')) closeEditMatModal();
  });
  $('editMatQty').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); $('editMatConfirm').click(); }
  });

  $('stageClose').onclick = closeStageModal;
  $('addStageBtn').onclick = addStage;
  $('newStageName').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addStage(); }
  });
  $('stageModal').addEventListener('click', e => {
    if (e.target === $('stageModal')) closeStageModal();
  });

  $('clearListBtn').onclick = () => {
    if (!state.items.length) return;
    if (!confirm(`⚠️ 清空确认\n\n确定清空当前清单的 ${state.items.length} 项材料吗？\n该操作会同步到云端，且无法撤销。`)) return;
    state.items = [];
    autoSave();
    calcOrderFees(state.orderNo);
    renderList(); renderFeeSummary();
  };

  $('saveBtn').onclick = manualSave;
  $('exportBtn').onclick = exportData;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (f) await importData(f);
    e.target.value = '';
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('addMatModal').classList.contains('show')) closeAddMatModal();
      else if ($('editMatModal').classList.contains('show')) closeEditMatModal();
      else if ($('stageModal').classList.contains('show')) closeStageModal();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
      e.preventDefault();
      manualSave();
    }
  });
}

async function init() {
  const params = new URLSearchParams(location.search);
  const urlOrder = (params.get('order') || '').trim();

  loadLayout();
  loadLocal();
  if (urlOrder) state.orderNo = urlOrder;
  if (state.orderNo) $('orderInput').value = state.orderNo;

  bind();
  setupSplitters();

  renderLibTabs(); renderLibBody(); renderSelbar();
  renderOrderDisplay(); renderInfoFields(); renderList(); renderFeeSummary();
  renderPtBox();

  switchLibTab('orders');

  await loadFromCloud();
  renderLibTabs(); renderLibBody();
  renderOrderList();

  if (state.orderNo) {
    await loadOrder(state.orderNo);
    calcOrderFees(state.orderNo);
    $('orderInput').value = state.orderNo;
    renderOrderDisplay(); renderInfoFields(); renderList(); renderFeeSummary();
    renderPtBox();
  }
}

init();
</script>
