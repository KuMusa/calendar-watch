<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9">
<title>成本单</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13px; line-height: 1.4; color: #1a1f36;
    background: radial-gradient(900px 500px at 4% -6%, #e4ecff 0%, transparent 55%),
                radial-gradient(800px 400px at 98% -2%, #ffe8f1 0%, transparent 52%), #eef2f9;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --row-mid-left-fr: 1.6;
    --row-foot-left-fr: 1;
    --row-mid-fr: 1.4;
    --row-foot-fr: 1;
  }
  button, input, select, textarea { font-family: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

  /* ============== 顶栏 ============== */
  .topbar { flex-shrink: 0; height: 48px; display: flex; align-items: center; gap: 8px;
            padding: 0 12px; background: #fff; border-bottom: 1px solid #e9edf5;
            box-shadow: 0 1px 8px rgba(26,31,54,.05); }
  .brand { font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 6px;
           flex-shrink: 0; padding-right: 10px; border-right: 1px solid #eef2f9; }
  .brand .logo-sq { width: 24px; height: 24px; border-radius: 7px;
                    background: linear-gradient(140deg, #8b5cf6, #7743e0);
                    display: grid; place-items: center; font-size: 13px; color: #fff;
                    box-shadow: 0 3px 8px rgba(119,67,224,.3); }
  .order-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .order-label { font-size: 11.5px; font-weight: 700; color: #8b93a7; }
  .order-input { height: 32px; padding: 0 10px; border: 1.5px solid #e9edf5;
                 border-radius: 8px; background: #fafbfe; color: #1a1f36;
                 font-size: 13px; font-weight: 700; outline: none; width: 200px; transition: .15s; }
  .order-input:focus { border-color: #7743e0; background: #fff;
                       box-shadow: 0 0 0 3px rgba(119,67,224,.1); }
  .order-input::placeholder { color: #b8bfcd; font-weight: 500; }
  .spacer { flex: 1; }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px;
         border: 1.5px solid #e9edf5; background: #fff;
         font-size: 12px; font-weight: 700; color: #4a5368;
         display: inline-flex; align-items: center; gap: 4px;
         white-space: nowrap; transition: .15s; }
  .btn:hover { background: #f2f5ff; border-color: #cfdaff; color: #4f7cff; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(140deg, #5b86ff, #3b66e6);
                 color: #fff; border-color: transparent;
                 box-shadow: 0 3px 8px rgba(79,124,255,.26); }
  .btn.save { background: linear-gradient(140deg, #16c58c, #0a8f66);
              color: #fff; border-color: transparent;
              box-shadow: 0 3px 8px rgba(16,185,129,.26);
              height: 36px; padding: 0 16px; font-size: 13px; }
  .btn.danger { color: #e8455a; border-color: #ffd7db; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .sync-status { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px;
                 background: #f0fdf8; color: #0a8f66; border: 1px solid #c9eddc;
                 display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .sync-status.err { background: #fff5f6; color: #e8455a; border-color: #ffd7db; }
  .sync-status .dot { width: 6px; height: 6px; border-radius: 50%;
                      background: currentColor; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ============== 主体 ============== */
  .main { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 8px; }

  /* ============== 左：材料库/单号库 ============== */
  .lib { width: 360px; flex-shrink: 0; background: #fff; border-radius: 12px;
         box-shadow: 0 2px 10px rgba(26,31,54,.06);
         display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  .lib-toggle { display: flex; gap: 3px; padding: 3px; background: #f6f8fd;
                border-radius: 10px 10px 0 0; flex-shrink: 0;
                border-bottom: 1px solid #f1f4fa; }
  .toggle-btn { flex: 1; height: 36px; border-radius: 8px;
                font-size: 13px; font-weight: 800; color: #8b93a7;
                transition: .15s; display: inline-flex; align-items: center;
                justify-content: center; gap: 4px; }
  .toggle-btn:hover { background: #eef3ff; color: #4f7cff; }
  .toggle-btn.active { background: linear-gradient(140deg, #5b86ff, #3b66e6);
                       color: #fff; box-shadow: 0 3px 8px rgba(79,124,255,.28); }
  .toggle-btn.active.orders-active { background: linear-gradient(140deg, #8b5cf6, #7743e0);
                                     box-shadow: 0 3px 8px rgba(119,67,224,.28); }
  .toggle-btn .cnt { font-size: 10px; background: rgba(255,255,255,.3); color: #fff;
                     padding: 1px 6px; border-radius: 999px; font-weight: 800; }
  .toggle-btn:not(.active) .cnt { background: #eef3ff; color: #4f7cff; }

  .lib-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .lib-panel.hide { display: none; }

  .lib-head { padding: 10px; border-bottom: 1px solid #f1f4fa;
              display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .lib-search { flex: 1; height: 34px; padding: 0 12px;
                border: 1.5px solid #e9edf5; border-radius: 8px;
                font-size: 13px; font-weight: 500; outline: none;
                transition: .15s; background: #fafbfe; min-width: 0; }
  .lib-search:focus { border-color: #4f7cff; background: #fff;
                      box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .lib-search::placeholder { color: #b8bfcd; }
  .lib-add-btn { height: 34px; padding: 0 12px; border-radius: 8px;
                 background: linear-gradient(140deg, #16c58c, #0a8f66);
                 color: #fff; font-size: 12.5px; font-weight: 700;
                 display: inline-flex; align-items: center; gap: 3px;
                 white-space: nowrap; flex-shrink: 0;
                 box-shadow: 0 3px 8px rgba(16,185,129,.24); transition: .15s; }
  .lib-add-btn:hover { transform: translateY(-1px); }

  .lib-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px 4px; flex-shrink: 0; }
  .lib-tab { padding: 4px 10px; border-radius: 6px; font-size: 12px;
             font-weight: 700; color: #6b7280; background: #f8fafd; transition: .15s; }
  .lib-tab:hover { background: #eef3ff; color: #4f7cff; }
  .lib-tab.active { background: linear-gradient(140deg, #5b86ff, #3b66e6);
                    color: #fff; box-shadow: 0 2px 6px rgba(79,124,255,.24); }
  .lib-tab.manage { background: #fff5d6; color: #b45309;
                    border: 1px dashed #fcd34d; }
  .lib-tab.manage:hover { background: #ffedc9; color: #92400e;
                          border-color: #f59e0b; }

  .lib-selbar { display: none; align-items: center; gap: 8px; padding: 8px 10px;
                background: linear-gradient(135deg, #eef3ff, #f5f8ff);
                border-top: 1px solid #e9edf5; border-bottom: 1px solid #e9edf5;
                font-size: 12px; font-weight: 700; color: #4f7cff; flex-shrink: 0; }
  .lib-selbar.show { display: flex; }
  .lib-selbar b { background: #5b86ff; color: #fff; padding: 1px 8px;
                  border-radius: 999px; font-size: 11px; margin: 0 2px; }
  .lib-selbar .btn { height: 28px; padding: 0 10px; font-size: 12px; }
  .lib-selbar .btn.primary { margin-left: auto; }

  .lib-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 6px 10px; }
  .lib-body::-webkit-scrollbar { width: 6px; }
  .lib-body::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  .lib-group { margin-bottom: 10px; }
  .lib-group-title { font-size: 11px; font-weight: 800; color: #8b93a7;
                     letter-spacing: .06em; text-transform: uppercase;
                     padding: 6px 8px 4px; display: flex; align-items: center; gap: 6px; }
  .lib-group-title::after { content: ''; flex: 1; height: 1px; background: #eef2f9; }
  .lib-group-title.fav { color: #d97706; }
  .lib-group-title.fav::after { background: linear-gradient(to right, #fcd34d, transparent); }

  .m-item { display: grid;
            grid-template-columns: 20px 22px minmax(0,1fr) 40px 54px 22px 22px 22px;
            gap: 4px; align-items: center; padding: 5px 6px;
            border-radius: 8px; transition: .14s; font-size: 12px; }
  .m-item:hover { background: #f8fbff; }
  .m-item.selected { background: #eef3ff; }
  .m-check { width: 18px; height: 18px; border-radius: 5px;
             border: 2px solid #cfd6e6; background: #fff;
             display: grid; place-items: center;
             transition: .14s; padding: 0; cursor: pointer;
             flex-shrink: 0; justify-self: center; }
  .m-check:hover { border-color: #4f7cff; transform: scale(1.08); }
  .m-check.on { background: linear-gradient(140deg, #5b86ff, #3b66e6);
                border-color: #3b66e6; box-shadow: 0 2px 6px rgba(79,124,255,.32); }
  .m-check.on::after { content: ''; width: 4px; height: 8px;
                       border: solid #fff; border-width: 0 2px 2px 0;
                       transform: rotate(45deg) translate(-1px, -2px); }
  .m-fav { width: 22px; height: 22px; border-radius: 6px;
           display: grid; place-items: center; transition: .15s;
           font-size: 14px; flex-shrink: 0; justify-self: center;
           color: #cdd4e2; }
  .m-fav:hover { background: #fff8ec; color: #f59e0b; transform: scale(1.1); }
  .m-fav.on { color: #f59e0b; text-shadow: 0 2px 4px rgba(245,158,11,.35); }
  .m-main { min-width: 0; cursor: pointer; }
  .m-name { font-weight: 700; color: #1a1f36; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .m-name small { color: #8b93a7; font-weight: 500; font-size: 11px; margin-left: 4px; }
  .m-unit { font-size: 11px; color: #8b93a7; font-weight: 600; text-align: center; }
  .m-price { font-size: 12px; font-weight: 800; color: #e8455a; text-align: right;
             font-variant-numeric: tabular-nums; }
  .m-price::before { content: '¥'; font-size: 10px; opacity: .7; margin-right: 1px; }
  .m-btn { width: 22px; height: 22px; border-radius: 6px;
           display: grid; place-items: center; transition: .15s;
           font-size: 12px; flex-shrink: 0; justify-self: center;
           color: #b8bfcd; }
  .m-add { background: #eef3ff; color: #4f7cff; font-size: 14px; font-weight: 800; }
  .m-add:hover { background: linear-gradient(140deg, #5b86ff, #3b66e6);
                 color: #fff; box-shadow: 0 2px 6px rgba(79,124,255,.3); }
  .m-edit:hover { background: #eef3ff; color: #4f7cff; }
  .m-del:hover { background: #ffe9eb; color: #e8455a; }

  .order-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .order-panel.hide { display: none; }
  .order-list { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 6px 10px; }
  .order-list::-webkit-scrollbar { width: 6px; }
  .order-list::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }
  .order-item-row { display: flex; align-items: center; gap: 8px;
                    padding: 10px 12px; border-radius: 10px;
                    background: #fbfcfe; border: 1.5px solid #eef2f9;
                    margin-bottom: 6px; cursor: pointer; transition: .14s; }
  .order-item-row:hover { background: #fff; border-color: #c8d8ff;
                          box-shadow: 0 4px 14px rgba(79,124,255,.1);
                          transform: translateX(2px); }
  .order-item-row.current { background: linear-gradient(135deg, #f0fdf8, #e6faf1);
                            border-color: #86dcb6;
                            box-shadow: 0 4px 14px rgba(16,185,129,.14); }
  .order-item-row .no { font-size: 14px; font-weight: 800; color: #0a8f66;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                        flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
  .order-item-row .meta { font-size: 10.5px; color: #8b93a7; font-weight: 600;
                          flex-shrink: 0; text-align: right; white-space: nowrap; }
  .order-item-row .arrow { font-size: 12px; color: #b8bfcd; flex-shrink: 0; }
  .order-item-row.current .arrow { color: #16c58c; }

  .lib-empty { padding: 40px 20px; text-align: center;
               color: #b8bfcd; font-size: 12.5px; font-weight: 500; }
  .lib-empty .ico { font-size: 28px; display: block; margin-bottom: 8px; opacity: .5; }

  /* ============== 右：主面板 ============== */
  .list { flex: 1; min-width: 0; background: #fff; border-radius: 12px;
          box-shadow: 0 2px 10px rgba(26,31,54,.06);
          display: flex; flex-direction: column; min-height: 0; overflow: hidden; }

  /* ★ 总成本置顶栏 */
  .grand-bar { flex-shrink: 0; display: flex; align-items: center; gap: 10px;
               padding: 10px 14px;
               background: linear-gradient(135deg, #f8f5ff, #f1ebff);
               border-bottom: 1.5px solid #e0d5ff; }
  .grand-bar .gb-lbl { font-size: 13px; font-weight: 800; color: #7743e0;
                       letter-spacing: .04em; flex-shrink: 0; }
  .grand-bar .gb-formula { font-size: 11.5px; font-weight: 700; color: #8b93a7;
                           overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                           min-width: 0; flex: 1;
                           font-variant-numeric: tabular-nums; }
  .grand-bar .gb-formula b { color: #7743e0; font-weight: 800; }
  .grand-bar .gb-val { margin-left: auto; flex-shrink: 0;
                       font-size: 21px; font-weight: 800; color: #fff;
                       background: linear-gradient(135deg, #8b5cf6, #7743e0);
                       padding: 6px 20px; border-radius: 10px;
                       font-variant-numeric: tabular-nums;
                       box-shadow: 0 4px 12px rgba(119,67,224,.3); }
  .grand-bar .gb-val.zero { background: #eceefa; color: #b8bfcd; box-shadow: none; }

  /* 第一排：只有 4 个字段 */
  .row-head { flex-shrink: 0; display: flex; gap: 10px; align-items: flex-end;
              padding: 12px 14px; border-bottom: 1px solid #f1f4fa;
              flex-wrap: wrap; }
  .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1 1 160px; }
  .fld label { font-size: 10.5px; font-weight: 800; color: #8b93a7;
               letter-spacing: .04em; text-transform: uppercase; }
  .fld input, .fld .ro-display { height: 34px; padding: 0 12px;
                                 border: 1.5px solid #e9edf5; border-radius: 8px;
                                 font-size: 13px; font-weight: 600; color: #1a1f36;
                                 background: #fafbfe; outline: none; transition: .15s;
                                 min-width: 0; }
  .fld input:focus { border-color: #7743e0; background: #fff;
                     box-shadow: 0 0 0 3px rgba(119,67,224,.1); }
  .fld input::placeholder { color: #b8bfcd; font-weight: 500; }
  .fld .ro-display { display: flex; align-items: center;
                     font-weight: 800; color: #0a8f66;
                     background: #f0fdf8; border-color: #c9eddc;
                     border-style: dashed; font-variant-numeric: tabular-nums;
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fld .ro-display.empty { color: #b8bfcd; background: #fafbfe;
                           border-color: #e9edf5; border-style: solid; }
  .fld.fld-order { flex: 0 0 200px; }

  /* 拖动条 */
  .v-splitter { flex-shrink: 0; width: 8px; cursor: col-resize; position: relative;
                align-self: stretch; }
  .v-splitter::before { content: ''; position: absolute; left: 50%; top: 50%;
                        transform: translate(-50%, -50%);
                        width: 3px; height: 40px; border-radius: 2px;
                        background: #dde3ef; transition: background .15s; }
  .v-splitter:hover::before, .v-splitter.active::before { background: #5b86ff; }
  .h-splitter { flex-shrink: 0; height: 8px; cursor: row-resize; position: relative; }
  .h-splitter::before { content: ''; position: absolute; left: 50%; top: 50%;
                        transform: translate(-50%, -50%);
                        height: 3px; width: 40px; border-radius: 2px;
                        background: #dde3ef; transition: background .15s; }
  .h-splitter:hover::before, .h-splitter.active::before { background: #5b86ff; }
  body.dragging { user-select: none; }
  body.dragging.v { cursor: col-resize; }
  body.dragging.h { cursor: row-resize; }

  /* 第二排：左材料 右兼职（逐行表格） */
  .row-mid { flex: var(--row-mid-fr) 1 0; min-height: 0;
             display: flex; padding: 0 6px 6px;
             border-bottom: 1px solid #f1f4fa; }
  .mid-left { flex: var(--row-mid-left-fr) 1 0; min-width: 0;
              display: flex; flex-direction: column;
              min-height: 0; padding: 6px 4px 0 8px; }
  .mid-right { flex: 1 1 0; min-width: 0;
               display: flex; flex-direction: column;
               min-height: 0; padding: 6px 8px 0 4px; overflow-y: auto; }
  .mid-right::-webkit-scrollbar { width: 5px; }
  .mid-right::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  .sec-head { display: flex; align-items: center; gap: 6px;
              padding: 4px 2px 6px; flex-shrink: 0; }
  .sec-title { font-size: 11px; font-weight: 800; color: #4a5368;
               letter-spacing: .05em; text-transform: uppercase; }
  .sec-info { font-size: 10.5px; color: #8b93a7; font-weight: 600; }
  .sec-total { margin-left: auto; font-size: 12px; font-weight: 800;
               color: #0a8f66; font-variant-numeric: tabular-nums; }
  .btn-clear { margin-left: 6px; height: 24px; padding: 0 10px;
               border-radius: 6px; font-size: 11px; font-weight: 700;
               color: #e8455a; border: 1px solid #ffd7db; background: #fff; }
  .btn-clear:hover { background: #fff5f6; }

  /* ★ 兼职右上角合计 */
  .sec-totals { margin-left: auto; display: flex; align-items: center;
                gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
  .pt-total-item { font-size: 11.5px; font-weight: 800;
                   font-variant-numeric: tabular-nums;
                   padding: 2.5px 9px; border-radius: 6px; white-space: nowrap; }
  .pt-total-item.meal { color: #d97706; background: #fff8ec; border: 1px solid #fde68a; }
  .pt-total-item.fee { color: #0a8f66; background: #f0fdf8; border: 1px solid #c9eddc; }
  .pt-total-item.total { color: #fff; background: linear-gradient(135deg, #8b5cf6, #7743e0);
                         border: 1px solid #7743e0;
                         box-shadow: 0 2px 6px rgba(119,67,224,.28); }

  /* ★ 第二排右侧「兼职」逐行表格 */
  .pt-wrap { width: 100%; min-width: 0;
             flex: 0 0 auto; display: block; }
  .pt-table {
    display: table; width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 12.5px;
    background: #fff;
    border: 1px solid #e9edf5;
    border-radius: 10px;
    overflow: hidden;
  }
  .pt-table thead { display: table-header-group; }
  .pt-table tbody { display: table-row-group; }
  .pt-table tr { display: table-row; }
  .pt-table th, .pt-table td { display: table-cell; }
  .pt-table col.col-date { width: 40%; }
  .pt-table col.col-meal { width: 30%; }
  .pt-table col.col-fee  { width: 30%; }
  .pt-table thead th {
    background: #f5f8ff; color: #3b5bbf; font-weight: 800;
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
    padding: 8px 10px; text-align: left;
    border-bottom: 1.5px solid #dde8ff;
  }
  .pt-table thead th.col-meal-h,
  .pt-table thead th.col-fee-h { text-align: right; }
  .pt-table tbody td {
    padding: 7px 10px;
    border-bottom: 1px solid #f1f4fa;
    font-variant-numeric: tabular-nums;
    color: #1a1f36;
    vertical-align: middle;
  }
  .pt-table tbody tr:hover td { background: #fbfcfe; }
  .pt-table tbody tr:last-child td { border-bottom: none; }
  .pt-date { font-weight: 800; color: #3b5bbf; }
  .pt-date small { display: block; font-size: 10px; color: #8b93a7; font-weight: 600;
                   margin-top: 1px; }
  .pt-meal { text-align: right; color: #d97706; font-weight: 800; }
  .pt-fee { text-align: right; color: #0a8f66; font-weight: 800; }
  .pt-meal.zero, .pt-fee.zero { color: #b8bfcd; font-weight: 700; }
  .pt-empty { padding: 16px 10px; text-align: center; color: #b8bfcd;
              font-size: 12px; }

  /* 材料清单 */
  .list-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 2px 6px; }
  .list-body::-webkit-scrollbar { width: 6px; }
  .list-body::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  .list-row-header { display: grid;
                     grid-template-columns: minmax(0,1.4fr) 40px minmax(280px, 1.6fr) 60px;
                     gap: 8px; align-items: center; padding: 6px 10px;
                     background: #f6f8fd; border-radius: 8px;
                     font-size: 10.5px; font-weight: 800; color: #4a5368;
                     letter-spacing: .05em; text-transform: uppercase;
                     position: sticky; top: 0; z-index: 2; margin-bottom: 4px; }
  .list-row-header span:nth-child(3) { text-align: center; }
  .list-row-header span:nth-child(4) { text-align: center; }

  .list-row { display: grid;
              grid-template-columns: minmax(0,1.4fr) 40px minmax(280px, 1.6fr) 60px;
              gap: 8px; align-items: center; padding: 7px 10px;
              border-radius: 8px; font-size: 12.5px; transition: .14s;
              border-bottom: 1px solid #f6f8fd; }
  .list-row:hover { background: #f8fbff; }
  .list-row:last-child { border-bottom: none; }

  .lr-name { display: flex; align-items: center; gap: 6px;
             min-width: 0; cursor: pointer;
             border-radius: 6px; padding: 3px 6px; margin: -3px -6px;
             transition: .14s; }
  .lr-name:hover { background: #eef3ff; }
  .lr-stage { font-size: 10px; font-weight: 800; color: #4f7cff;
              background: #eef3ff; padding: 1.5px 7px; border-radius: 999px;
              flex-shrink: 0; white-space: nowrap;
              border: 1px solid #dde8ff; }
  .lr-stage.empty { color: #b8bfcd; background: #f0f3fa; border-color: #e2e7f0; }
  .lr-name-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .lr-name-text { font-weight: 700; color: #1a1f36;
                  overflow: hidden; text-overflow: ellipsis;
                  white-space: nowrap; font-size: 12.5px; }
  .lr-name-main small { font-size: 11px; font-weight: 500; color: #8b93a7;
                        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .lr-unit { font-size: 11px; color: #8b93a7; font-weight: 600; text-align: center; }

  .lr-calc { display: flex; align-items: center; gap: 6px; justify-content: center;
             min-width: 0; }
  .lr-input { width: 100%; height: 28px; padding: 0 8px; text-align: right;
              border: 1.5px solid transparent; border-radius: 6px;
              font-size: 12.5px; font-weight: 700; color: #1a1f36;
              background: #fbfcfe; outline: none; transition: .15s;
              font-variant-numeric: tabular-nums; }
  .lr-input:hover { background: #f2f5ff; }
  .lr-input:focus { border-color: #4f7cff; background: #fff;
                    box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .lr-price { color: #e8455a; flex: 0 0 70px; }
  .lr-qty { color: #4f7cff; flex: 1; }
  .lr-qty-wrap { position: relative; flex: 0 0 78px; }
  .lr-qty-wrap .lr-input { padding-right: 16px; }
  .lr-qty-wrap.has-expr::after {
    content: '∑'; position: absolute; right: 6px; top: 50%;
    transform: translateY(-50%);
    font-size: 10px; color: #4f7cff; font-weight: 800; pointer-events: none;
  }
  .lr-op { font-size: 12px; font-weight: 800; color: #b8bfcd; flex-shrink: 0; }
  .lr-subtotal { flex: 1 1 auto; text-align: right; font-size: 13px; font-weight: 800;
                 color: #0a8f66; font-variant-numeric: tabular-nums;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                 padding-right: 4px; min-width: 60px; }

  .lr-actions { display: flex; align-items: center; justify-content: center;
                gap: 4px; flex-shrink: 0; }
  .lr-btn { width: 24px; height: 24px; border-radius: 6px;
            display: grid; place-items: center; color: #b8bfcd;
            font-size: 12px; transition: .14s; }
  .lr-edit:hover { background: #eef3ff; color: #4f7cff; }
  .lr-del:hover { background: #ffe9eb; color: #e8455a; }

  .list-empty { padding: 32px 20px; text-align: center; color: #b8bfcd;
                font-size: 13px; font-weight: 500; }
  .list-empty .ico { font-size: 28px; display: block; margin-bottom: 6px; opacity: .4; }
  .list-empty .hint { font-size: 11.5px; color: #cdd4e2; margin-top: 4px; }

  /* 第三排：左费用 右备注 */
  .row-foot { flex: var(--row-foot-fr) 1 0; min-height: 0;
              display: flex; padding: 0 6px 8px; }
  .foot-left { flex: var(--row-foot-left-fr) 1 0; min-width: 0;
               padding: 8px 4px 0 8px;
               display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
  .foot-left::-webkit-scrollbar { width: 5px; }
  .foot-left::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }
  .foot-right { flex: 1 1 0; min-width: 0; padding: 8px 8px 0 4px;
                display: flex; flex-direction: column; gap: 6px; }

  /* 费用行 */
  .fee-list { display: flex; flex-direction: column; gap: 6px; }
  .fee-line { display: grid;
              grid-template-columns: 78px 66px minmax(0, 1fr) 24px;
              gap: 8px; align-items: center;
              padding: 2px 0; }
  .fee-name { font-size: 12px; font-weight: 800; color: #4a5368;
              white-space: nowrap; text-align: right; }
  .fee-toggle-cell { display: flex; align-items: center; justify-content: flex-start; }
  .fee-input { width: 100%; height: 32px; padding: 0 10px;
               border: 1.5px solid #e9edf5; border-radius: 8px;
               font-size: 13px; font-weight: 800;
               color: #0ea5e9; background: #fff;
               text-align: right; outline: none;
               font-variant-numeric: tabular-nums;
               transition: .15s; min-width: 0; }
  .fee-input:focus { border-color: #0ea5e9; box-shadow: 0 0 0 3px rgba(14,165,233,.12); }
  .fee-input::placeholder { color: #cdd4e2; font-weight: 600; }
  .fee-input.consume { color: #7c3aed; border-color: #e9d5ff; }
  .fee-input.consume:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,.12); }
  .fee-input.install { color: #d97706; border-color: #fde68a; }
  .fee-input.install:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.14); }
  .fee-input.excluded { opacity: .45; }
  .fee-unit { font-size: 11.5px; color: #b8bfcd; font-weight: 700; text-align: left; }

  .inc-toggle { display: inline-flex; align-items: center; gap: 3px;
                font-size: 10px; font-weight: 800; color: #0a8f66;
                cursor: pointer; flex-shrink: 0;
                padding: 1px 6px; border-radius: 999px;
                background: #e8f9f1; border: 1px solid #c9eddc;
                transition: .15s; user-select: none; }
  .inc-toggle input { width: 12px; height: 12px; cursor: pointer;
                      accent-color: #0a8f66; margin: 0; }
  .inc-toggle.off { background: #f0f3fa; color: #b8bfcd; border-color: #e2e7f0; }
  .inc-toggle.off input { accent-color: #b8bfcd; }

  .rich-editor { flex: 1; min-height: 60px; max-height: none; overflow-y: auto;
    padding: 10px 12px; border: 1.5px solid #e9edf5; border-radius: 10px;
    font-size: 13px; font-weight: 500; color: #1a1f36;
    background: #fafbfe; outline: none; transition: .15s;
    word-break: break-word; line-height: 1.55; white-space: pre-wrap; }
  .rich-editor:focus { border-color: #7743e0; background: #fff;
                       box-shadow: 0 0 0 3px rgba(119,67,224,.1); }
  .rich-editor:empty::before { content: attr(data-placeholder);
                               color: #cdd4e2; font-weight: 500; }
  .rich-editor img { max-width: 100%; max-height: 160px;
                     border-radius: 6px; display: block;
                     margin: 4px 0; border: 1px solid #eef2f9; }
  .rich-editor::-webkit-scrollbar { width: 5px; }
  .rich-editor::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  /* 弹窗 & Toast */
  .modal-backdrop { position: fixed; inset: 0; z-index: 300;
                    background: rgba(26,31,54,.42); backdrop-filter: blur(3px);
                    display: none; align-items: center; justify-content: center;
                    padding: 20px; }
  .modal-backdrop.show { display: flex; }
  .modal-panel { background: #fff; border-radius: 16px; width: min(440px, 100%);
                 max-height: 90vh; display: flex; flex-direction: column;
                 box-shadow: 0 24px 60px rgba(26,31,54,.28); overflow: hidden;
                 animation: popIn .22s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes popIn {
    from { transform: translateY(12px) scale(.97); opacity: 0; }
    to { transform: none; opacity: 1; }
  }
  .modal-head { padding: 16px 18px 12px; border-bottom: 1px solid #f1f4fa;
                display: flex; align-items: center; gap: 8px; }
  .modal-title { font-size: 15px; font-weight: 800; color: #1a1f36; }
  .modal-close { margin-left: auto; width: 28px; height: 28px; border-radius: 8px;
                 display: grid; place-items: center; color: #b8bfcd;
                 font-size: 20px; line-height: 1; transition: .14s; }
  .modal-close:hover { background: #ffe9eb; color: #e8455a; }
  .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px 8px; }
  .form-grid { display: grid; grid-template-columns: 70px minmax(0,1fr);
               gap: 10px 12px; align-items: center; }
  .form-grid label { font-size: 12.5px; font-weight: 700; color: #4a5368; text-align: right; }
  .form-grid label .req { color: #e8455a; margin-left: 2px; }
  .form-grid input, .form-grid select {
    width: 100%; height: 38px; padding: 0 12px;
    border: 1.5px solid #e9edf5; border-radius: 8px;
    font-size: 13px; font-weight: 600; color: #1a1f36;
    background: #fafbfe; outline: none; transition: .15s; }
  .form-grid input:focus, .form-grid select:focus {
    border-color: #4f7cff; background: #fff;
    box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .form-grid input::placeholder { color: #b8bfcd; font-weight: 500; }
  .form-grid .qty-row { display: contents; }
  .form-grid .qty-row.hide { display: none; }
  .modal-foot { padding: 12px 18px 16px; border-top: 1px solid #f1f4fa;
                background: #fbfcfe; display: flex; gap: 8px; justify-content: flex-end; }
  .modal-foot .btn { height: 36px; padding: 0 16px; font-size: 13px; }
  .modal-foot .btn.danger { margin-right: auto; }

  .stage-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;
                max-height: 320px; overflow-y: auto; }
  .stage-list::-webkit-scrollbar { width: 5px; }
  .stage-list::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }
  .stage-row { display: flex; align-items: center; gap: 8px;
               padding: 9px 12px; background: #f8fafd;
               border: 1px solid #eef2f9; border-radius: 8px;
               font-size: 13px; transition: .14s; }
  .stage-row:hover { background: #fff; border-color: #c8d8ff; }
  .stage-row-name { flex: 1; min-width: 0; font-weight: 700; color: #1a1f36;
                    padding: 2px 4px; margin: -2px -4px;
                    border-radius: 5px; cursor: text;
                    overflow: hidden; text-overflow: ellipsis;
                    white-space: nowrap; }
  .stage-row-name:hover { background: #eef3ff; }
  .stage-row-name.editing { padding: 0; margin: 0; }
  .stage-row-name input { width: 100%; height: 26px; padding: 0 6px;
                          border: 1.5px solid #4f7cff; border-radius: 5px;
                          font: inherit; outline: none;
                          background: #fff; color: #1a1f36; }
  .stage-row-count { font-size: 11px; color: #8b93a7; font-weight: 600;
                     flex-shrink: 0; }
  .stage-row-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .stage-add-row { display: flex; gap: 8px; padding-top: 12px;
                   border-top: 1px dashed #e9edf5; }
  .stage-add-row input { flex: 1; height: 38px; padding: 0 12px;
                         border: 1.5px solid #e9edf5; border-radius: 8px;
                         font-size: 13px; font-weight: 600;
                         color: #1a1f36; background: #fafbfe;
                         outline: none; transition: .15s; }
  .stage-add-row input:focus { border-color: #4f7cff; background: #fff;
                               box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .stage-add-row input::placeholder { color: #b8bfcd; font-weight: 500; }
  .stage-add-row .btn { height: 38px; padding: 0 16px; font-size: 13px; }

  .toast { position: fixed; top: 60px; left: 50%;
           transform: translateX(-50%) translateY(-20px);
           background: linear-gradient(140deg, #16c58c, #0a8f66);
           color: #fff; padding: 12px 24px; border-radius: 10px;
           font-size: 13px; font-weight: 700;
           box-shadow: 0 8px 24px rgba(16,185,129,.36);
           opacity: 0; pointer-events: none; transition: .28s;
           z-index: 500; white-space: pre-line; text-align: center; max-width: 80vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 移动端 */
  @media (max-width: 768px) {
    html, body { height: auto; min-height: 100%; overflow: auto; }
    .app { height: auto; min-height: 100dvh; overflow: visible; }
    .topbar { position: sticky; top: 0; z-index: 50; height: auto; padding: 8px;
              padding-top: calc(8px + env(safe-area-inset-top));
              flex-wrap: wrap; gap: 6px; }
    .brand { padding-right: 6px; font-size: 13px; }
    .brand .logo-sq { width: 22px; height: 22px; font-size: 12px; }
    .order-wrap { width: 100%; order: 10; }
    .order-input { flex: 1; height: 40px; font-size: 15px; width: auto; }
    .sync-status { display: none; }
    .btn { height: 40px; padding: 0 12px; font-size: 13px; }
    .btn.save { height: 40px; padding: 0 14px; }
    .topbar .btn span.lbl { display: none; }
    .main { display: block; padding: 6px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
    .lib { width: 100%; margin-bottom: 8px; display: flex; }
    .lib-body { max-height: 340px; }
    .order-list { max-height: 340px; }
    .lib-search { height: 40px; font-size: 15px; }
    .lib-add-btn { height: 40px; padding: 0 14px; font-size: 13px; }
    .lib-tab { padding: 6px 12px; font-size: 13px; }
    .toggle-btn { height: 42px; font-size: 14px; }
    .m-item { grid-template-columns: 22px 24px minmax(0,1fr) 50px 26px 26px 26px;
              padding: 10px 6px; gap: 4px; }
    .m-check { width: 22px; height: 22px; border-radius: 6px; }
    .m-fav { width: 26px; height: 26px; font-size: 16px; }
    .m-unit { display: none; }
    .m-name { font-size: 14px; }
    .m-price { font-size: 13px; }
    .m-btn { width: 26px; height: 26px; font-size: 14px; }
    .m-add { font-size: 16px; }
    .order-item-row { padding: 12px; }
    .order-item-row .no { font-size: 15px; }

    .list { width: 100%; display: block !important; }
    .h-splitter { display: none !important; }
    .v-splitter { display: none !important; }

    .grand-bar { padding: 10px 12px; gap: 8px; flex-wrap: wrap; }
    .grand-bar .gb-lbl { font-size: 13px; }
    .grand-bar .gb-val { font-size: 18px; padding: 6px 14px; border-radius: 9px; }
    .grand-bar .gb-formula { font-size: 11px; flex: 1 1 100%; order: 10;
                             white-space: normal; line-height: 1.5; }

    .row-head { padding: 10px; gap: 8px; }
    .fld { flex: 1 1 100%; }
    .fld.fld-order { flex: 1 1 100%; }
    .fld input, .fld .ro-display { height: 42px; font-size: 15px; }
    .row-mid { display: block !important; flex: none !important;
               padding: 0 10px 10px; border-bottom: none; }
    .row-foot { display: block !important; flex: none !important;
                padding: 0 10px 10px; }
    .mid-left, .mid-right, .foot-left, .foot-right {
      flex: none !important; width: auto !important; padding: 8px 0;
    }

    .pt-table { font-size: 13.5px; }
    .pt-table thead th, .pt-table tbody td { padding: 10px 12px; }
    .sec-totals { gap: 4px; }
    .pt-total-item { font-size: 11px; padding: 2px 7px; }

    .list-row-header { display: none; }
    .list-row { display: grid;
                grid-template-columns: 1fr;
                gap: 6px; padding: 12px 10px;
                background: #fafbfe; border: 1px solid #eef2f9; border-radius: 12px;
                margin-bottom: 8px; }
    .lr-calc { justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    .lr-price { flex: 0 0 90px; height: 36px; font-size: 14px;
                background: #fff; border-color: #e9edf5; }
    .lr-qty-wrap { flex: 0 0 110px; }
    .lr-qty { height: 36px; font-size: 14px;
              background: #fff; border-color: #e9edf5; }
    .lr-subtotal { font-size: 15px; }
    .lr-btn { width: 34px; height: 34px; font-size: 16px;
              background: #fff; border: 1px solid #e9edf5; border-radius: 8px; }
    .lr-actions { flex-direction: row; justify-content: flex-end; gap: 8px; }

    .fee-line { grid-template-columns: 68px 60px minmax(0,1fr) 22px; gap: 6px; }
    .fee-name { font-size: 13px; }
    .fee-input { height: 40px; font-size: 15px; }

    .modal-panel { width: 100%; max-width: 100%; border-radius: 20px 20px 0 0; max-height: 92vh; }
    .modal-body { padding: 16px 18px 8px; }
    .form-grid input, .form-grid select { height: 44px; font-size: 15px; }
  }
  @media (max-width: 380px) {
    .brand span.txt { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo-sq">💰</span>
      <span class="txt">成本单</span>
    </div>
    <div class="order-wrap">
      <span class="order-label">单号</span>
      <input class="order-input" id="orderInput" type="text"
             placeholder="输入或从左侧选择…" maxlength="30" autocomplete="off">
    </div>
    <span class="spacer"></span>
    <div class="sync-status" id="syncStatus">
      <span class="dot"></span><span id="syncText">连接中…</span>
    </div>
    <button class="btn" id="importBtn" title="从文件导入">📥 <span class="lbl">导入</span></button>
    <button class="btn" id="exportBtn" title="导出为 JSON">📤 <span class="lbl">导出</span></button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <button class="btn save" id="saveBtn">💾 保存</button>
  </header>

  <div class="main">
    <!-- ============ 左：材料库/单号库 ============ -->
    <aside class="lib">
      <div class="lib-toggle">
        <button class="toggle-btn orders-active" id="tabOrders">
          📋 单号 <span class="cnt" id="orderCnt">0</span>
        </button>
        <button class="toggle-btn" id="tabMaterials">🧵 材料</button>
      </div>

      <div class="lib-panel hide" id="panelMaterials">
        <div class="lib-head">
          <input class="lib-search" id="libSearch" type="text"
                 placeholder="搜索材料 / 规格…" autocomplete="off">
          <button class="lib-add-btn" id="libAddBtn" title="添加新材料">＋ 材料</button>
        </div>
        <div class="lib-tabs" id="libTabs"></div>
        <div class="lib-selbar" id="libSelbar">
          已选 <b id="selCount">0</b> 项
          <button class="btn" id="clearSelBtn">清除</button>
          <button class="btn primary" id="addSelectedBtn">加入清单</button>
        </div>
        <div class="lib-body" id="libBody"></div>
      </div>

      <div class="lib-panel order-panel" id="panelOrders">
        <div class="lib-head">
          <input class="lib-search" id="orderSearch" type="text"
                 placeholder="搜索单号…" autocomplete="off">
          <button class="btn" id="refreshOrdersBtn" title="从日程表刷新">🔄</button>
        </div>
        <div class="order-list" id="orderListBody"></div>
      </div>
    </aside>

    <!-- ============ 右：主面板 ============ -->
    <section class="list">

      <!-- ★ 总成本置顶 -->
      <div class="grand-bar">
        <span class="gb-lbl">💰 总成本</span>
        <span class="gb-formula" id="grandFormula"></span>
        <span class="gb-val zero" id="grandTotal">¥0.00</span>
      </div>

      <!-- 第一排：只有 4 个字段 -->
      <div class="row-head">
        <div class="fld fld-order">
          <label>清单号</label>
          <div class="ro-display empty" id="listOrderDisplay">未选单号</div>
        </div>
        <div class="fld">
          <label>客户</label>
          <input id="fCustomer" type="text" placeholder="客户名称" maxlength="40">
        </div>
        <div class="fld">
          <label>送货时间</label>
          <input id="fDeliveryTime" type="text" placeholder="如：9/28 上午 10:00" maxlength="40">
        </div>
        <div class="fld">
          <label>额外备注</label>
          <input id="fNote" type="text" placeholder="简短备注" maxlength="80">
        </div>
      </div>

      <!-- 第二排：左材料 右兼职（逐行表格） -->
      <div class="row-mid" id="rowMid">
        <div class="mid-left">
          <div class="sec-head">
            <span class="sec-title">🧵 材料清单</span>
            <span class="sec-info" id="listInfo">0 项</span>
            <span class="sec-total" id="matTotalDisplay">¥0.00</span>
            <button class="btn-clear" id="clearListBtn">清空</button>
          </div>
          <div class="list-body" id="listBody"></div>
        </div>
        <div class="v-splitter" id="splitterRowMid" title="拖动调整左右宽度"></div>
        <div class="mid-right">
          <div class="sec-head">
            <span class="sec-title">💼 兼职</span>
            <span class="sec-info" id="ptInfo"></span>
            <span class="sec-totals" id="ptTotals"></span>
          </div>
          <div class="pt-wrap">
            <table class="pt-table">
              <colgroup>
                <col class="col-date">
                <col class="col-meal">
                <col class="col-fee">
              </colgroup>
              <thead>
                <tr>

function evalExpr(str) {
  if (str === null || str === undefined) return null;
  const raw = String(str).trim();
  if (raw === '') return 0;
  const s = raw.replace(/\s+/g, '');
  if (!/^[\d+\-*/().]+$/.test(s)) return null;
  if (!/[\d)]$/.test(s)) return null;
  try {
    const result = Function('"use strict"; return (' + s + ');')();
    if (typeof result === 'number' && isFinite(result)) return result;
    return null;
  } catch (e) { return null; }
}

function loadLayout() {
  try {
    const raw = localStorage.getItem(LOCAL_LAYOUT_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.rowMidLeftFr === 'number' && d.rowMidLeftFr > 0.2 && d.rowMidLeftFr < 5)
      document.documentElement.style.setProperty('--row-mid-left-fr', d.rowMidLeftFr);
    if (typeof d.rowFootLeftFr === 'number' && d.rowFootLeftFr > 0.2 && d.rowFootLeftFr < 5)
      document.documentElement.style.setProperty('--row-foot-left-fr', d.rowFootLeftFr);
    if (typeof d.rowMidFr === 'number' && d.rowMidFr > 0.2 && d.rowMidFr < 5)
      document.documentElement.style.setProperty('--row-mid-fr', d.rowMidFr);
    if (typeof d.rowFootFr === 'number' && d.rowFootFr > 0.2 && d.rowFootFr < 5)
      document.documentElement.style.setProperty('--row-foot-fr', d.rowFootFr);
  } catch (e) {}
}
function saveLayout() {
  try {
    const css = getComputedStyle(document.documentElement);
    const get = (k, def) => {
      const v = parseFloat(css.getPropertyValue(k));
      return (isFinite(v) && v > 0) ? v : def;
    };
    localStorage.setItem(LOCAL_LAYOUT_KEY, JSON.stringify({
      rowMidLeftFr: get('--row-mid-left-fr', 1.6),
      rowFootLeftFr: get('--row-foot-left-fr', 1),
      rowMidFr: get('--row-mid-fr', 1.4),
      rowFootFr: get('--row-foot-fr', 1),
    }));
  } catch (e) {}
}
function bindSplitter(el, onMove, kind) {
  if (!el) return;
  let dragging = false;
  const start = () => { dragging = true; el.classList.add('active');
    document.body.classList.add('dragging', kind); };
  const end = () => { if (!dragging) return; dragging = false; el.classList.remove('active');
    document.body.classList.remove('dragging', 'v', 'h'); saveLayout(); };
  el.addEventListener('mousedown', e => {
    if (window.innerWidth <= 768) return;
    e.preventDefault(); start();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return; e.preventDefault();
    onMove(e.clientX, e.clientY);
  });
  document.addEventListener('mouseup', end);
  el.addEventListener('touchstart', e => {
    if (window.innerWidth <= 768) return;
    if (e.touches.length !== 1) return; e.preventDefault(); start();
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!dragging || e.touches.length !== 1) return;
    e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  document.addEventListener('touchend', end);
  document.addEventListener('touchcancel', end);
}
function setupSplitters() {
  bindSplitter($('splitterRowMid'), (cx) => {
    const mid = $('rowMid'); if (!mid) return;
    const rect = mid.getBoundingClientRect();
    const total = rect.width - 8;
    if (total <= 0) return;
    let ratio = (cx - rect.left) / total;
    ratio = Math.max(0.25, Math.min(0.85, ratio));
    const fr = Math.round((ratio / (1 - ratio)) * 1000) / 1000;
    document.documentElement.style.setProperty('--row-mid-left-fr', fr);
  }, 'v');
  bindSplitter($('splitterRowFoot'), (cx) => {
    const foot = $('rowFoot'); if (!foot) return;
    const rect = foot.getBoundingClientRect();
    const total = rect.width - 8;
    if (total <= 0) return;
    let ratio = (cx - rect.left) / total;
    ratio = Math.max(0.25, Math.min(0.85, ratio));
    const fr = Math.round((ratio / (1 - ratio)) * 1000) / 1000;
    document.documentElement.style.setProperty('--row-foot-left-fr', fr);
  }, 'v');
  bindSplitter($('splitterRowMain'), (cx, cy) => {
    const list = document.querySelector('.list');
    const rowMid = $('rowMid');
    const rowFoot = $('rowFoot');
    const rowHead = list && list.querySelector('.row-head');
    const grandBar = list && list.querySelector('.grand-bar');
    if (!list || !rowMid || !rowFoot || !rowHead) return;
    const listRect = list.getBoundingClientRect();
    const headH = rowHead.getBoundingClientRect().height;
    const grandH = grandBar ? grandBar.getBoundingClientRect().height : 0;
    const splitH = 8;
    const avail = listRect.height - headH - grandH - splitH;
    if (avail <= 60) return;
    let midH = cy - listRect.top - headH - grandH - splitH / 2;
    midH = Math.max(80, Math.min(avail - 80, midH));
    const ratio = midH / avail;
    document.documentElement.style.setProperty('--row-mid-fr', Math.round(ratio * 1000) / 1000);
    document.documentElement.style.setProperty('--row-foot-fr', Math.round((1 - ratio) * 1000) / 1000);
  }, 'h');
}

const timeToMin = t => { if (!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; };
const durationMin = (s, e) => {
  if (!s || !e) return 0;
  const sm = timeToMin(s), em = timeToMin(e);
  return em > sm ? em - sm : 0;
};
function recordMinutes(r) {
  if (r.start_time && r.end_time) return durationMin(r.start_time, r.end_time);
  if (r.minutes) return Number(r.minutes) || 0;
  return 0;
}
function fmtDurShort(min) {
  const m = Math.round(Number(min) || 0);
  if (m <= 0) return '';
  const h = Math.floor(m / 60), mm = m % 60;
  if (h && mm) return `${h}h${mm}m`;
  if (h) return `${h}h`;
  return `${mm}m`;
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= ★ 订单当日用时 & 餐费分摊（与 schedule 一致） ================= */
function orderDayMinutes(date, orderNo) {
  const key = date + '|' + orderNo;
  if (state.scheduleTotals[key] !== undefined) return Number(state.scheduleTotals[key]) || 0;
  let t = 0;
  state.scheduleItems.forEach(r => {
    if (r.date !== date) return;
    if (String(r.sub || '').trim() !== orderNo) return;
    t += recordMinutes(r) * Math.max(1, Number(r.people) || 1);
  });
  return t;
}

function calcOrderMinutes(orderNo) {
  const dates = new Set();
  state.scheduleItems.forEach(r => {
    if (String(r.sub || '').trim() === orderNo) dates.add(r.date);
  });
  let total = 0;
  dates.forEach(d => { total += orderDayMinutes(d, orderNo); });
  return total;
}
function calcOrderParttimeFee(orderNo) {
  const mins = calcOrderMinutes(orderNo);
  return Math.round((mins / 60) * PARTTIME_RATE * 100) / 100;
}

/* ★ 计算某订单所有日期的分摊餐费合计 */
function calcOrderMealTotal(orderNo) {
  const norm = String(orderNo || '').trim();
  if (!norm) return 0;
  const dates = new Set();
  state.scheduleItems.forEach(r => {
    if (String(r.sub || '').trim() === norm) dates.add(r.date);
  });
  let total = 0;
  dates.forEach(d => {
    const alloc = calcMealAllocationForDate(d)[norm] || { total: 0 };
    total += Number(alloc.total) || 0;
  });
  return Math.round(total * 100) / 100;
}

/* ★ 复刻 schedule.html 的「按分钟比例分摊餐费」算法，返回 { 单号: {lunch, dinner, total} } */
const mealAllocCache = {};
function calcMealAllocationForDate(date) {
  if (mealAllocCache[date]) return mealAllocCache[date];
  const f = state.scheduleFees[date] || {};
  const lunchTotal = Number(f.lunch) || 0;
  const dinnerTotal = Number(f.dinner) || 0;
  const result = {};
  if (lunchTotal <= 0 && dinnerTotal <= 0) {
    mealAllocCache[date] = result;
    return result;
  }
  const list = state.scheduleItems.filter(it => it.date === date && it.status === 'actual');
  const groups = {};
  list.forEach(it => {
    const key = String(it.sub || '').trim() || ('__no_' + (it.id || uid()));
    if (!groups[key]) groups[key] = { order: String(it.sub || '').trim(), records: [] };
    groups[key].records.push(it);
  });
  const orderMins = Object.values(groups).map(g => {
    const tKey = date + '|' + g.order;
    let min;
    if (state.scheduleTotals[tKey] !== undefined) min = Number(state.scheduleTotals[tKey]) || 0;
    else {
      min = 0;
      g.records.forEach(r => { min += recordMinutes(r) * Math.max(1, Number(r.people) || 1); });
    }
    return { order: g.order, min };
  });
  if (!orderMins.length) { mealAllocCache[date] = result; return result; }
  const totalMin = orderMins.reduce((s, o) => s + o.min, 0);
  if (totalMin <= 0) {
    orderMins.forEach(o => { result[o.order] = { lunch: 0, dinner: 0, total: 0 }; });
    mealAllocCache[date] = result;
    return result;
  }
  let lunchSum = 0, dinnerSum = 0;
  orderMins.forEach((o, i) => {
    let l, d;
    if (i === orderMins.length - 1) {
      l = Math.round((lunchTotal - lunchSum) * 100) / 100;
      d = Math.round((dinnerTotal - dinnerSum) * 100) / 100;
    } else {
      const ratio = o.min / totalMin;
      l = Math.round(lunchTotal * ratio * 100) / 100;
      d = Math.round(dinnerTotal * ratio * 100) / 100;
      lunchSum += l; dinnerSum += d;
    }
    result[o.order] = { lunch: l, dinner: d, total: Math.round((l + d) * 100) / 100 };
  });
  mealAllocCache[date] = result;
  return result;
}
function clearMealAllocCache() {
  Object.keys(mealAllocCache).forEach(k => delete mealAllocCache[k]);
}

async function loadFromCloud() {
  try {
    setSyncStatus('加载中…', false);
    const { data: mats, error: e1 } = await supa.from('custom_materials').select('*');
    if (!e1 && mats) {
      state.customMaterials = mats.map(m => ({
        id: m.id, stage: m.stage || '', name: m.name,
        spec: m.spec || '', unit: m.unit || '', price: Number(m.price) || 0,
      }));
    }
    /* ★ 带上 id，保证与 schedule 的分组分摊口径一致 */
    const { data: items, error: e2 } = await supa.from('schedule_items')
      .select('id, date, sub, status, start_time, end_time, minutes, people, kind');
    if (!e2 && items) {
      state.scheduleItems = items.filter(x => x.status === 'actual');
      const map = {};
      items.forEach(it => {
        const o = String(it.sub || '').trim();
        if (!o || it.status !== 'actual') return;
        if (!map[o]) map[o] = new Set();
        map[o].add(it.date);
      });
      /* ★ 按最近日期排序（最新在前） */
      state.scheduleOrders = Object.keys(map).map(o => ({
        order: o, dates: Array.from(map[o]).sort(),
      })).sort((a, b) => {
        const aLast = a.dates[a.dates.length - 1] || '';
        const bLast = b.dates[b.dates.length - 1] || '';
        return bLast.localeCompare(aLast);
      });
    }
    const { data: totals, error: e3 } = await supa.from('schedule_totals').select('*');
    if (!e3 && totals) {
      state.scheduleTotals = {};
      totals.forEach(t => {
        state.scheduleTotals[t.date + '|' + t.order_key] = Number(t.minutes) || 0;
      });
    }
    try {
      const { data: fees, error: e4 } = await supa.from('schedule_fees').select('*');
      if (!e4 && fees) {
        state.scheduleFees = {};
        fees.forEach(f => {
          state.scheduleFees[f.date] = {
            lunch: Number(f.lunch) || 0,
            dinner: Number(f.dinner) || 0,
            amount: Number(f.amount) || 0,
            people: Number(f.people) || 0,
          };
        });
      }
    } catch (feeErr) { console.warn('餐费加载失败', feeErr); }
    clearMealAllocCache();
    setSyncStatus('已同步', false);
  } catch (e) {
    console.warn('云端加载失败', e);
    setSyncStatus('离线模式', true);
  }
}

function normalizeItem(it) {
  const o = {
    id: it.id || uid(),
    stage: it.stage || '',
    name: it.name || '未命名',
    spec: it.spec || '',
    unit: it.unit || '',
    price: Number(it.price) || 0,
    qty: Number(it.qty) || 0,
  };
  if (typeof it.qtyExpr === 'string' && it.qtyExpr.trim() !== '') {
    o.qtyExpr = it.qtyExpr;
  }
  return o;
}

function calcOrderFees(orderNo) {
  const entry = state.scheduleOrders.find(o => o.order === orderNo);
  const dates = entry ? entry.dates : [];
  const parttime = calcOrderParttimeFee(orderNo);
  let material = 0;
  state.items.forEach(it => {
    material += (Number(it.price) || 0) * (Number(it.qty) || 0);
  });
  state.orderFees = {
    parttime,
    material: Math.round(material * 100) / 100,
    days: dates.length,
  };
}

function calcGrandTotal() {
  const f = state.orderFees;
  const mealTotal = calcOrderMealTotal(state.orderNo.trim());
  let g = (Number(f.material) || 0) + (Number(f.parttime) || 0) +
          (Number(state.consumableCost) || 0) +
          (Number(state.installationFee) || 0) +
          mealTotal;
  if (state.installIncluded) g += Number(state.installFee) || 0;
  if (state.shippingIncluded) g += Number(state.shippingFee) || 0;
  return Math.round(g * 100) / 100;
}

/* ★ 构造总成本公式：材料 + 兼职费 + 餐费 + 安装费 + 耗材 + 铁艺 + 运费 = 总成本 */
function buildGrandFormula() {
  const f = state.orderFees;
  const matTotal = Number(f.material) || 0;
  const ptFee = Number(f.parttime) || 0;
  const installFee = Number(state.installationFee) || 0;
  const consumableCost = Number(state.consumableCost) || 0;
  const ironFee = state.installIncluded ? (Number(state.installFee) || 0) : 0;
  const shippingFee = state.shippingIncluded ? (Number(state.shippingFee) || 0) : 0;
  const mealTotal = calcOrderMealTotal(state.orderNo.trim());

  const parts = [];
  if (matTotal > 0.005) parts.push(`材料 ¥${matTotal.toFixed(2)}`);
  if (ptFee > 0.005) parts.push(`兼职费 ¥${ptFee.toFixed(2)}`);
  if (mealTotal > 0.005) parts.push(`餐费 ¥${mealTotal.toFixed(2)}`);
  if (installFee > 0.005) parts.push(`安装费 ¥${installFee.toFixed(2)}`);
  if (consumableCost > 0.005) parts.push(`耗材 ¥${consumableCost.toFixed(2)}`);
  if (ironFee > 0.005) parts.push(`铁艺 ¥${ironFee.toFixed(2)}`);
  if (shippingFee > 0.005) parts.push(`运费 ¥${shippingFee.toFixed(2)}`);

  const excl = [];
  if (!state.installIncluded && (Number(state.installFee) || 0) > 0.005) excl.push('铁艺');
  if (!state.shippingIncluded && (Number(state.shippingFee) || 0) > 0.005) excl.push('运费');

  let formula = parts.length ? parts.join(' + ') : '暂无费用';
  if (excl.length) formula += `（已排除：${excl.join('、')}）`;
  return formula;
}

let autoSaveTimer = null;
function buildPayload() {
  const orderNo = state.orderNo.trim();
  let materialTotal = 0;
  state.items.forEach(it => {
    materialTotal += (Number(it.price) || 0) * (Number(it.qty) || 0);
  });
  materialTotal = Math.round(materialTotal * 100) / 100;
  const grand = calcGrandTotal();
  return {
    order_no: orderNo,
    items: state.items,
    note: state.orderInfo.note || '',
    customer: state.orderInfo.customer || '',
    delivery_time: state.orderInfo.delivery_time || '',
    extra_note: state.orderInfo.extra_note || '',
    install_fee: state.installFee || 0,
    shipping_fee: state.shippingFee || 0,
    total: materialTotal,
    grand_total: grand,
    updated_at: new Date().toISOString(),
  };
}
async function upsertOrder(payload) {
  const full = Object.assign({}, payload, {
    consumable_cost: state.consumableCost || 0,
    installation_fee: state.installationFee || 0,
  });
  let { error } = await supa.from('order_materials').upsert(full);
  if (!error) return;
  const lite1 = Object.assign({}, payload, {
    consumable_cost: state.consumableCost || 0,
  });
  ({ error } = await supa.from('order_materials').upsert(lite1));
  if (!error) return;
  ({ error } = await supa.from('order_materials').upsert(payload));
  if (error) throw error;
}

function autoSave() {
  saveLocal();
  if (!state.orderNo.trim()) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(async () => {
    autoSaveTimer = null;
    const orderNo = state.orderNo.trim();

    try {
      setSyncStatus('同步中…', false);
      await upsertOrder(buildPayload());
      setSyncStatus('已同步', false);

}

function renderOrderList() {
  const box = $('orderListBody');

  /* ★ 渲染前再次按最近日期排序（最新在前） */
  list = list.slice().sort((a, b) => {
    const aLast = a.dates[a.dates.length - 1] || '';

    return bLast.localeCompare(aLast);
  });
  if (!list.length) {
    box.innerHTML = `<div class="lib-empty"><span class="ico">📋</span>${
      state.scheduleOrders.length ? '没有匹配的单号' : '日程表里暂无实际单号'

  box.innerHTML = '';
  list.forEach(o => {
    const row = document.createElement('div');
    row.className = 'order-item-row' + (o.order === state.orderNo ? ' current' : '');
    const d0 = o.dates[0] || '';
    const d1 = o.dates[o.dates.length - 1] || '';

    row.innerHTML = `

/* ★ 第二排右侧「兼职」：逐行表格 —— 一行一个日期
   餐费 = schedule 中该订单当天的分摊餐费
   费用 = 该订单当天用时（分钟）/60 × 15 + 安装费按基础费用比例分摊
   右上角合计：餐费合计 + 费用合计 + 总合计（餐费+费用） */
function renderPtBox() {
  const tbody = $('ptBody');
  const totalsEl = $('ptTotals');
  const infoEl = $('ptInfo');
  if (!tbody) return;

  const entry = state.scheduleOrders.find(o => o.order === state.orderNo);
  const dates = entry ? entry.dates : [];

  if (!dates.length) {
    tbody.innerHTML = '<tr><td colspan="3" class="pt-empty">暂无数据</td></tr>';
    if (totalsEl) {
      totalsEl.innerHTML =
        `<span class="pt-total-item meal">餐费 ¥0.00</span>` +
        `<span class="pt-total-item fee">费用 ¥0.00</span>` +
        `<span class="pt-total-item total">总合计 ¥0.00</span>`;
    }
    if (infoEl) infoEl.textContent = '0 天';
    return;
  }

  const orderNo = state.orderNo;
  const installFee = Number(state.installationFee) || 0;

  // 先计算每天的基础费用（计时费用）
  const baseFees = [];
  let sumBaseFee = 0;
  let sumMin = 0;
  dates.forEach(d => {
    const mins = orderDayMinutes(d, orderNo);
    const fee = Math.round((mins / 60) * PARTTIME_RATE * 100) / 100;
    baseFees.push(fee);
    sumBaseFee += fee;
    sumMin += mins;
  });
  sumBaseFee = Math.round(sumBaseFee * 100) / 100;

  // 计算安装费分摊比例
  let installAlloc = dates.map(() => 0);
  if (installFee > 0) {
    if (sumBaseFee > 0) {
      installAlloc = baseFees.map(f => Math.round((f / sumBaseFee) * installFee * 100) / 100);
      const totalAlloc = installAlloc.reduce((s, v) => s + v, 0);
      const diff = Math.round((installFee - totalAlloc) * 100) / 100;
      if (diff !== 0) installAlloc[installAlloc.length - 1] =
        Math.round((installAlloc[installAlloc.length - 1] + diff) * 100) / 100;
    } else {
      const avg = Math.round((installFee / dates.length) * 100) / 100;
      installAlloc = dates.map(() => avg);
      const totalAlloc = installAlloc.reduce((s, v) => s + v, 0);
      const diff = Math.round((installFee - totalAlloc) * 100) / 100;
      if (diff !== 0) installAlloc[installAlloc.length - 1] =
        Math.round((installAlloc[installAlloc.length - 1] + diff) * 100) / 100;
    }
  }

  let rows = '';
  let sumMeal = 0;
  let sumFee = 0;

  dates.forEach((d, i) => {
    const alloc = calcMealAllocationForDate(d)[orderNo] || { lunch: 0, dinner: 0, total: 0 };
    const meal = Math.round((Number(alloc.total) || 0) * 100) / 100;
    const baseFee = baseFees[i];
    const fee = Math.round((baseFee + installAlloc[i]) * 100) / 100;

    sumMeal += meal;
    sumFee += fee;

    const parts = String(d).split('-');
    const mm = parseInt(parts[1], 10) || 0;
    const dd = parseInt(parts[2], 10) || 0;
    const minsLabel = fmtDurShort(orderDayMinutes(d, orderNo));

    rows += `<tr>
      <td class="pt-date">${mm}/${dd}${minsLabel ? `<small>${minsLabel} × ¥15</small>` : ''}</td>
      <td class="pt-meal${meal > 0 ? '' : ' zero'}">${meal > 0 ? '¥' + meal.toFixed(2) : '—'}</td>
      <td class="pt-fee${fee > 0 ? '' : ' zero'}">${fee > 0 ? '¥' + fee.toFixed(2) : '—'}</td>
    </tr>`;
  });

  tbody.innerHTML = rows;

  sumMeal = Math.round(sumMeal * 100) / 100;
  sumFee = Math.round(sumFee * 100) / 100;
  const sumAll = Math.round((sumMeal + sumFee) * 100) / 100;

  if (totalsEl) {
    totalsEl.innerHTML =
      `<span class="pt-total-item meal">餐费合计 ¥${sumMeal.toFixed(2)}</span>` +
      `<span class="pt-total-item fee">费用合计(含安装) ¥${sumFee.toFixed(2)}</span>` +
      `<span class="pt-total-item total">总合计 ¥${sumAll.toFixed(2)}</span>`;
  }
  if (infoEl) {
    infoEl.textContent = `${dates.length} 天 · 共 ${fmtDurShort(sumMin) || '0m'}`;
  }
}

function renderFeeSummary() {
  const f = state.orderFees;

  const matTotal = state.items.reduce((s, it) =>
    s + (Number(it.price) || 0) * (Number(it.qty) || 0), 0);
  const matEl = $('matTotalDisplay');
  if (matEl) matEl.textContent = '¥' + fmtMoney(matTotal);

  const grand = calcGrandTotal();
  const gEl = $('grandTotal');
  gEl.textContent = '¥' + grand.toFixed(2);
  gEl.className = 'gb-val' + (grand > 0 ? '' : ' zero');

  const ii = $('installInclude'), si = $('shippingInclude');
  if (ii) { ii.checked = state.installIncluded;
            ii.closest('.inc-toggle').classList.toggle('off', !state.installIncluded); }
  if (si) { si.checked = state.shippingIncluded;
            si.closest('.inc-toggle').classList.toggle('off', !state.shippingIncluded); }
  const ifi = $('installFeeInput'), sfi = $('shippingFeeInput');
  if (ifi) ifi.classList.toggle('excluded', !state.installIncluded);

function renderList() {
  const box = $('listBody');
  renderOrderDisplay();
  $('listInfo').textContent = state.items.length + ' 项';
  if (!state.items.length) {
    box.innerHTML = `<div class="list-empty"><span class="ico">🛒</span>清单是空的<div class="hint">在左侧材料库选材料后加入</div></div>`;
    renderFeeSummary();
    return;
  }
  let html = `
    <div class="list-row-header">
      <span>材料 / 分类</span>
      <span>单位</span>
      <span>单价 × 数量 = 小计</span>
      <span>操作</span>
    </div>
  `;
  state.items.forEach(it => {
    const price = Number(it.price) || 0;
    const qty = Number(it.qty) || 0;
    const sub = price * qty;
    const stageCls = it.stage ? '' : ' empty';
    const hasExpr = !!it.qtyExpr;
    html += `
      <div class="list-row" data-id="${it.id}">
        <div class="lr-name" title="双击编辑">
          <span class="lr-stage${stageCls}">${esc(it.stage || '未分类')}</span>
          <div class="lr-name-main">
            <span class="lr-name-text">${esc(it.name)}</span>
            ${it.spec ? `<small>${esc(it.spec)}</small>` : ''}
          </div>
        </div>
        <span class="lr-unit">${esc(it.unit || '-')}</span>
        <div class="lr-calc">
          <input class="lr-input lr-price" type="text" inputmode="decimal"
                 value="${price}" data-field="price" title="单价">
          <span class="lr-op">×</span>
          <div class="lr-qty-wrap${hasExpr ? ' has-expr' : ''}" data-qty-wrap="1">
            <input class="lr-input lr-qty" type="text" inputmode="text"
                   value="${qty}" data-field="qty"
                   title="数量（支持表达式，如 20+30）">
          </div>
          <span class="lr-op">=</span>
          <span class="lr-subtotal">¥${fmtMoney(sub)}</span>
        </div>
        <div class="lr-actions">
          <button class="lr-btn lr-edit" title="编辑材料">✎</button>
          <button class="lr-btn lr-del" title="删除材料">×</button>
        </div>
      </div>
    `;
  });
  box.innerHTML = html;

  box.querySelectorAll('.list-row').forEach(row => {
    const id = row.dataset.id;
    const item = state.items.find(x => x.id === id);
    if (!item) return;

    const priceInput = row.querySelector('.lr-price');
    priceInput.addEventListener('focus', () => { try { priceInput.select(); } catch(e){} });
    priceInput.addEventListener('blur', () => {
      const raw = priceInput.value.trim();
      const v = evalExpr(raw);
      if (v !== null && v >= 0) item.price = Math.round(v * 100) / 100;
      priceInput.value = String(item.price);
      const qty = Number(item.qty) || 0;
      row.querySelector('.lr-subtotal').textContent = '¥' + fmtMoney(item.price * qty);
      let t = 0;
      state.items.forEach(x => { t += (Number(x.price) || 0) * (Number(x.qty) || 0); });
      state.orderFees.material = Math.round(t * 100) / 100;
      renderFeeSummary(); autoSave();
    });
    priceInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); priceInput.blur(); }
      if (e.key === 'Escape') { e.preventDefault();
        priceInput.value = String(item.price); priceInput.blur(); }
    });

    const qtyInput = row.querySelector('.lr-qty');
    const qtyWrap = row.querySelector('.lr-qty-wrap');
    qtyInput.addEventListener('focus', () => {
      const raw = item.qtyExpr ? item.qtyExpr : String(item.qty);
      qtyInput.value = raw;
      try { qtyInput.select(); } catch(e){}
    });
    const commitQty = () => {
      const raw = qtyInput.value.trim();
      const v = evalExpr(raw);
      if (v !== null && v >= 0) {
        item.qty = Math.round(v * 1000) / 1000;
        if (/[+\-*/()]/.test(raw)) item.qtyExpr = raw;
        else item.qtyExpr = '';
      }
      qtyInput.value = String(item.qty);
      qtyWrap.classList.toggle('has-expr', !!item.qtyExpr);
      const price = Number(item.price) || 0;
      row.querySelector('.lr-subtotal').textContent = '¥' + fmtMoney(price * item.qty);
      let t = 0;
      state.items.forEach(x => { t += (Number(x.price) || 0) * (Number(x.qty) || 0); });
      state.orderFees.material = Math.round(t * 100) / 100;
      renderFeeSummary(); autoSave();
    };
    qtyInput.addEventListener('blur', commitQty);
    qtyInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); qtyInput.blur(); }
      if (e.key === 'Escape') { e.preventDefault();
        qtyInput.value = String(item.qty); qtyInput.blur(); }
    });

    row.querySelector('.lr-name').addEventListener('dblclick', e => {
      e.stopPropagation();
      openEditItemModal(id);
    });
    row.querySelector('.lr-edit').addEventListener('click', e => {
      e.stopPropagation();
      openEditItemModal(id);
    });
    row.querySelector('.lr-del').addEventListener('click', e => {
      e.stopPropagation();
      const it = state.items.find(x => x.id === id);
      if (!it) return;
      if (!confirm(`⚠️ 删除确认\n\n确定删除材料「${it.name}」吗？\n该操作会同步到云端，且无法撤销。`)) return;
      state.items = state.items.filter(x => x.id !== id);
      autoSave();
      calcOrderFees(state.orderNo);
      renderList(); renderFeeSummary();
    });
  });
  renderFeeSummary();
}

function addMaterialToCart(m) {
  if (!state.orderNo.trim()) { alert('请先选择或输入单号'); return; }
  const existing = state.items.find(it =>
    it.name === m.name && (it.spec || '') === (m.spec || '') && (it.stage || '') === (m.stage || ''));
  if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
  else state.items.push({
    id: uid(), stage: m.stage || '', name: m.name,
    spec: m.spec || '', unit: m.unit || '',
    price: Number(m.price) || 0, qty: 1,
  });
  autoSave();
  calcOrderFees(state.orderNo);
  renderList(); renderFeeSummary();
}

function addSelectedMaterials() {
  if (!state.orderNo.trim()) { alert('请先选择或输入单号'); return; }
  const keys = Array.from(state.selectedKeys);
  if (!keys.length) return;
  const mats = allMaterials();
  keys.forEach(k => {
    const m = mats.find(x => x._id === k);
    if (!m) return;
    const existing = state.items.find(it =>
      it.name === m.name && (it.spec || '') === (m.spec || '') && (it.stage || '') === (m.stage || ''));
    if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
    else state.items.push({
      id: uid(), stage: m.stage || '', name: m.name,
      spec: m.spec || '', unit: m.unit || '',
      price: Number(m.price) || 0, qty: 1,
    });
  });
  state.selectedKeys.clear();
  autoSave();
  calcOrderFees(state.orderNo);
  renderLibBody(); renderSelbar(); renderList(); renderFeeSummary();
}

async function saveEditMaterial() {
  const name = ($('editMatName').value || '').trim();
  if (!name) { alert('请填写材料名称'); return; }
  const stage = ($('editMatStage').value || '').trim();
  const spec = ($('editMatSpec').value || '').trim();
  const unit = ($('editMatUnit').value || '').trim();
  const price = Number($('editMatPrice').value) || 0;

  if (editingItemId) {
    const it = state.items.find(x => x.id === editingItemId);
    if (!it) { closeEditMatModal(); return; }
    it.stage = stage; it.name = name; it.spec = spec; it.unit = unit;
    it.price = price;
    const qtyRaw = ($('editMatQty').value || '').trim();
    const qtyVal = evalExpr(qtyRaw);
    if (qtyVal !== null && qtyVal >= 0) {
      it.qty = Math.round(qtyVal * 1000) / 1000;
      if (/[+\-*/()]/.test(qtyRaw)) it.qtyExpr = qtyRaw;
      else it.qtyExpr = '';
    }
    closeEditMatModal();
    autoSave();
    calcOrderFees(state.orderNo);
    renderList(); renderFeeSummary();
    return;
  }
  if (editingLibId) {
    const libId = editingLibId;
    if (libId.startsWith('c:')) {
      const cid = libId.slice(2);
      const cm = state.customMaterials.find(x => x.id === cid);
      if (cm) {
        cm.stage = stage; cm.name = name; cm.spec = spec;
        cm.unit = unit; cm.price = price;
        saveLocal();
        try { await supa.from('custom_materials').update({ stage, name, spec, unit, price }).eq('id', cid); }
        catch (e) { console.warn('云端更新失败', e); }
      }
    } else {
      state.matOverrides[libId] = { stage, name, spec, unit, price };
      saveLocal();
    }
    closeEditMatModal();
    renderLibTabs(); renderLibBody();
    showToast('✅ 已保存', 1500);
  }
}
