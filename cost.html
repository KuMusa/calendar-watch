function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============================================================
 *  兼职费计算（排除赵纯萍）
 * ============================================================ */
const LIMIT_H = 10, RATE_1 = 15, RATE_2 = 20, SPECIAL_NAME = '赵纯萍';
function calcHours(s, e) {
  if (!s || !e || s === e) return 0;
  const [sh, sm] = s.split(':').map(Number);
  const [eh, em] = e.split(':').map(Number);
  let start = sh + sm/60, end = eh + em/60;
  if (end <= start) end += 24;
  return Math.max(0, end - start);
}
function calcNormalWage(r) {
  const h = calcHours(r.start_time, r.end_time);
  if (h <= 0) return 0;
  const regular = Math.min(h, LIMIT_H);
  const overtime = h - regular;
  return regular * RATE_1 + overtime * RATE_2;
}
function calcDayParttime(date) {
  let total = 0;
  state.parttimeRecords
    .filter(r => r.date === date && String(r.name || '').trim() !== SPECIAL_NAME)
    .forEach(r => { total += calcNormalWage(r); });
  return Math.round(total * 100) / 100;
}

function saveLocal() {
  try {

      orderNo: state.orderNo,

}
function loadLocal() {
  try {

    state.orderNo = d.orderNo || '';
    state.orderInfo = Object.assign({
      customer: '', delivery_time: '', contact: '',
      address: '', paper_file: '', extra_note: '',
    }, d.orderInfo || {});
    state.installFee = Number(d.installFee) || 0;
    state.shippingFee = Number(d.shippingFee) || 0;
    state.items = Array.isArray(d.items) ? d.items : [];

  } catch (e) {}
}

/* ============================================================
 *  云端加载
 * ============================================================ */
async function loadFromCloud() {
  try {
    setSyncStatus('加载中…', false);
    const { data: mats, error: e1 } = await supa.from('custom_materials').select('*');
    if (!e1 && mats) {
      state.customMaterials = mats.map(m => ({
        id: m.id, stage: m.stage || '', name: m.name,
        spec: m.spec || '', unit: m.unit || '', price: Number(m.price) || 0,
      }));
    }
    const { data: items, error: e2 } = await supa.from('schedule_items')
      .select('date, sub, status').eq('status', 'actual');
    if (!e2 && items) {
      const map = {};
      items.forEach(it => {
        const o = String(it.sub || '').trim();
        if (!o) return;
        if (!map[o]) map[o] = new Set();
        map[o].add(it.date);
      });
      state.scheduleOrders = Object.keys(map).sort().map(o => ({
        order: o, dates: Array.from(map[o]).sort(),
      }));
    }
    const { data: pt, error: e3 } = await supa.from('parttime_records').select('*');
    if (!e3 && pt) state.parttimeRecords = pt;
    const { data: fees, error: e4 } = await supa.from('schedule_fees').select('*');
    if (!e4 && fees) {
      state.scheduleFees = fees.map(f => ({
        date: f.date,
        lunch: Number(f.lunch) || 0,
        dinner: Number(f.dinner) || 0,
      }));
    }
    setSyncStatus('已同步', false);
  } catch (e) {
    console.warn('云端加载失败', e);
    setSyncStatus('离线模式', true);
  }
}

async function loadOrder(orderNo) {
  if (!orderNo) return;
  try {
    setSyncStatus('加载中…', false);
    const { data, error } = await supa.from('order_materials')
      .select('*').eq('order_no', orderNo).maybeSingle();
    if (error) throw error;
    if (data) {
      state.items = Array.isArray(data.items) ? data.items : [];
      state.orderInfo = {
        customer: data.customer || '',
        delivery_time: data.delivery_time || '',
        contact: data.contact || '',
        address: data.address || '',
        paper_file: data.paper_file || '',
        extra_note: data.extra_note || '',
      };
      state.installFee = Number(data.install_fee) || 0;
      state.shippingFee = Number(data.shipping_fee) || 0;
    } else {
      state.items = [];
      state.orderInfo = {
        customer: '', delivery_time: '', contact: '',
        address: '', paper_file: '', extra_note: '',
      };
      state.installFee = 0;
      state.shippingFee = 0;
    }
    setSyncStatus('已同步', false);
  } catch (e) {
    console.warn('加载单号失败', e);
    setSyncStatus('离线模式', true);
  }
}

/* ============================================================
 *  计算费用
 * ============================================================ */
function calcOrderFees(orderNo) {
  const entry = state.scheduleOrders.find(o => o.order === orderNo);
  if (!entry) {
    state.orderFees = { parttime: 0, lunch: 0, dinner: 0, material: 0, days: 0 };
    return;
  }
  const dates = entry.dates;
  let parttime = 0, lunch = 0, dinner = 0;
  dates.forEach(d => {
    parttime += calcDayParttime(d);
    const fee = state.scheduleFees.find(f => f.date === d);
    if (fee) { lunch += fee.lunch; dinner += fee.dinner; }
  });
  let material = 0;
  state.items.forEach(it => {
    material += (Number(it.price) || 0) * (Number(it.qty) || 0);
  });
  state.orderFees = {
    parttime: Math.round(parttime * 100) / 100,
    lunch: Math.round(lunch * 100) / 100,
    dinner: Math.round(dinner * 100) / 100,
    material: Math.round(material * 100) / 100,
    days: dates.length,
  };
}

/* 安装费 = 兼职费；总成本不含安装费 */
function calcGrandTotal() {
  const f = state.orderFees;
  const g = (Number(f.material) || 0) + (Number(f.parttime) || 0) +
            (Number(f.lunch) || 0) + (Number(f.dinner) || 0) +
            (Number(state.shippingFee) || 0);
  return Math.round(g * 100) / 100;
}

/* ============================================================
 *  自动保存
 * ============================================================ */
let autoSaveTimer = null;
function autoSave() {
  saveLocal();
  if (!state.orderNo.trim()) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(async () => {
    autoSaveTimer = null;
    const orderNo = state.orderNo.trim();
    if (!orderNo) return;
    let materialTotal = 0;
    state.items.forEach(it => {
      materialTotal += (Number(it.price) || 0) * (Number(it.qty) || 0);
    });
    const grand = calcGrandTotal();
    const installFee = state.orderFees.parttime || 0;
    try {
      setSyncStatus('同步中…', false);
      const { error } = await supa.from('order_materials').upsert({
        order_no: orderNo,
        items: state.items,
        note: state.orderInfo.extra_note || '',
        customer: state.orderInfo.customer || '',
        delivery_time: state.orderInfo.delivery_time || '',
        contact: state.orderInfo.contact || '',
        address: state.orderInfo.address || '',
        paper_file: state.orderInfo.paper_file || '',
        extra_note: state.orderInfo.extra_note || '',
        install_fee: installFee,
        shipping_fee: state.shippingFee || 0,
        total: materialTotal,
        grand_total: grand,
        updated_at: new Date().toISOString(),
      });
      if (error) throw error;
      setSyncStatus('已同步', false);
    } catch (e) {
      console.warn('自动保存失败', e);
      setSyncStatus('同步失败', true);
    }
  }, 800);
}

/* ============================================================
 *  手动保存
 * ============================================================ */
async function manualSave() {
  const orderNo = state.orderNo.trim();
  if (!orderNo) { alert('请先选择单号'); return; }
  if (!state.items.length) { alert('清单是空的'); return; }
  let materialTotal = 0;
  state.items.forEach(it => {
    materialTotal += (Number(it.price) || 0) * (Number(it.qty) || 0);
  });
  materialTotal = Math.round(materialTotal * 100) / 100;
  const grand = calcGrandTotal();
  const installFee = state.orderFees.parttime || 0;

  const btn = $('saveBtn');
  btn.disabled = true; btn.textContent = '保存中…';
  try {
    setSyncStatus('同步中…', false);

    const { error: e1 } = await supa.from('order_materials').upsert({
      order_no: orderNo,
      items: state.items,
      note: state.orderInfo.extra_note || '',
      customer: state.orderInfo.customer || '',
      delivery_time: state.orderInfo.delivery_time || '',
      contact: state.orderInfo.contact || '',
      address: state.orderInfo.address || '',
      paper_file: state.orderInfo.paper_file || '',
      extra_note: state.orderInfo.extra_note || '',
      install_fee: installFee,
      shipping_fee: state.shippingFee || 0,
      total: materialTotal,
      grand_total: grand,
      updated_at: new Date().toISOString(),
    });
    if (e1) throw e1;

    const { error: e2 } = await supa.from('schedule_items')
      .update({ material_total: materialTotal, grand_total: grand })
      .eq('sub', orderNo);
    if (e2) console.warn('同步到 schedule_items 失败', e2);

    setSyncStatus('已同步', false);
    showToast(`✅ 已保存！\n材料 ¥${materialTotal.toFixed(2)} · 总成本 ¥${grand.toFixed(2)}`, 3000);
  } catch (e) {
    console.warn('保存失败', e);
    setSyncStatus('保存失败', true);
    showToast(`❌ 保存失败：${e.message || e}`, 4000);
  } finally {
    btn.disabled = false; btn.textContent = '💾 保存';
  }
}

function renderLibTabs() {
  const box = $('libTabs');
  box.innerHTML = '';
  allStages().forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'lib-tab' + (state.libStage === s ? ' active' : '');
    btn.textContent = s;
    btn.onclick = () => {
      state.libStage = s; renderLibTabs(); renderLibBody();
    };
    box.appendChild(btn);
  });
}

function renderLibBody() {
  const box = $('libBody');
  const kw = state.libKeyword.trim().toLowerCase();
  let list = allMaterials();
  if (state.libStage !== '全部') list = list.filter(m => m.stage === state.libStage);
  if (kw) list = list.filter(m =>
    (m.name + ' ' + (m.spec || '') + ' ' + m.stage).toLowerCase().includes(kw));
  if (!list.length) {
    box.innerHTML = `<div class="lib-empty"><span class="ico">🔍</span>没有找到匹配的材料</div>`;
    return;
  }
  const groups = {};
  list.forEach(m => {
    const key = m.stage || '未分类';
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  });
  box.innerHTML = '';
  Object.keys(groups).forEach(stage => {
    const grp = document.createElement('div');
    grp.className = 'lib-group';
    const title = document.createElement('div');
    title.className = 'lib-group-title';
    title.textContent = stage;
    grp.appendChild(title);
    groups[stage].forEach(m => {
      const k = matKey(m);
      const selected = state.selectedKeys.has(k);
      const row = document.createElement('div');
      row.className = 'm-item' + (selected ? ' selected' : '');
      row.innerHTML = `
        <button class="m-check${selected ? ' on' : ''}" data-key="${esc(k)}"></button>
        <div class="m-main">
          <div class="m-name">${esc(m.name)}${m.spec ? `<small>${esc(m.spec)}</small>` : ''}</div>
        </div>
        <span class="m-unit">${esc(m.unit || '-')}</span>
        <span class="m-price">${fmtMoney(m.price)}</span>
        <button class="m-add" title="加入清单">＋</button>
      `;
      row.querySelector('.m-check').addEventListener('click', e => {
        e.stopPropagation();
        if (state.selectedKeys.has(k)) state.selectedKeys.delete(k);
        else state.selectedKeys.add(k);
        renderLibBody(); renderSelbar();
      });
      row.querySelector('.m-main').addEventListener('click', () => {
        if (state.selectedKeys.has(k)) state.selectedKeys.delete(k);
        else state.selectedKeys.add(k);
        renderLibBody(); renderSelbar();
      });
      row.querySelector('.m-add').addEventListener('click', e => {
        e.stopPropagation(); addMaterialToCart(m);
      });
      grp.appendChild(row);
    });
    box.appendChild(grp);
  });
}

function renderSelbar() {
  const bar = $('libSelbar'), cnt = $('selCount');
  const n = state.selectedKeys.size;
  cnt.textContent = n;
  bar.classList.toggle('show', n > 0);
}

/* ============================================================
 *  渲染 - 单号列表
 * ============================================================ */
function renderOrderList() {
  const box = $('orderListBody');
  const cnt = $('orderCnt');
  cnt.textContent = state.scheduleOrders.length;
  const kw = state.orderKeyword.trim().toLowerCase();
  let list = state.scheduleOrders;
  if (kw) list = list.filter(o => o.order.toLowerCase().includes(kw));
  if (!list.length) {
    box.innerHTML = `<div class="lib-empty"><span class="ico">📋</span>${
      state.scheduleOrders.length ? '没有匹配的单号' : '日程表里暂无实际单号'
    }</div>`;
    return;
  }
  box.innerHTML = '';
  list.forEach(o => {
    const row = document.createElement('div');
    row.className = 'order-item-row' + (o.order === state.orderNo ? ' current' : '');
    const d0 = o.dates[0] || '';
    const d1 = o.dates[o.dates.length - 1] || '';
    const dateLabel = d0 === d1 ? d0 : `${d0} ~ ${d1}`;
    row.innerHTML = `
      <span class="no">${esc(o.order)}</span>
      <span class="meta">${o.dates.length}天<br>${esc(dateLabel)}</span>
      <span class="arrow">›</span>
    `;
    row.addEventListener('click', () => selectOrder(o.order));
    box.appendChild(row);
  });
}

async function selectOrder(orderNo) {
  state.orderNo = orderNo;
  $('orderInput').value = orderNo;
  renderOrderDisplay();
  await loadOrder(orderNo);
  calcOrderFees(orderNo);
  renderList();
  renderFeeSummary();
  renderInfoFields();
  switchLibTab('materials');
  showToast(`已切换到单号：${orderNo}`, 1500);
}

/* ============================================================
 *  渲染 - 备注字段（含富文本额外备注）
 * ============================================================ */
function renderInfoFields() {
  const f = state.orderInfo;
  $('fCustomer').value = f.customer || '';
  $('fContact').value = f.contact || '';
  $('fDeliveryTime').value = f.delivery_time || '';
  $('fAddress').value = f.address || '';
  $('fPaperFile').value = f.paper_file || '';
  const richEditor = $('fExtraNoteEditor');
  if (richEditor && document.activeElement !== richEditor) {
    richEditor.innerHTML = f.extra_note || '';
  }
  if (document.activeElement !== $('shippingFeeInput')) {
    $('shippingFeeInput').value = state.shippingFee > 0 ? state.shippingFee : '';
  }
}

/* ============================================================
 *  渲染 - 清单
 * ============================================================ */
function renderOrderDisplay() {
  const el = $('listOrderDisplay');
  if (state.orderNo.trim()) {
    el.textContent = state.orderNo.trim();
    el.classList.remove('empty');
  } else {
    el.textContent = '未选单号';
    el.classList.add('empty');
  }
}

function renderFeeSummary() {
  const box = $('feeSummary');
  const costBox = $('costSummary');
  if (!state.orderNo.trim()) {
    box.classList.add('hide');
    costBox.classList.add('hide');
    return;
  }
  box.classList.remove('hide');
  costBox.classList.remove('hide');
  const f = state.orderFees;

  /* fee-summary: 兼职费 / 午餐 / 晚餐 / 关联天数 */
  $('feeParttime').textContent = '¥' + f.parttime.toFixed(2);
  $('feeParttime').className = 'val green' + (f.parttime > 0 ? '' : ' zero');
  $('feeLunch').textContent = '¥' + f.lunch.toFixed(2);
  $('feeLunch').className = 'val orange' + (f.lunch > 0 ? '' : ' zero');
  $('feeDinner').textContent = '¥' + f.dinner.toFixed(2);
  $('feeDinner').className = 'val purple' + (f.dinner > 0 ? '' : ' zero');
  $('feeDays').textContent = f.days + ' 天';
  $('feeDays').className = 'val' + (f.days > 0 ? '' : ' zero');

  /* cost-summary: 材料合计 / 安装费 / 运费 / 总成本 */
  const matTotal = state.items.reduce((s, it) =>
    s + (Number(it.price) || 0) * (Number(it.qty) || 0), 0);
  $('totalDisplay').textContent = '¥' + fmtMoney(matTotal);
  $('totalDisplay').className = 'val green' + (matTotal > 0 ? '' : ' zero');

  const installEl = $('installFeeDisplay');
  installEl.textContent = '¥' + f.parttime.toFixed(2);
  installEl.className = 'fee-install-val' + (f.parttime > 0 ? '' : ' zero');

  const grand = calcGrandTotal();
  const gEl = $('grandTotal');
  gEl.textContent = '¥' + grand.toFixed(2);
  gEl.className = 'val grand' + (grand > 0 ? '' : ' zero');
}

function renderList() {
  const box = $('listBody');
  renderOrderDisplay();
  if (!state.items.length) {
    box.innerHTML = `<div class="list-empty"><span class="ico">🛒</span>清单是空的<div class="hint">在左侧材料库选材料后加入</div></div>`;
    return;
  }
  let html = `
    <div class="list-row-header">
      <span>材料 / 分类</span>
      <span>单位</span>
      <span>单价</span>
      <span>数量</span>
      <span>小计</span>
      <span>操作</span>
    </div>
  `;
  state.items.forEach(it => {
    const price = Number(it.price) || 0;
    const qty = Number(it.qty) || 0;
    const sub = price * qty;
    const stageCls = it.stage ? '' : ' empty';
    html += `
      <div class="list-row" data-id="${it.id}">
        <div class="lr-name" title="双击编辑">
          <span class="lr-stage${stageCls}">${esc(it.stage || '未分类')}</span>
          <div class="lr-name-main">
            <span class="lr-name-text">${esc(it.name)}</span>
            ${it.spec ? `<small>${esc(it.spec)}</small>` : ''}
          </div>
        </div>
        <span class="lr-unit">${esc(it.unit || '-')}</span>
        <input class="lr-input lr-price" type="number" step="0.01" min="0" value="${price}" data-field="price">
        <input class="lr-input lr-qty" type="number" step="1" min="0" value="${qty}" data-field="qty">
        <span class="lr-subtotal">¥${fmtMoney(sub)}</span>
        <div class="lr-actions">
          <button class="lr-btn lr-edit" title="编辑材料">✎</button>
          <button class="lr-btn lr-del" title="删除材料">×</button>
        </div>
      </div>
    `;
  });
  box.innerHTML = html;
  box.querySelectorAll('.list-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll('.lr-input').forEach(inp => {
      inp.addEventListener('input', () => {
        const field = inp.dataset.field;
        const v = Number(inp.value) || 0;
        const it = state.items.find(x => x.id === id);
        if (!it) return;
        it[field] = v;
        const price = Number(it.price) || 0;
        const qty = Number(it.qty) || 0;
        row.querySelector('.lr-subtotal').textContent = '¥' + fmtMoney(price * qty);
        let t = 0;
        state.items.forEach(x => {
          t += (Number(x.price) || 0) * (Number(x.qty) || 0);
        });
        state.orderFees.material = Math.round(t * 100) / 100;
        renderFeeSummary();
        autoSave();
      });
      inp.addEventListener('blur', () => {
        if (inp.value === '' || isNaN(Number(inp.value))) inp.value = 0;
      });
      inp.addEventListener('focus', () => inp.select());
    });
    /* 双击名称编辑 */
    row.querySelector('.lr-name').addEventListener('dblclick', e => {
      e.stopPropagation();
      openEditMatModal(id);
    });
    /* 编辑按钮 */
    row.querySelector('.lr-edit').addEventListener('click', e => {
      e.stopPropagation();
      openEditMatModal(id);
    });
    /* 删除按钮 */
    row.querySelector('.lr-del').addEventListener('click', e => {
      e.stopPropagation();
      const it = state.items.find(x => x.id === id);
      if (!it) return;
      if (!confirm(`删除材料「${it.name}」？`)) return;
      state.items = state.items.filter(x => x.id !== id);
      autoSave();
      calcOrderFees(state.orderNo);
      renderList(); renderFeeSummary();
    });
  });
  renderFeeSummary();
}

/* ============================================================
 *  加入清单
 * ============================================================ */
function addMaterialToCart(m) {
  if (!state.orderNo.trim()) { alert('请先选择或输入单号'); return; }
  const existing = state.items.find(it =>
    it.name === m.name && (it.spec || '') === (m.spec || '') && (it.stage || '') === (m.stage || ''));
  if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
  else state.items.push({
    id: uid(), stage: m.stage || '', name: m.name,
    spec: m.spec || '', unit: m.unit || '',
    price: Number(m.price) || 0, qty: 1,
  });
  autoSave();
  calcOrderFees(state.orderNo);
  renderList(); renderFeeSummary();
}

function addSelectedMaterials() {
  if (!state.orderNo.trim()) { alert('请先选择或输入单号'); return; }
  const keys = Array.from(state.selectedKeys);
  if (!keys.length) return;
  const mats = allMaterials();
  keys.forEach(k => {
    const m = mats.find(x => matKey(x) === k);
    if (!m) return;
    const existing = state.items.find(it =>
      it.name === m.name && (it.spec || '') === (m.spec || '') && (it.stage || '') === (m.stage || ''));
    if (existing) existing.qty = (Number(existing.qty) || 0) + 1;
    else state.items.push({
      id: uid(), stage: m.stage || '', name: m.name,
      spec: m.spec || '', unit: m.unit || '',
      price: Number(m.price) || 0, qty: 1,
    });
  });
  state.selectedKeys.clear();
  autoSave();
  calcOrderFees(state.orderNo);
  renderLibBody(); renderSelbar(); renderList(); renderFeeSummary();
}

/* ============================================================
 *  自定义材料（添加）
 * ============================================================ */
function openAddMatModal() {
  ['newMatStage','newMatName','newMatSpec','newMatUnit','newMatPrice'].forEach(id => $(id).value = '');
  const dl = $('stageList'); dl.innerHTML = '';
  allStages().filter(s => s !== '全部').forEach(s => {
    const opt = document.createElement('option'); opt.value = s; dl.appendChild(opt);
  });
  $('addMatModal').classList.add('show');
  setTimeout(() => $('newMatName').focus(), 100);
}
function closeAddMatModal() { $('addMatModal').classList.remove('show'); }
async function saveNewMaterial() {
  const name = ($('newMatName').value || '').trim();
  if (!name) { alert('请填写材料名称'); return; }
  const stage = ($('newMatStage').value || '').trim();
  const spec = ($('newMatSpec').value || '').trim();
  const unit = ($('newMatUnit').value || '').trim();
  const price = Number($('newMatPrice').value) || 0;
  const newMat = { id: uid(), stage, name, spec, unit, price };
  state.customMaterials.push(newMat);
  saveLocal();
  closeAddMatModal();
  renderLibTabs(); renderLibBody();
  try {
    const { error } = await supa.from('custom_materials').insert({
      id: newMat.id, stage, name, spec, unit, price,
    });
    if (error) throw error;
  } catch (e) { console.warn('材料保存失败', e); }
}

/* ============================================================
 *  编辑材料（清单中的材料）
 * ============================================================ */
let editingItemId = null;
function openEditMatModal(itemId) {
  const it = state.items.find(x => x.id === itemId);
  if (!it) return;
  editingItemId = itemId;
  $('editMatStage').value = it.stage || '';
  $('editMatName').value = it.name || '';
  $('editMatSpec').value = it.spec || '';
  $('editMatUnit').value = it.unit || '';
  $('editMatPrice').value = Number(it.price) || 0;
  $('editMatQty').value = Number(it.qty) || 0;
  const dl = $('stageList2'); dl.innerHTML = '';
  allStages().filter(s => s !== '全部').forEach(s => {
    const opt = document.createElement('option'); opt.value = s; dl.appendChild(opt);
  });
  $('editMatModal').classList.add('show');
  setTimeout(() => $('editMatName').focus(), 100);
}
function closeEditMatModal() {
  $('editMatModal').classList.remove('show');
  editingItemId = null;
}
function saveEditMaterial() {
  if (!editingItemId) return;
  const it = state.items.find(x => x.id === editingItemId);
  if (!it) { closeEditMatModal(); return; }
  const name = ($('editMatName').value || '').trim();
  if (!name) { alert('请填写材料名称'); return; }
  it.stage = ($('editMatStage').value || '').trim();
  it.name = name;
  it.spec = ($('editMatSpec').value || '').trim();
  it.unit = ($('editMatUnit').value || '').trim();
  it.price = Number($('editMatPrice').value) || 0;
  it.qty = Number($('editMatQty').value) || 0;
  closeEditMatModal();
  autoSave();
  calcOrderFees(state.orderNo);
  renderList(); renderFeeSummary();
}

/* ============================================================
 *  导入 / 导出
 * ============================================================ */
function exportData() {
  const orderNo = state.orderNo.trim();
  const payload = {
    app: 'cost', version: 3,
    exportedAt: new Date().toISOString(),
    orderNo: orderNo || '',
    orderInfo: state.orderInfo,
    installFee: state.orderFees.parttime || 0,
    shippingFee: state.shippingFee,
    items: state.items,
    fees: state.orderFees,
    grandTotal: calcGrandTotal(),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = new Date();
  const stamp = `${t.getFullYear()}${String(t.getMonth()+1).padStart(2,'0')}${String(t.getDate()).padStart(2,'0')}-${String(t.getHours()).padStart(2,'0')}${String(t.getMinutes()).padStart(2,'0')}`;
  const safeName = (orderNo || '成本单').replace(/[\\\/:*?"<>|]/g, '_');
  a.href = url;
  a.download = `${safeName}-${stamp}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object') throw new Error('文件内容无法识别');
    const items = Array.isArray(data.items) ? data.items : [];
    const orderNo = String(data.orderNo || '').trim();
    if (!confirm(`导入将替换当前清单\n\n材料：${items.length} 项\n单号：${orderNo || '（未填）'}\n\n继续？`)) return;
    if (orderNo && !state.orderNo.trim()) {
      state.orderNo = orderNo;
      $('orderInput').value = orderNo;
    }
    state.items = items.map(it => ({
      id: it.id || uid(),
      stage: it.stage || '', name: it.name || '未命名',
      spec: it.spec || '', unit: it.unit || '',
      price: Number(it.price) || 0, qty: Number(it.qty) || 1,
    }));
    if (data.orderInfo) state.orderInfo = Object.assign(state.orderInfo, data.orderInfo);
    if (typeof data.shippingFee === 'number') state.shippingFee = data.shippingFee;
    calcOrderFees(state.orderNo);
    autoSave();
    renderInfoFields(); renderList(); renderFeeSummary();
    alert('导入成功！');
  } catch (e) {
    alert('导入失败：' + (e.message || '文件格式不正确'));
  }
}

/* ============================================================
 *  事件
 * ============================================================ */
function bind() {
  $('tabMaterials').onclick = () => switchLibTab('materials');
  $('tabOrders').onclick = () => switchLibTab('orders');

  $('orderInput').addEventListener('input', e => {
    state.orderNo = e.target.value;
    renderOrderDisplay();
    autoSave();
  });
  $('orderInput').addEventListener('blur', async () => {
    const v = state.orderNo.trim();
    if (!v) return;
    await loadOrder(v);
    calcOrderFees(v);
    renderList(); renderFeeSummary(); renderInfoFields(); renderOrderList();
  });

  $('orderSearch').addEventListener('input', e => {
    state.orderKeyword = e.target.value;
    renderOrderList();
  });
  $('refreshOrdersBtn').onclick = async () => {
    await loadFromCloud();
    renderOrderList();
    showToast('已从日程表刷新', 1500);
  };

  const fMap = {
    fCustomer: 'customer',
    fContact: 'contact',
    fDeliveryTime: 'delivery_time',
    fAddress: 'address',
    fPaperFile: 'paper_file',
  };
  Object.entries(fMap).forEach(([id, key]) => {
    $(id).addEventListener('input', e => {
      state.orderInfo[key] = e.target.value;
      autoSave();
    });
  });

  const richEditor = $('fExtraNoteEditor');
  richEditor.addEventListener('input', () => {
    state.orderInfo.extra_note = richEditor.innerHTML;
    autoSave();
  });
  richEditor.addEventListener('paste', async e => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const file = item.getAsFile();
        if (!file) continue;
        try {
          const base64 = await fileToBase64(file);
          document.execCommand('insertHTML', false,
            `<img src="${base64}" alt="粘贴图片">`);
          state.orderInfo.extra_note = richEditor.innerHTML;
          autoSave();
        } catch (err) {
          console.warn('图片粘贴失败', err);
        }
        return;
      }
    }
  });
  richEditor.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.execCommand('insertLineBreak');
      state.orderInfo.extra_note = richEditor.innerHTML;
      autoSave();
    }
  });

  $('shippingFeeInput').addEventListener('input', e => {
    const v = parseFloat(e.target.value) || 0;
    state.shippingFee = Math.max(0, v);
    renderFeeSummary();
    autoSave();
  });
  $('shippingFeeInput').addEventListener('blur', e => {
    if (e.target.value === '' || isNaN(Number(e.target.value))) e.target.value = '';
  });

  $('libSearch').addEventListener('input', e => {
    state.libKeyword = e.target.value;
    renderLibBody();
  });

  $('addSelectedBtn').onclick = addSelectedMaterials;
  $('clearSelBtn').onclick = () => {
    state.selectedKeys.clear();
    renderLibBody(); renderSelbar();
  };

  $('libAddBtn').onclick = openAddMatModal;
  $('addMatClose').onclick = closeAddMatModal;
  $('addMatCancel').onclick = closeAddMatModal;
  $('addMatConfirm').onclick = saveNewMaterial;
  $('addMatModal').addEventListener('click', e => {
    if (e.target === $('addMatModal')) closeAddMatModal();
  });

  $('editMatClose').onclick = closeEditMatModal;
  $('editMatCancel').onclick = closeEditMatModal;
  $('editMatConfirm').onclick = saveEditMaterial;
  $('editMatModal').addEventListener('click', e => {
    if (e.target === $('editMatModal')) closeEditMatModal();
  });

  $('clearListBtn').onclick = () => {
    if (!state.items.length) return;
    if (!confirm('确定清空当前清单？')) return;
    state.items = [];
    autoSave();
    calcOrderFees(state.orderNo);
    renderList(); renderFeeSummary();
  };

  $('saveBtn').onclick = manualSave;
  $('exportBtn').onclick = exportData;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (f) await importData(f);
    e.target.value = '';
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('addMatModal').classList.contains('show')) closeAddMatModal();
      else if ($('editMatModal').classList.contains('show')) closeEditMatModal();
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      manualSave();
    }
  });
}

/* ============================================================
 *  启动
 * ============================================================ */
async function init() {
  loadLocal();
  if (state.orderNo) $('orderInput').value = state.orderNo;

  bind();
  renderLibTabs(); renderLibBody(); renderSelbar();
  renderOrderDisplay(); renderInfoFields(); renderList(); renderFeeSummary();

  switchLibTab('orders');

  await loadFromCloud();
  renderLibTabs(); renderLibBody();
  renderOrderList();

  if (state.orderNo) {
    await loadOrder(state.orderNo);
    calcOrderFees(state.orderNo);
    renderList(); renderFeeSummary(); renderInfoFields();
  }
}

init();
</script>
