}

/* ============================================================
 *  实际
 * ============================================================ */
function groupActualByOrder() {
  const list = state.items
    .filter(it => it.date === state.selected && it.status === 'actual');

  const groups = {};
  list.forEach(it => {
    const key = (it.sub || '').trim() || '__no_' + it.id;
    if (!groups[key]) {
      groups[key] = { order: (it.sub || '').trim(), records: [] };
    }
    groups[key].records.push(it);
  });

  Object.values(groups).forEach(g => {
    g.records.sort((a, b) => {
      const aHas = a.start && a.end ? 1 : 0;
      const bHas = b.start && b.end ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return timeToMin(a.start) - timeToMin(b.start);
    });
  });

  return Object.values(groups).sort((a, b) => {
    const aMin = a.records[0] ? timeToMin(a.records[0].start) : 9999;
    const bMin = b.records[0] ? timeToMin(b.records[0].start) : 9999;
    return aMin - bMin;
  });
}

function recordMinutes(r) {
  if (r.start && r.end) return durationMin(r.start, r.end);
  if (r.minutes) return Number(r.minutes) || 0;
  return 0;
}

function autoGroupTotalMin(g) {
  let total = 0;
  g.records.forEach(r => {
    total += recordMinutes(r) * Math.max(1, Number(r.people) || 1);
  });
  return total;
}

function groupTotalMin(g) {
  const key = totalKey(state.selected, g.order);
  if (state.manualTotals[key] !== undefined) return state.manualTotals[key];
  return autoGroupTotalMin(g);
}

function isManualTotal(g) {
  const key = totalKey(state.selected, g.order);
  return state.manualTotals[key] !== undefined;
}

function renderActual() {
  const grid = $('actualGrid');
  const groups = groupActualByOrder();

  let totalMin = 0;
  let totalSegments = 0;
  groups.forEach(g => {
    totalMin += groupTotalMin(g);
    totalSegments += g.records.length;
  });

  $('actualInfo').textContent = groups.length
    ? `${groups.length} 单 · ${totalSegments} 段 · 点 + 加时间段`
    : '双击文字改 · 点 + 加时间段';
  $('actualTotal').textContent = totalMin > 0
    ? `今日总用时 ${fmtDuration(totalMin)}`
    : '';

  if (!groups.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="ico">✅</span>暂无实际记录</div>`;
    return;
  }
  grid.innerHTML = '';
  groups.forEach(g => grid.appendChild(createActualCard(g)));
}

function createActualCard(g) {
  const card = document.createElement('div');
  card.className = 'a-card';

  const head = document.createElement('div');
  head.className = 'a-card-head';

  const order = document.createElement('span');
  order.className = 'a-order';
  order.textContent = g.order || '';
  order.title = '双击修改单号';
  order.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (order.querySelector('input')) return;
    const oldVal = g.order;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = oldVal;
    input.maxLength = 30;
    input.style.cssText = `
      width:100%; border:none; outline:none; background:#fff;
      font:inherit; color:inherit; text-align:left;
      padding:0; margin:0; border-radius:inherit;
    `;
    order.textContent = '';
    order.classList.add('editing');
    order.appendChild(input);
    input.focus();
    input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) {
        const v = input.value.trim();
        const oldKey = totalKey(state.selected, oldVal);
        const newKey = totalKey(state.selected, v);
        if (state.manualTotals[oldKey] !== undefined && oldKey !== newKey) {
          state.manualTotals[newKey] = state.manualTotals[oldKey];
          delete state.manualTotals[oldKey];
        }
        g.order = v;
        g.records.forEach(r => { r.sub = v; });
        save();
      }
      order.classList.remove('editing');
      order.textContent = g.order || '';
      if (commit) renderActual();
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });

  const del = document.createElement('button');
  del.className = 'a-del';
  del.textContent = '×';
  del.title = `删除该单（${g.records.length} 段）`;
  del.addEventListener('click', e => {
    e.stopPropagation();
    if (!confirm(`删除单号「${g.order || '未填'}」的所有 ${g.records.length} 条记录？`)) return;
    const ids = new Set(g.records.map(r => r.id));
    state.items = state.items.filter(x => !ids.has(x.id));
    const key = totalKey(state.selected, g.order);
    delete state.manualTotals[key];
    save();
    renderActual();
  });

  head.append(order, del);

  const times = document.createElement('div');
  times.className = 'a-times';
  g.records.forEach(rec => times.appendChild(createTimeRow(rec, g)));

  const addWrap = document.createElement('div');
  addWrap.className = 'a-add-row';

  const addBtn = document.createElement('button');
  addBtn.className = 'a-add-btn';
  addBtn.type = 'button';
  addBtn.textContent = '时间段';

  const addForm = document.createElement('div');
  addForm.className = 'a-add-form';

  const afStart = document.createElement('input');
  afStart.type = 'text';
  afStart.inputMode = 'numeric';
  afStart.placeholder = 'HH:MM';
  afStart.maxLength = 5;
  afStart.className = 'af-time';

  const afSep1 = document.createElement('span');
  afSep1.className = 'af-sep';
  afSep1.textContent = '→';

  const afEnd = document.createElement('input');
  afEnd.type = 'text';
  afEnd.inputMode = 'numeric';
  afEnd.placeholder = 'HH:MM';
  afEnd.maxLength = 5;
  afEnd.className = 'af-time';

  const afOr = document.createElement('span');
  afOr.className = 'af-or';
  afOr.textContent = '或';

  const afHour = document.createElement('input');
  afHour.type = 'number';
  afHour.min = 0;
  afHour.max = 24;
  afHour.value = 0;
  afHour.className = 'af-num';
  afHour.placeholder = '时';

  const afHourLbl = document.createElement('span');
  afHourLbl.className = 'af-sep';
  afHourLbl.textContent = '时';

  const afMin = document.createElement('input');
  afMin.type = 'number';
  afMin.min = 0;
  afMin.max = 59;
  afMin.value = 0;
  afMin.className = 'af-num';
  afMin.placeholder = '分';

  const afMinLbl = document.createElement('span');
  afMinLbl.className = 'af-sep';
  afMinLbl.textContent = '分';

  const afPeople = document.createElement('input');
  afPeople.type = 'number';
  afPeople.min = 1;
  afPeople.value = 1;
  afPeople.className = 'af-num';
  afPeople.placeholder = '人';

  const afSummary = document.createElement('span');
  afSummary.className = 'af-summary zero';
  afSummary.innerHTML = '<span class="lbl">用时</span><span>—</span>';

  const afOk = document.createElement('button');
  afOk.type = 'button';
  afOk.className = 'af-ok';
  afOk.textContent = '确定';

  const afCancel = document.createElement('button');
  afCancel.type = 'button';
  afCancel.className = 'af-cancel';
  afCancel.textContent = '取消';

  addForm.append(afStart, afSep1, afEnd, afOr,
                 afHour, afHourLbl, afMin, afMinLbl,
                 afPeople, afSummary, afOk, afCancel);

  addWrap.appendChild(addBtn);
  addWrap.appendChild(addForm);

  attachAutoJump(afStart, afEnd);

  const updateAfSummary = () => {
    const s = normalizeTime(afStart.value) || afStart.value;
    const en = normalizeTime(afEnd.value) || afEnd.value;
    const h = Math.max(0, parseInt(afHour.value, 10) || 0);
    const m = Math.max(0, parseInt(afMin.value, 10) || 0);
    const ppl = Math.max(1, Number(afPeople.value) || 1);
    let totalMin = 0;
    if (s && en) totalMin = durationMin(s, en);
    else if (h > 0 || m > 0) totalMin = h * 60 + m;
    const valEl = afSummary.querySelector('span:last-child');
    if (!totalMin) {
      afSummary.classList.add('zero');
      valEl.textContent = '—';
    } else {
      afSummary.classList.remove('zero');
      valEl.textContent = fmtDuration(totalMin * ppl);
    }
  };

  [afStart, afEnd, afHour, afMin, afPeople].forEach(el => {
    el.addEventListener('input', updateAfSummary);
    el.addEventListener('change', updateAfSummary);
  });

  const closeForm = () => {
    addForm.classList.remove('show');
    addBtn.style.display = '';
    afStart.value = '';
    afEnd.value = '';
    afHour.value = 0;
    afMin.value = 0;
    afPeople.value = 1;
    updateAfSummary();
  };
  const openForm = () => {
    addForm.classList.add('show');
    addBtn.style.display = 'none';
    updateAfSummary();
    setTimeout(() => afStart.focus(), 30);
  };
  addBtn.addEventListener('click', e => { e.stopPropagation(); openForm(); });
  afCancel.addEventListener('click', e => { e.stopPropagation(); closeForm(); });

  afOk.addEventListener('click', e => {
    e.stopPropagation();
    const sN = normalizeTime(afStart.value);
    const enN = normalizeTime(afEnd.value);
    if (sN) afStart.value = sN;
    if (enN) afEnd.value = enN;
    const s = afStart.value;
    const en = afEnd.value;
    const h = Math.max(0, parseInt(afHour.value, 10) || 0);
    const m = Math.max(0, parseInt(afMin.value, 10) || 0);
    const ppl = Math.max(1, Number(afPeople.value) || 1);

    let newRec;
    if (s && en) {
      if (en <= s) {
        alert('结束时间必须晚于开始时间');
        afEnd.focus();
        return;
      }
      newRec = { id: uid(), date: state.selected, status: 'actual', kind: 'staff',
        title: '', sub: g.order, start: s, end: en, minutes: 0, people: ppl };
    } else if (h > 0 || m > 0) {
      newRec = { id: uid(), date: state.selected, status: 'actual', kind: 'staff',
        title: '', sub: g.order, start: s || '', end: '', minutes: h * 60 + m, people: ppl };
    } else if (s) {
      newRec = { id: uid(), date: state.selected, status: 'actual', kind: 'staff',
        title: '', sub: g.order, start: s, end: '', minutes: 0, people: ppl };
    } else {
      alert('请至少填写开始时间，或在时/分中填写时长');
      afStart.focus();
      return;
    }

    state.items.push(newRec);
    save();
    renderActual();
    if (state.keyword) renderSearchResults();
  });

  [afStart, afEnd, afHour, afMin, afPeople].forEach(el => {
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); afOk.click(); }
      if (ev.key === 'Escape') { ev.preventDefault(); closeForm(); }
    });
  });

  const foot = document.createElement('div');
  foot.className = 'a-card-foot';

  const lbl = document.createElement('span');
  lbl.className = 'a-total-label';
  lbl.textContent = '合计';

  const dur = document.createElement('span');
  dur.className = 'a-dur';
  const totalMin = groupTotalMin(g);
  if (totalMin > 0) dur.textContent = fmtDuration(totalMin);
  else { dur.textContent = '—'; dur.classList.add('zero'); }
  if (isManualTotal(g)) dur.classList.add('manual');
  dur.title = '双击修改合计（手动设置会覆盖自动计算；输入 0 或清空恢复自动）';

  dur.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (dur.querySelector('input')) return;
    const isManual = isManualTotal(g);
    const autoMin = autoGroupTotalMin(g);
    const oldTxt = isManual
      ? (fmtDuration(totalMin) === '—' ? '' : fmtDuration(totalMin))
      : (fmtDuration(autoMin) === '—' ? '' : fmtDuration(autoMin));
    const input = document.createElement('input');
    input.type = 'text';
    input.value = oldTxt;
    input.maxLength = 10;
    input.style.cssText = `
      width:100%; border:none; outline:none; background:transparent;
      font:inherit; color:inherit; text-align:center;
      padding:0; margin:0; border-radius:inherit;
    `;
    const original = dur.textContent;
    dur.textContent = '';
    dur.classList.add('editing');
    dur.classList.remove('manual');
    dur.appendChild(input);
    input.focus();
    input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      const key = totalKey(state.selected, g.order);
      if (commit) {
        const raw = input.value.trim();
        if (raw === '' || /^0(m|h)?$/.test(raw.toLowerCase())) {
          delete state.manualTotals[key];
        } else {
          const parsed = parseDurationInput(raw);
          if (parsed !== null && parsed >= 0) {
            if (parsed === 0) delete state.manualTotals[key];
            else state.manualTotals[key] = parsed;
          }
        }
        save();
      }
      dur.classList.remove('editing');
      if (commit) renderActual();
      else {
        dur.textContent = original;
        if (isManualTotal(g)) dur.classList.add('manual');
      }
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });

  foot.append(lbl, dur);
  card.append(head, times, addWrap, foot);
  return card;
}

function createTimeRow(rec, g) {
  const timeRow = document.createElement('div');
  timeRow.className = 'a-time-row';

  if (rec.start && rec.end) {
    const st = document.createElement('span');
    st.className = 'a-time-piece';
    st.textContent = rec.start;
    st.title = '双击改开始时间（输完自动跳到结束）';

    const sep = document.createElement('span');
    sep.className = 'a-time-sep';
    sep.textContent = '→';

    const et = document.createElement('span');
    et.className = 'a-time-piece';
    et.textContent = rec.end;
    et.title = '双击改结束时间';

    makeTextTimeEditable(st, () => rec.start, v => { rec.start = v; }, {
      onEditEnd: (commit) => {
        if (!commit) { renderActual(); return; }
        setTimeout(() => {
          if (document.body.contains(et)) {
            et.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
          }
        }, 80);
      }
    });
    makeTextTimeEditable(et, () => rec.end, v => { rec.end = v; }, {
      onEditEnd: () => renderActual()
    });
    timeRow.append(st, sep, et);
  } else if (rec.start) {
    /* 只有开始时间（结束时间空） */
    const st = document.createElement('span');
    st.className = 'a-time-piece';
    st.textContent = rec.start;
    st.title = '双击改开始时间';

    const sep = document.createElement('span');
    sep.className = 'a-time-sep';
    sep.textContent = '→';

    const et = document.createElement('span');
    et.className = 'a-time-piece';
    et.textContent = '--:--';
    et.title = '双击填写结束时间';

    makeTextTimeEditable(st, () => rec.start, v => { rec.start = v; }, {
      onEditEnd: (commit) => {
        if (!commit) { renderActual(); return; }
        setTimeout(() => {
          if (document.body.contains(et)) {
            et.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
          }
        }, 80);
      }
    });
    makeTextTimeEditable(et, () => rec.end, v => { rec.end = v; }, {
      onEditEnd: () => renderActual()
    });
    timeRow.append(st, sep, et);
  } else {
    const chip = document.createElement('span');
    chip.className = 'a-min-chip';
    chip.textContent = fmtDuration(rec.minutes) === '—' ? '0m' : fmtDuration(rec.minutes);
    chip.title = '双击修改时长';
    chip.addEventListener('dblclick', e => {
      e.stopPropagation();
      if (chip.querySelector('input')) return;
      const oldTxt = fmtDuration(rec.minutes) === '—' ? '' : fmtDuration(rec.minutes);
      const input = document.createElement('input');
      input.type = 'text';
      input.value = oldTxt;
      input.maxLength = 10;
      input.style.cssText = `
        width:100%; border:none; outline:none; background:#fff;
        font:inherit; color:inherit; text-align:center;
        padding:0; margin:0; border-radius:inherit;
      `;
      chip.textContent = '';
      chip.classList.add('editing');
      chip.appendChild(input);
      input.focus();
      input.select();
      let closed = false;
      const close = (commit) => {
        if (closed) return;
        closed = true;
        if (commit) {
          const parsed = parseDurationInput(input.value);
          if (parsed !== null) rec.minutes = parsed;
          save();
        }
        chip.classList.remove('editing');
        chip.textContent = fmtDuration(rec.minutes) === '—' ? '0m' : fmtDuration(rec.minutes);
        if (commit) renderActual();
      };
      input.addEventListener('blur', () => close(true));
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
      });
    });
    timeRow.appendChild(chip);
  }

  const ppl = document.createElement('span');
  ppl.className = 'a-ppl';
  ppl.textContent = Math.max(1, Number(rec.people) || 1) + '人';
  ppl.title = '双击改人数';
  ppl.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (ppl.querySelector('input')) return;
    const oldVal = String(Math.max(1, Number(rec.people) || 1));
    const input = document.createElement('input');
    input.type = 'number';
    input.min = 1;
    input.value = oldVal;
    input.style.cssText = `
      width:100%; border:none; outline:none; background:#fff;
      font:inherit; color:inherit; text-align:center;
      padding:0; margin:0; border-radius:inherit;
    `;
    ppl.textContent = '';
    ppl.classList.add('editing');
    ppl.appendChild(input);
    input.focus();
    input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) {
        rec.people = Math.max(1, Number(input.value) || 1);
        save();
      }
      ppl.classList.remove('editing');
      ppl.textContent = Math.max(1, Number(rec.people) || 1) + '人';
      if (commit) renderActual();
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
  timeRow.appendChild(ppl);

  const segDur = document.createElement('span');
  segDur.className = 'a-seg-dur';
  const m = recordMinutes(rec);
  const p = Math.max(1, Number(rec.people) || 1);
  if (m > 0) segDur.textContent = '= ' + fmtDuration(m * p);
  else { segDur.textContent = '= —'; segDur.classList.add('zero'); }
  segDur.title = '本段用时（时长×人数）';
  timeRow.appendChild(segDur);

  const segDel = document.createElement('button');
  segDel.className = 'a-time-del';
  segDel.textContent = '×';
  segDel.title = '删除这一时间段';
  segDel.addEventListener('click', e => {
    e.stopPropagation();
    if (g.records.length <= 1 && !rec.start && !rec.end) {
      if (!confirm(`删除「${g.order || '未填'}」的最后一个时间段？`)) return;
      state.items = state.items.filter(x => x.id !== rec.id);
      const key = totalKey(state.selected, g.order);
      delete state.manualTotals[key];
      save();
      renderActual();
      return;
    }
    state.items = state.items.filter(x => x.id !== rec.id);
    save();
    renderActual();
    if (state.keyword) renderSearchResults();
  });
  timeRow.appendChild(segDel);
  return timeRow;
}

/* ============================================================
 *  搜索
 * ============================================================ */
function renderSearchResults() {
  const kw = state.keyword.trim().toLowerCase();
  const area = $('searchArea');
  const body = $('searchBody');
  const info = $('searchInfo');

  if (!kw) {
    area.classList.remove('show');
    document.body.classList.remove('searching');
    return;
  }
  area.classList.add('show');
  document.body.classList.add('searching');

  const results = state.items.filter(it => {
    const bag = [
      it.title, it.sub,
      it.status === 'plan' ? '计划' : '实际',
      it.kind === 'staff' ? '兼职' : it.kind === 'guest' ? '客人' : '其他',
    ].join(' ').toLowerCase();
    return bag.includes(kw);
  }).sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return (a.start || '99:99').localeCompare(b.start || '99:99');
  });

  info.textContent = `“${state.keyword.trim()}” · 找到 ${results.length} 条`;
  if (!results.length) {
    body.innerHTML = `<div class="empty-state">
      <span class="ico">🔍</span>
      <span class="msg">没有找到相关记录</span>
    </div>`;
    return;
  }
  body.innerHTML = '';
  results.forEach(it => {
    const d = parseKey(it.date);
    const isPlan = it.status === 'plan';
    const w = ['日','一','二','三','四','五','六'][d.getDay()];
    const el = document.createElement('div');
    el.className = 'sr-item';
    el.dataset.status = it.status;
    el.dataset.id = it.id;
    el.dataset.date = it.date;
    const dateStr = `${d.getMonth() + 1}.${d.getDate()} 周${w}`;
    let timeStr;
    if (it.start && it.end) timeStr = `${it.start}-${it.end}`;
    else if (it.start) timeStr = it.start;
    else if (it.minutes) timeStr = fmtDuration(it.minutes);
    else timeStr = '全天';
    el.innerHTML = `
      <div class="sr-date">${esc(dateStr)}</div>
      <div class="sr-type ${isPlan ? 'plan' : 'actual'}">${isPlan ? '计划' : '实际'}</div>
      <div class="sr-main">
        ${it.sub ? `<span class="sr-order">${esc(it.sub)}</span>` : ''}
        <span class="sr-name">${esc(it.title || (isPlan ? '未命名' : '单号'))}</span>
        ${it.sub && it.title ? `<span class="sr-note">· ${esc(it.title)}</span>` : ''}
      </div>
      <div class="sr-time ${isPlan ? 'plan' : ''}">${esc(timeStr)}</div>
    `;
    el.addEventListener('click', () => {
      clearSearch();
      selectDate(it.date);
    });
    body.appendChild(el);
  });
}

function clearSearch() {
  state.keyword = '';
  $('searchInput').value = '';
  $('searchClear').classList.remove('show');
  $('searchWrap').classList.remove('focused');
  renderSearchResults();
}

/* ============================================================
 *  快速添加（计划栏允许只填开始时间）
 * ============================================================ */
function addPlan(kind, nameEl, startEl, endEl, noteEl, onDone) {
  const name = $(nameEl).value.trim();
  if (!name) { $(nameEl).focus(); return; }

  const rawStart = $(startEl).value;
  const rawEnd = $(endEl).value;
  const sN = normalizeTime(rawStart);
  const eN = normalizeTime(rawEnd);
  if (sN) $(startEl).value = sN;
  if (eN) $(endEl).value = eN;

  /* 允许结束时间空，也允许开始时间空 */
  state.items.push({
    id: uid(), date: state.selected, status: 'plan', kind: kind,
    done: false, title: name, start: sN, end: eN,
    sub: $(noteEl).value.trim(),
  });

  $(nameEl).value = '';
  $(startEl).value = '';
  $(endEl).value = '';
  $(noteEl).value = '';
  $(nameEl).focus();

  save();
  onDone();
  renderPendingBanner();
  renderCalendar();
  if (state.keyword) renderSearchResults();
}

function addActual() {
  const order = $('aOrder').value.trim();
  if (!order) { $('aOrder').focus(); return; }

  const sN = normalizeTime($('aStart').value);
  const eN = normalizeTime($('aEnd').value);
  if (sN) $('aStart').value = sN;
  if (eN) $('aEnd').value = eN;

  const start = $('aStart').value;
  const end = $('aEnd').value;
  const hour = Math.max(0, parseInt($('aHour').value, 10) || 0);
  const min = Math.max(0, parseInt($('aMin').value, 10) || 0);
  const people = Math.max(1, Number($('aPeople').value) || 1);

  let payload;
  if (start && end) {
    if (end <= start) {
      alert('结束时间必须晚于开始时间');
      $('aEnd').focus();
      return;
    }
    payload = { start, end, minutes: 0, people };
  } else if (hour > 0 || min > 0) {
    payload = { start: start || '', end: '', minutes: hour * 60 + min, people };
  } else if (start) {
    payload = { start, end: '', minutes: 0, people };
  } else {
    alert('请至少填写开始时间，或在时/分中填写时长');
    $('aStart').focus();
    return;
  }

  state.items.push({
    id: uid(), date: state.selected, status: 'actual', kind: 'staff',
    title: '', sub: order, ...payload,
  });

  $('aOrder').value = '';
  $('aStart').value = '';
  $('aEnd').value = '';
  $('aHour').value = 0;
  $('aMin').value = 0;
  $('aPeople').value = 1;
  updatePreview();
  $('aOrder').focus();

  save();
  renderActual();
  if (state.keyword) renderSearchResults();
}

function updatePreview() {
  const sRaw = $('aStart').value;
  const eRaw = $('aEnd').value;
  const s = normalizeTime(sRaw) || sRaw;
  const e = normalizeTime(eRaw) || eRaw;
  const hour = Math.max(0, parseInt($('aHour').value, 10) || 0);
  const min = Math.max(0, parseInt($('aMin').value, 10) || 0);
  const people = Math.max(1, Number($('aPeople').value) || 1);
  const el = $('aPreview');
  const valEl = el.querySelector('.val');
  let totalMin = 0;
  if (s && e) totalMin = durationMin(s, e);
  else if (hour > 0 || min > 0) totalMin = hour * 60 + min;
  if (!totalMin) {
    el.classList.add('zero');
    valEl.textContent = '—';
  } else {
    el.classList.remove('zero');
    valEl.textContent = fmtDuration(totalMin * people);
  }
}

/* ============================================================
 *  日期切换
 * ============================================================ */
function renderDay() {
  const d = parseKey(state.selected);
  const w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
  const isToday = state.selected === todayKey();
  $('dayTitle').innerHTML =
    `${d.getMonth() + 1}月${d.getDate()}日 <small>星期${w}</small>` +
    (isToday ? ' <span class="today-pill">今天</span>' : '');
}

function selectDate(key) {
  state.selected = key;
  const d = parseKey(key);
  if (d.getMonth() !== state.view.m || d.getFullYear() !== state.view.y) {
    state.view.y = d.getFullYear();
    state.view.m = d.getMonth();
  }
  renderCalendar();
  renderDay();
  renderPlanPeople();
  renderPlanOther();
  renderActual();
}

function shiftDay(delta) {
  const d = parseKey(state.selected);
  d.setDate(d.getDate() + delta);
  selectDate(dk(d));
}

function shiftMonth(delta) {
  let m = state.view.m + delta, y = state.view.y;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  state.view.y = y;
  state.view.m = m;
  renderCalendar();
}

/* ============================================================
 *  导出 / 导入
 * ============================================================ */
function exportData() {
  const payload = {
    app: 'schedule',
    version: 1,
    exportedAt: new Date().toISOString(),
    items: state.items,
    notes: state.notes,
    manualTotals: state.manualTotals,
  };
  const text = JSON.stringify(payload, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = new Date();
  const stamp = `${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}`;
  a.href = url;
  a.download = `schedule-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object') throw new Error('文件内容无法识别');

    const items = Array.isArray(data.items) ? data.items : [];
    const notes = Array.isArray(data.notes) ? data.notes : [];
    const manualTotals = (data.manualTotals && typeof data.manualTotals === 'object')
      ? data.manualTotals : {};

    const msg = `导入将用文件覆盖当前所有数据\n\n` +
                `文件内容：${items.length} 条日程 / ${notes.length} 条提醒\n` +
                `当前数据：${state.items.length} 条日程 / ${state.notes.length} 条提醒\n\n` +
                `确定继续？`;
    if (!confirm(msg)) return;

    state.items = items;
    state.notes = notes;
    state.manualTotals = manualTotals;

    await save();
    render();
    renderNotes();
    renderPendingBanner();
    alert('导入成功！');
  } catch (e) {
    console.error('导入失败', e);
    alert('导入失败：' + (e.message || '文件格式不正确'));
  }
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
function bind() {
  $('calPrev').onclick = () => shiftMonth(-1);
  $('calNext').onclick = () => shiftMonth(1);
  $('calGrid').addEventListener('click', onCalClick);
  $('calGrid').addEventListener('dblclick', onCalDblClick);

  $('dayPrev').onclick = () => shiftDay(-1);
  $('dayNext').onclick = () => shiftDay(1);
  $('dayToday').onclick = () => selectDate(todayKey());

  const searchInput = $('searchInput');
  searchInput.addEventListener('input', e => {
    state.keyword = e.target.value;
    $('searchClear').classList.toggle('show', state.keyword.length > 0);
    renderSearchResults();
  });
  searchInput.addEventListener('focus', () => {
    $('searchWrap').classList.add('focused');
  });
  searchInput.addEventListener('blur', () => {
    if (!state.keyword) $('searchWrap').classList.remove('focused');
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      e.preventDefault();
      clearSearch();
      searchInput.blur();
    }
  });

  $('searchClear').onclick = () => { clearSearch(); searchInput.focus(); };
  $('searchClear2').onclick = clearSearch;

  $('exportBtn').onclick = exportData;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (f) await importData(f);
    e.target.value = '';
  };

  $('noteAdd').onclick = () => {
    const existing = state.notes.find(n => n.date === state.selected);
    if (existing) {
      renderNotes();
      const rows = $('notesList').querySelectorAll('.note-text');
      for (const r of rows) {
        if (r.textContent === existing.text || !existing.text) {
          r.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
          break;
        }
      }
      return;
    }
    state.notes.push({ id: uid(), date: state.selected, text: '' });
    save();
    renderCalendar();
    renderNotes();
    const rows = $('notesList').querySelectorAll('.note-text');
    const last = rows[rows.length - 1];
    if (last) last.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
  };

  $('pAdd').onclick = () => addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople);
  $('pName').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople); }
  });
  $('pNote').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople); }
  });
  $('pEnd').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople); }
  });

  $('oAdd').onclick = () => addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther);
  $('oName').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther); }
  });
  $('oNote').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther); }
  });
  $('oEnd').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther); }
  });

  $('aAdd').onclick = addActual;
  $('aOrder').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addActual(); }
  });
  $('aEnd').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addActual(); }
  });

  ['aStart', 'aEnd', 'aPeople', 'aHour', 'aMin'].forEach(id => {
    $(id).addEventListener('input', updatePreview);
    $(id).addEventListener('change', updatePreview);
  });

  attachAutoJump('pStart', 'pEnd');
  attachAutoJump('oStart', 'oEnd');
  attachAutoJump('aStart', 'aEnd');

  bindArrowNav();

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });

  document.querySelectorAll('.box-body, .sidebar').forEach(el => {
    el.addEventListener('wheel', e => {
      const { scrollTop, scrollHeight, clientHeight } = el;
      const d = e.deltaY;
      const atTop = scrollTop <= 0 && d < 0;
      const atBottom = scrollTop + clientHeight >= scrollHeight - 1 && d > 0;
      if (atTop || atBottom) e.preventDefault();
    }, { passive: false });
  });
}

/* ============================================================
 *  启动
 * ============================================================ */
async function init() {
  const t = new Date();
  state.view.y = t.getFullYear();
  state.view.m = t.getMonth();
  state.selected = dk(t);

  await load();

  bind();
  renderCalendar();
  renderNotes();
  renderDay();
  renderPlanPeople();
  renderPlanOther();
  renderActual();
  renderPendingBanner();
  renderSearchResults();

  supa
    .channel('schedule-sync')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'schedule_items' },
      async () => {
        await load();
        renderCalendar();
        renderPlanPeople();
        renderPlanOther();
        renderActual();
        renderPendingBanner();
      })
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'schedule_notes' },
      async () => {
        await load();
        renderNotes();
        renderCalendar();
      })
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'schedule_totals' },
      async () => {
        await load();
        renderActual();
      })
    .subscribe();
}

init();
