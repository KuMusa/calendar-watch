<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的日程表</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12.5px;
    line-height: 1.35;
    color: #1a1f36;
    background:
      radial-gradient(900px 500px at 4% -6%, #e4ecff 0%, transparent 55%),
      radial-gradient(800px 400px at 98% -2%, #ffe8f1 0%, transparent 52%),
      #eef2f9;
    -webkit-font-smoothing: antialiased;
  }

  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  button, input, textarea { font-family: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }

  .app { display: flex; height: 100vh; height: 100dvh; padding: 8px; gap: 8px; overflow: hidden; }

  .sidebar {
    width: 240px; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 0; overflow-y: auto; overflow-x: hidden;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  .card {
    background: #fff; border-radius: 12px; padding: 10px;
    box-shadow: 0 2px 10px rgba(26,31,54,.06); flex-shrink: 0;
  }

  .cal-head { display: flex; align-items: center; margin-bottom: 8px; }
  .cal-month { font-size: 14px; font-weight: 800; letter-spacing: -.01em; }
  .cal-nav { margin-left: auto; display: flex; gap: 3px; }
  .nav-btn {
    height: 24px; min-width: 24px; padding: 0 6px;
    border-radius: 6px; border: 1px solid #e9edf5;
    background: #fff; color: #4a5368;
    font-size: 12px; font-weight: 700;
    display: grid; place-items: center; transition: .15s;
  }
  .nav-btn:hover { background: #eef3ff; border-color: #c8d8ff; color: #4f7cff; }
  .nav-btn:active { transform: scale(.94); }

  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
  .cal-week span { text-align: center; font-size: 9.5px; font-weight: 700; color: #b8bfcd; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day {
    aspect-ratio: 1; border-radius: 7px;
    border: 2px solid transparent; background: #f8fafd;
    display: grid; place-items: center;
    font-size: 11.5px; font-weight: 600; color: #1a1f36;
    cursor: pointer; transition: .14s;
    position: relative; user-select: none;
  }
  .cal-day:hover { background: #eef3ff; }
  .cal-day.out { color: #cdd4e2; background: transparent; }
  .cal-day.out:hover { background: #f8fafd; }
  .cal-day.today { color: #ff7a2f; font-weight: 800; }
  .cal-day.today::after {
    content: ''; position: absolute; bottom: 2px; left: 50%;
    transform: translateX(-50%); width: 3px; height: 3px;
    border-radius: 50%; background: #ff8c42;
  }
  .cal-day.marked { border-color: #ff5a5f; color: #ff3b41; background: #fff5f5; font-weight: 800; }
  .cal-day.sel {
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    color: #fff; box-shadow: 0 4px 12px rgba(79,124,255,.32);
  }
  .cal-day.sel.today { color: #fff; }
  .cal-day.sel.today::after { background: #fff; }
  .cal-day.sel.marked { border-color: #ff5a5f; }
  .cal-day.has-pending { box-shadow: inset 0 -3px 0 #f59e0b; }
  .cal-day.sel.has-pending { box-shadow: inset 0 -3px 0 #f59e0b, 0 4px 12px rgba(79,124,255,.32); }

  .card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .card-title { font-size: 10.5px; font-weight: 800; color: #8b93a7; letter-spacing: .08em; text-transform: uppercase; }
  .mini-add {
    margin-left: auto; width: 18px; height: 18px;
    border-radius: 5px; border: 1px solid #e9edf5;
    background: #fff; color: #4f7cff;
    font-size: 13px; line-height: 1;
    display: grid; place-items: center; transition: .15s;
  }
  .mini-add:hover { background: #eef3ff; border-color: #c8d8ff; }

  .notes-list { display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; }
  .notes-list::-webkit-scrollbar { width: 5px; }
  .notes-list::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  .note-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: 6px; padding: 5px 6px; margin: 0 -6px;
    border-radius: 7px; transition: background .14s;
    font-size: 12px; align-items: start;
  }
  .note-row:hover { background: #fff5f5; }
  .note-date {
    font-size: 10px; font-weight: 800; color: #ff3b41;
    background: #fff0f0; padding: 2px 5px; border-radius: 4px;
    flex-shrink: 0; outline: none; cursor: text;
    text-align: center; white-space: nowrap;
    align-self: start; margin-top: 1px;
  }
  .note-date.editing { background: #fff; box-shadow: 0 0 0 2px #ff5a5f; }

  .note-text {
    color: #1a1f36; font-weight: 500;
    outline: none; border-radius: 5px;
    padding: 1px 3px; margin: 0 -3px;
    cursor: text; white-space: pre-wrap;
    word-break: break-word; overflow-wrap: anywhere;
    line-height: 1.5; min-height: 16px;
  }
  .note-text:empty::before { content: attr(data-ph); color: #b8bfcd; font-weight: 400; }
  .note-text.editing { background: #fff; box-shadow: 0 0 0 2px #ff5a5f; }
  .note-text.editing textarea {
    width: 100%; border: none; outline: none; background: transparent;
    font: inherit; color: inherit; resize: vertical; padding: 0; margin: 0;
    line-height: 1.5; min-height: 40px;
  }
  .note-del {
    width: 16px; height: 16px; border-radius: 4px;
    color: #cdd4e2; font-size: 13px; line-height: 1;
    display: grid; place-items: center; flex-shrink: 0;
    opacity: 0; transition: .14s; align-self: start; margin-top: 1px;
  }
  .note-row:hover .note-del { opacity: 1; }
  .note-del:hover { background: #ffe9eb; color: #e8455a; }

  .empty-hint { font-size: 11px; color: #b8bfcd; text-align: center; padding: 6px 4px; font-weight: 500; }

  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 7px; }

  .top-row { display: flex; align-items: center; gap: 8px; padding: 0 2px; flex-shrink: 0; min-height: 30px; flex-wrap: wrap; }
  .day-title {
    font-size: 16px; font-weight: 800; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 7px; flex-shrink: 0;
  }
  .day-title small { font-size: 11.5px; font-weight: 600; color: #8b93a7; }
  .today-pill {
    font-size: 9.5px; font-weight: 800; padding: 2px 7px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff9d5c, #ff7a2f);
    color: #fff; letter-spacing: .05em;
    box-shadow: 0 3px 8px rgba(255,122,47,.28);
  }

  .sync-status {
    font-size: 10.5px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px;
    background: #f0fdf8; color: #0a8f66;
    border: 1px solid #c9eddc;
    display: inline-flex; align-items: center; gap: 4px;
    flex-shrink: 0;
  }
  .sync-status.err {
    background: #fff5f6; color: #e8455a; border-color: #ffd7db;
  }
  .sync-status .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    animation: blink 1.6s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .btn-ghost {
    height: 28px; padding: 0 11px;
    border-radius: 8px;
    border: 1.5px solid #e9edf5;
    background: #fff; color: #4a5368;
    font-size: 12px; font-weight: 700;
    transition: .15s;
    white-space: nowrap;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn-ghost:hover {
    background: #f2f5ff; border-color: #cfdaff; color: #4f7cff;
  }
  .btn-ghost:active { transform: scale(.96); }
  .btn-ghost svg { width: 13px; height: 13px; }

  .top-search { margin-left: auto; position: relative; flex-shrink: 0; width: 240px; max-width: 40vw; transition: width .2s; }
  .top-search.focused { width: 300px; }
  .top-search input {
    width: 100%; padding: 6px 30px 6px 32px;
    border: 1.5px solid #e9edf5; border-radius: 9px;
    font-size: 12px; font-weight: 500; color: #1a1f36;
    background: #fff; outline: none; transition: .15s;
  }
  .top-search input::placeholder { color: #b8bfcd; font-weight: 400; }
  .top-search input:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .top-search .ico {
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%); width: 13px; height: 13px;
    color: #b8bfcd; pointer-events: none; transition: color .15s;
  }
  .top-search input:focus ~ .ico { color: #4f7cff; }
  .top-search .clr {
    position: absolute; right: 5px; top: 50%;
    transform: translateY(-50%); width: 18px; height: 18px;
    border-radius: 5px; color: #b8bfcd; font-size: 13px;
    line-height: 1; display: none; place-items: center; background: transparent;
  }
  .top-search .clr.show { display: grid; }
  .top-search .clr:hover { background: #ffe9eb; color: #e8455a; }

  .day-nav { display: flex; gap: 3px; flex-shrink: 0; }

  .pending-banner {
    background: linear-gradient(135deg, #fff9ec 0%, #fff5d6 100%);
    border: 1.5px solid #ffd98a;
    border-radius: 12px;
    padding: 8px 12px;
    flex-shrink: 0;
    display: flex; flex-direction: column;
    max-height: 176px; overflow: hidden;
    animation: slideDown .22s ease;
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  .pending-banner.hide { display: none; }

  .pending-title {
    font-size: 11px; font-weight: 800; color: #b45309;
    letter-spacing: .05em; text-transform: uppercase;
    margin-bottom: 6px; display: flex; align-items: center;
    gap: 7px; flex-shrink: 0;
  }
  .pending-title .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f59e0b;
    box-shadow: 0 0 0 3px rgba(245,158,11,.2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(245,158,11,.2); }
    50% { box-shadow: 0 0 0 5px rgba(245,158,11,.12); }
  }
  .pending-count {
    font-size: 10.5px; background: #f59e0b; color: #fff;
    padding: 1px 7px; border-radius: 999px;
    font-weight: 800; letter-spacing: 0; margin-left: 2px;
  }
  .pending-hint {
    font-size: 10.5px; color: #c5862c; font-weight: 500;
    margin-left: auto; letter-spacing: 0; text-transform: none;
  }
  .pending-list {
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto; padding-right: 3px;
  }
  .pending-list::-webkit-scrollbar { width: 5px; }
  .pending-list::-webkit-scrollbar-thumb { background: #ffe4a8; border-radius: 3px; }

  .pending-item {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid #ffe4a8;
    border-radius: 8px; padding: 4px 10px;
    font-size: 12px; cursor: pointer; transition: .14s;
    max-width: 100%; white-space: nowrap; overflow: hidden;
  }
  .pending-item:hover {
    border-color: #f59e0b;
    box-shadow: 0 3px 10px rgba(245,158,11,.2);
    transform: translateX(2px);
  }
  .pending-item.staff { border-left: 3px solid #4f7cff; }
  .pending-item.guest { border-left: 3px solid #ec6ba0; }
  .pending-item.event { border-left: 3px solid #8b5cf6; }
  .pending-item.today { background: #fffdf5; }
  .pending-item .date {
    font-size: 10.5px; font-weight: 800; color: #b45309;
    background: #ffedc9; padding: 1.5px 7px; border-radius: 5px;
    flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .pending-item.today .date {
    background: linear-gradient(135deg, #ff9d5c, #ff7a2f);
    color: #fff; box-shadow: 0 2px 5px rgba(255,122,47,.3);
  }
  .pending-item .time {
    font-size: 10.5px; font-weight: 800; color: #b45309;
    background: #fff5d6; padding: 1.5px 6px;
    border-radius: 4px; font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .pending-item .name {
    font-weight: 800; color: #1a1f36;
    overflow: hidden; text-overflow: ellipsis; max-width: 120px;
  }
  .pending-item .task {
    font-size: 11.5px; color: #6b7280; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; max-width: 180px;
  }
  .pending-item .kind-badge {
    font-size: 9.5px; font-weight: 800;
    padding: 1px 6px; border-radius: 4px;
    flex-shrink: 0; letter-spacing: .03em;
  }
  .pending-item.staff .kind-badge { color: #3b5bbf; background: #eef3ff; }
  .pending-item.guest .kind-badge { color: #d1548a; background: #fff2f7; }
  .pending-item.event .kind-badge { color: #7743e0; background: #f6f3ff; }

  .box {
    background: #fff; border-radius: 12px;
    box-shadow: 0 2px 10px rgba(26,31,54,.06);
    display: flex; flex-direction: column;
    min-height: 0; overflow: hidden;
  }

  .box-head {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 10px; border-bottom: 1px solid #f1f4fa;
    flex-shrink: 0; min-height: 28px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 800;
    padding: 2px 9px; border-radius: 999px;
    letter-spacing: .02em; flex-shrink: 0; white-space: nowrap;
  }
  .badge-plan { color: #3b5bbf; background: #f5f8ff; border: 1.5px dashed #b3c5f7; }
  .badge-plan.event { color: #7743e0; background: #f8f5ff; border-color: #c9b3f5; }
  .badge-actual {
    color: #fff;
    background: linear-gradient(135deg, #16c58c, #0a8f66);
    border: 1.5px solid #0a8f66;
    box-shadow: 0 3px 8px rgba(16,185,129,.24);
  }
  .badge-search { color: #4f7cff; background: #eef3ff; border: 1.5px solid #c8d8ff; }

  .head-info {
    font-size: 11px; font-weight: 600; color: #4a5368;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .head-info b { color: #0a8f66; font-weight: 800; }
  .head-total { margin-left: auto; font-size: 12.5px; font-weight: 800; color: #0a8f66; white-space: nowrap; flex-shrink: 0; }

  .quick-row {
    display: flex; align-items: center; gap: 4px;
    padding: 5px 9px; background: #fafbfe;
    border-bottom: 1px solid #f1f4fa;
    flex-shrink: 0; flex-wrap: wrap;
  }

  .qi {
    border: 1.5px solid #e9edf5; border-radius: 6px;
    padding: 4px 7px; font-size: 11.5px;
    color: #1a1f36; background: #fff;
    outline: none; transition: .15s;
    min-width: 0; font-weight: 500;
  }
  .qi:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .qi::placeholder { color: #b8bfcd; font-weight: 400; }

  .qi-name { width: 62px; }
  .qi-note { flex: 1; min-width: 50px; }
  .qi-order { width: 62px; }
  .qi-time {
    width: 72px; text-align: center;
    letter-spacing: .5px; font-variant-numeric: tabular-nums; font-weight: 600;
  }
  .qi-people { width: 38px; text-align: center; }
  .qi-num { width: 42px; text-align: center; padding: 4px 4px; }

  .quick-row.people-quick .qi-name { flex: 1.4; width: auto; min-width: 120px; }
  .quick-row.people-quick .qi-note { flex: 1; min-width: 80px; }
  .quick-row.other-quick .qi-name { flex: 1.6; width: auto; min-width: 70px; }
  .quick-row.other-quick .qi-note { flex: 0.55; min-width: 42px; }
  .quick-row.actual .qi-order { flex: 1.2; width: auto; min-width: 110px; }

  .qi-sep { color: #b8bfcd; font-size: 10.5px; font-weight: 700; flex-shrink: 0; }
  .or-sep {
    color: #4f7cff; font-size: 10.5px; font-weight: 800;
    padding: 0 3px; background: #eef3ff; border-radius: 4px;
  }

  .qi-preview {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 800; color: #0a8f66;
    background: #f0fdf8; padding: 4px 10px;
    border-radius: 6px; border: 1.5px solid #c9eddc;
    white-space: nowrap; flex-shrink: 0;
    min-width: 82px; justify-content: center;
  }
  .qi-preview .label { font-size: 10px; color: #5ec49b; font-weight: 700; letter-spacing: .04em; }
  .qi-preview.zero { color: #b8bfcd; border-color: #e9edf5; background: #fafbfe; }
  .qi-preview.zero .label { color: #cdd4e2; }
  .qi-preview .val { font-size: 12.5px; color: #0a8f66; font-weight: 800; }
  .qi-preview.zero .val { color: #b8bfcd; }

  .qi-add {
    height: 26px; padding: 0 11px;
    border-radius: 6px;
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    color: #fff; font-size: 11px; font-weight: 700;
    transition: .15s; white-space: nowrap; flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(79,124,255,.26);
  }
  .qi-add:hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(79,124,255,.34); }
  .qi-add:active { transform: translateY(0) scale(.97); }

  .quick-row.actual .qi-add {
    background: linear-gradient(140deg, #16c58c, #0a8f66);
    box-shadow: 0 3px 8px rgba(16,185,129,.26);
  }

  .box-body {
    flex: 1; min-height: 0; overflow-y: auto;
    overflow-x: hidden; padding: 3px 5px 6px;
  }
  .box-body::-webkit-scrollbar { width: 7px; }
  .box-body::-webkit-scrollbar-track { background: transparent; }
  .box-body::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 4px; border: 2px solid #fff; }
  .box-body::-webkit-scrollbar-thumb:hover { background: #c9d2e3; }

  .plan-area {
    flex: 0.9; min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: 7px;
  }

  .p-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 108px 130px 22px;
    gap: 14px; align-items: center;
    padding: 5px 12px; background: #f6f8fd;
    border-bottom: 1px solid #eef2f9;
    font-size: 10.5px; font-weight: 800;
    color: #4a5368; letter-spacing: .06em;
    flex-shrink: 0;
  }
  .p-header span:nth-child(4) { text-align: center; color: #8b93a7; }
  .p-header.other { grid-template-columns: 110px 108px minmax(0, 1fr) 22px; }

  .p-row {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 108px 130px 22px;
    gap: 14px; align-items: center;
    padding: 5px 12px; border-radius: 7px;
    transition: background .14s; font-size: 12px;
    scroll-margin: 20px;
  }
  .p-row.other { grid-template-columns: 110px 108px minmax(0, 1fr) 22px; }
  .p-row:hover { background: #f8fafd; }
  .p-row.highlight {
    background: #fff5d6;
    animation: flash 1.2s ease;
  }
  @keyframes flash {
    0% { background: #ffeaa8; }
    100% { background: #fff5d6; }
  }

  .p-name {
    font-weight: 800; color: #1a1f36;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    outline: none; border-radius: 4px; padding: 1px 3px; margin: 0 -3px;
    cursor: text; font-size: 12.5px;
  }
  .p-name:empty::before { content: attr(data-ph); color: #b8bfcd; font-weight: 600; }
  .p-name.editing { background: #fff; box-shadow: 0 0 0 2px #4f7cff; }

  .p-time-group {
    display: inline-flex; align-items: center; gap: 2px;
    background: #eef3ff; padding: 2.5px 7px;
    border-radius: 6px; justify-self: start;
  }
  .p-time {
    font-size: 11px; font-weight: 800; color: #3b5bbf;
    padding: 0 2px; border-radius: 3px;
    outline: none; min-width: 34px;
    text-align: center; cursor: text;
    font-variant-numeric: tabular-nums;
  }
  .p-time:empty::before { content: attr(data-ph); color: #a8b8e0; font-weight: 600; }
  .p-time.editing { background: #fff; box-shadow: 0 0 0 2px #4f7cff; }
  .p-time-sep { font-size: 10px; color: #6b8cd6; font-weight: 800; }

  .p-note {
    font-size: 12px; color: #1a1f36; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    outline: none; border-radius: 4px; padding: 1px 3px; margin: 0 -3px;
    cursor: text;
  }
  .p-note:empty::before { content: attr(data-ph); color: #b8bfcd; font-weight: 500; }
  .p-note.editing {
    background: #fff; box-shadow: 0 0 0 2px #4f7cff;
    color: #1a1f36; white-space: normal; overflow: visible;
  }

  .p-row.done .p-name,
  .p-row.done .p-note { color: #b8bfcd; text-decoration: line-through; }
  .p-row.done .p-time-group { opacity: .5; }

  .p-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 2px solid #cfd6e6; background: #fff;
    display: grid; place-items: center;
    transition: .14s; padding: 0; justify-self: center;
  }
  .p-check:hover { border-color: #4f7cff; transform: scale(1.08); }
  .p-check.on {
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    border-color: #3b66e6;
    box-shadow: 0 2px 6px rgba(79,124,255,.32);
  }
  .p-check.on::after {
    content: ''; width: 3.5px; height: 7px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -2px);
  }
  .p-row.done .p-check {
    background: linear-gradient(140deg, #16c58c, #0a8f66);
    border-color: #0a8f66;
  }

  .p-del {
    position: absolute; right: 32px; top: 50%;
    transform: translateY(-50%);
    width: 16px; height: 16px; border-radius: 4px;
    color: #cdd4e2; font-size: 13px; line-height: 1;
    display: grid; place-items: center;
    opacity: 0; transition: .14s;
    background: #fff; padding: 0;
  }
  .p-row:hover .p-del { opacity: 1; }
  .p-del:hover { background: #ffe9eb; color: #e8455a; }

  .actual-area { flex: 1.4; min-height: 0; }

  .actual-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 7px; padding: 8px;
  }

  .a-card {
    position: relative; background: #fbfefd;
    border: 1px solid #d8f0e5; border-radius: 10px;
    padding: 8px 10px 9px;
    display: flex; flex-direction: column; gap: 5px;
    transition: .14s; min-width: 0;
  }
  .a-card:hover {
    background: #fff; border-color: #86dcb6;
    box-shadow: 0 4px 14px rgba(16,185,129,.14);
    transform: translateY(-1px);
  }

  .a-card-head { display: flex; align-items: center; gap: 5px; min-width: 0; }

  .a-order {
    font-size: 14px; font-weight: 800; color: #0a8f66;
    letter-spacing: .02em; outline: none; cursor: text;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0; flex: 1;
    padding: 1px 3px; margin: 0 -3px; border-radius: 4px;
  }
  .a-order:empty::before { content: '未填'; color: #8fd6b8; font-weight: 600; }
  .a-order.editing { background: #fff; box-shadow: 0 0 0 2px #16c58c; }

  .a-del {
    width: 18px; height: 18px; border-radius: 5px;
    color: #b8bfcd; font-size: 14px; line-height: 1;
    display: grid; place-items: center;
    opacity: 0; transition: .14s;
    flex-shrink: 0; padding: 0;
  }
  .a-card:hover .a-del { opacity: 1; }
  .a-del:hover { background: #ffe9eb; color: #e8455a; }

  .a-times {
    display: flex; flex-direction: column; gap: 3px;
    padding: 4px 0;
    border-top: 1px dashed #e2f4eb;
    border-bottom: 1px dashed #e2f4eb;
    min-height: 0;
  }

  .a-time-row {
    display: flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 600;
    font-variant-numeric: tabular-nums; min-width: 0;
    position: relative; flex-wrap: wrap;
  }
  .a-time-row:hover .a-time-del { opacity: 1; }

  .a-time-piece {
    padding: 1px 4px; border-radius: 4px;
    outline: none; cursor: text;
    background: #e8f9f1; color: #0a8f66;
    font-weight: 800; font-size: 11px;
    min-width: 32px; text-align: center; flex-shrink: 0;
    font-variant-numeric: tabular-nums; letter-spacing: .5px;
  }
  .a-time-piece.editing { background: #fff; box-shadow: 0 0 0 2px #16c58c; color: #1a1f36; }
  .a-time-sep { color: #5ec49b; font-weight: 800; font-size: 9px; flex-shrink: 0; }

  .a-min-chip {
    padding: 1px 8px; border-radius: 4px;
    outline: none; cursor: text;
    background: #e8f9f1; color: #0a8f66;
    font-weight: 800; font-size: 11px;
    min-width: 40px; text-align: center; flex-shrink: 0;
    border: 1px dashed #86dcb6;
  }
  .a-min-chip.editing {
    background: #fff; box-shadow: 0 0 0 2px #16c58c;
    color: #1a1f36; border-style: solid;
  }

  .a-time-del {
    width: 14px; height: 14px; border-radius: 4px;
    color: #b8bfcd; font-size: 12px; line-height: 1;
    display: grid; place-items: center;
    opacity: 0; transition: .14s;
    flex-shrink: 0; padding: 0; margin-left: 2px;
  }
  .a-time-del:hover { background: #ffe9eb; color: #e8455a; }

  .a-ppl {
    font-size: 10.5px; font-weight: 800; color: #7743e0;
    background: #f6f3ff; padding: 1.5px 6px;
    border-radius: 4px; outline: none;
    min-width: 22px; text-align: center; cursor: text;
    flex-shrink: 0;
  }
  .a-ppl.editing { background: #fff; box-shadow: 0 0 0 2px #8b5cf6; color: #1a1f36; }

  .a-seg-dur {
    font-size: 10.5px; font-weight: 800; color: #0a8f66;
    background: #dff5eb; padding: 1.5px 6px;
    border-radius: 4px; letter-spacing: .02em;
    white-space: nowrap; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    border: 1px solid #b8e6d0; margin-left: auto;
  }
  .a-seg-dur.zero { color: #b8bfcd; background: #f0f3fa; border-color: #e2e7f0; }

  .a-add-row { display: flex; align-items: center; gap: 3px; padding: 2px 0; }
  .a-add-btn {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 700;
    color: #0a8f66; padding: 3px 9px;
    border-radius: 6px; border: 1.5px dashed #86dcb6;
    background: #f5fdfa; transition: .14s; white-space: nowrap;
  }
  .a-add-btn:hover {
    background: #e8f9f1; border-color: #16c58c;
    transform: translateX(1px);
  }
  .a-add-btn::before { content: '+'; font-size: 13px; font-weight: 800; line-height: 1; }

  .a-add-form {
    display: none; flex-wrap: wrap; align-items: center; gap: 3px;
    padding: 5px; background: #f7fdfa; border-radius: 7px;
    border: 1px dashed #c9eddc; margin-top: 2px; width: 100%;
  }
  .a-add-form.show { display: flex; }
  .a-add-form input {
    border: 1.5px solid #d8f0e5; border-radius: 5px;
    padding: 3px 6px; font-size: 11px; color: #1a1f36;
    background: #fff; outline: none; transition: .14s;
    font-weight: 500; font-family: inherit;
  }
  .a-add-form input:focus {
    border-color: #16c58c;
    box-shadow: 0 0 0 2px rgba(16,185,129,.12);
  }
  .a-add-form input::placeholder { color: #b8bfcd; font-weight: 400; }
  .af-time {
    width: 68px; text-align: center;
    font-variant-numeric: tabular-nums;
    letter-spacing: .5px; font-weight: 600;
  }
  .af-num { width: 40px; text-align: center; }
  .af-sep { color: #b8bfcd; font-size: 10px; font-weight: 700; }
  .af-or {
    color: #0a8f66; font-size: 10px; font-weight: 800;
    padding: 0 2px; background: #e8f9f1; border-radius: 3px;
  }
  .af-summary {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; font-weight: 800; color: #0a8f66;
    background: #fff; border: 1.5px solid #c9eddc;
    padding: 2px 8px; border-radius: 5px;
    min-width: 60px; justify-content: center; white-space: nowrap;
  }
  .af-summary.zero { color: #b8bfcd; border-color: #e2f4eb; background: #f7fdfa; }
  .af-summary .lbl { font-size: 9.5px; color: #5ec49b; font-weight: 700; }
  .af-summary.zero .lbl { color: #b8bfcd; }

  .af-ok {
    height: 22px; padding: 0 9px; border-radius: 5px;
    background: linear-gradient(140deg, #16c58c, #0a8f66);
    color: #fff; font-size: 11px; font-weight: 700;
    box-shadow: 0 2px 6px rgba(16,185,129,.24);
  }
  .af-ok:hover { transform: translateY(-1px); }
  .af-cancel {
    height: 22px; padding: 0 9px; border-radius: 5px;
    background: #fff; color: #8b93a7;
    border: 1px solid #e2f4eb;
    font-size: 11px; font-weight: 700;
  }
  .af-cancel:hover { background: #f2f7f5; color: #1a1f36; }

  .a-card-foot { display: flex; align-items: center; gap: 6px; }
  .a-total-label {
    font-size: 10.5px; font-weight: 700; color: #8fd6b8;
    letter-spacing: .04em; text-transform: uppercase;
  }
  .a-dur {
    margin-left: auto; font-size: 12.5px; font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #16c58c, #0a8f66);
    padding: 3px 10px; border-radius: 6px;
    letter-spacing: .02em; white-space: nowrap;
    box-shadow: 0 2px 6px rgba(16,185,129,.22);
    font-variant-numeric: tabular-nums;
    cursor: pointer; outline: none; transition: .15s;
  }
  .a-dur:hover { filter: brightness(1.06); box-shadow: 0 4px 10px rgba(16,185,129,.3); }
  .a-dur.zero { background: #f0f3fa; color: #b8bfcd; box-shadow: none; }
  .a-dur.zero:hover { filter: none; box-shadow: none; }
  .a-dur.editing {
    background: #fff; color: #1a1f36;
    box-shadow: 0 0 0 2px #16c58c;
    padding: 3px 6px; min-width: 60px; text-align: center;
  }
  .a-dur.manual::after {
    content: '手'; font-size: 9px; font-weight: 800;
    background: rgba(255,255,255,.35); color: #fff;
    padding: 0 4px; border-radius: 3px;
    margin-left: 4px; letter-spacing: 0; vertical-align: middle;
  }

  .search-area { flex: 1; min-height: 0; display: none; }
  .search-area.show { display: flex; }
  body.searching .plan-area,
  body.searching .actual-area,
  body.searching .pending-banner { display: none; }

  .sr-item {
    display: grid;
    grid-template-columns: 88px 68px minmax(0, 1fr) 68px;
    gap: 10px; align-items: center;
    padding: 8px 12px; border-radius: 9px;
    border: 1px solid #eef2f9; background: #fbfcfe;
    margin-bottom: 5px; cursor: pointer;
    transition: .14s; font-size: 12.5px;
  }
  .sr-item:hover {
    background: #fff; border-color: #dde8ff;
    box-shadow: 0 4px 14px rgba(26,31,54,.08);
    transform: translateX(2px);
  }
  .sr-item[data-status="plan"] { border-left: 4px dashed #b3c5f7; }
  .sr-item[data-status="actual"] {
    border-left: 4px solid #0a8f66;
    font-family: Georgia,"Songti SC",serif;
  }

  .sr-date {
    font-size: 11px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #5b86ff, #3b66e6);
    padding: 3px 8px; border-radius: 6px;
    text-align: center; white-space: nowrap;
  }
  .sr-item[data-status="actual"] .sr-date {
    background: linear-gradient(135deg, #16c58c, #0a8f66);
  }

  .sr-type {
    font-size: 10.5px; font-weight: 800;
    padding: 3px 8px; border-radius: 999px;
    text-align: center; white-space: nowrap;
  }
  .sr-type.plan { color: #3b5bbf; background: #eef3ff; border: 1px dashed #b3c5f7; }
  .sr-type.actual { color: #fff; background: linear-gradient(135deg, #16c58c, #0a8f66); }

  .sr-main { min-width: 0; display: flex; align-items: center; gap: 7px; overflow: hidden; }
  .sr-order {
    font-size: 12px; font-weight: 800; color: #0a8f66;
    background: rgba(16,185,129,.12);
    padding: 2px 7px; border-radius: 5px;
    flex-shrink: 0; max-width: 90px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sr-name {
    font-weight: 700; color: #1a1f36;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }
  .sr-note {
    font-size: 11.5px; color: #8b93a7; font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    min-width: 0;
  }

  .sr-time {
    font-size: 11px; font-weight: 700; color: #0a8f66;
    background: #f0fdf8; padding: 3px 8px;
    border-radius: 6px; text-align: center;
    white-space: nowrap; font-variant-numeric: tabular-nums;
    justify-self: end;
  }
  .sr-time.plan { color: #3b5bbf; background: #eef3ff; }

  .empty-state {
    text-align: center; padding: 14px 10px;
    color: #cdd4e2; font-size: 12px; font-weight: 600;
  }
  .empty-state .ico { font-size: 20px; display: block; margin-bottom: 5px; opacity: .5; }
  .empty-state .msg { color: #8b93a7; }

  @media (max-width: 1100px) {
    .actual-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  }
  @media (max-width: 980px) {
    .sidebar { width: 200px; }
    .sr-note { display: none; }
    .top-search { width: 170px; }
    .top-search.focused { width: 220px; }
    .actual-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
  }
  @media (max-width: 720px) {
    .app { flex-direction: column; padding: 6px; gap: 6px; }
    .sidebar {
      width: 100%; flex-direction: row;
      overflow-x: auto; overflow-y: hidden;
      max-height: 150px;
    }
    .card { min-width: 200px; flex-shrink: 0; }
    .notes-card { display: none; }
    .plan-area { grid-template-columns: 1fr; flex: 1; }
    .actual-area { flex: 1.2; }
    .day-title { font-size: 14px; }
    .top-search { width: 110px; max-width: 28vw; }
    .top-search.focused { width: 150px; }
    .actual-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
    .sr-item { grid-template-columns: 68px 58px minmax(0,1fr); gap: 6px; padding: 7px 9px; }
    .sr-time { display: none; }
    .p-header, .p-row {
      grid-template-columns: minmax(0, 1fr) 96px 110px 22px;
      gap: 10px;
    }
    .p-header.other, .p-row.other {
      grid-template-columns: 90px 96px minmax(0, 1fr) 22px;
    }
    .pending-hint { display: none; }
    .btn-ghost span { display: none; }
    .btn-ghost { padding: 0 8px; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="card">
      <div class="cal-head">
        <span class="cal-month" id="calMonth">—</span>
        <div class="cal-nav">
          <button class="nav-btn" id="calPrev" title="上个月">‹</button>
          <button class="nav-btn" id="calNext" title="下个月">›</button>
        </div>
      </div>
      <div class="cal-week">
        <span>一</span><span>二</span><span>三</span><span>四</span>
        <span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="card notes-card">
      <div class="card-head">
        <span class="card-title">重点提醒</span>
        <button class="mini-add" id="noteAdd" title="添加提醒">+</button>
      </div>
      <div class="notes-list" id="notesList"></div>
    </div>
  </aside>

  <main class="main">

    <div class="top-row">
      <div class="day-title" id="dayTitle">—</div>

      <div class="sync-status" id="syncStatus">
        <span class="dot"></span>
        <span id="syncText">连接中…</span>
      </div>

      <button class="btn-ghost" id="exportBtn" title="导出数据到文件">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>
        </svg>
        <span>导出</span>
      </button>
      <button class="btn-ghost" id="importBtn" title="从文件导入数据">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21V9M7 14l5-5 5 5M5 3h14"/>
        </svg>
        <span>导入</span>
      </button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">

      <div class="top-search" id="searchWrap">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.4" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索单号 / 名称 / 安排…" maxlength="30">
        <button class="clr" id="searchClear" title="清除">×</button>
      </div>

      <div class="day-nav">
        <button class="nav-btn" id="dayPrev" title="前一天">‹</button>
        <button class="nav-btn" id="dayToday" style="font-size:11px;padding:0 9px;">今天</button>
        <button class="nav-btn" id="dayNext" title="后一天">›</button>
      </div>
    </div>

    <div class="pending-banner hide" id="pendingBanner">
      <div class="pending-title">
        <span class="dot"></span>
        未完成的计划
        <span class="pending-count" id="pendingCount">0</span>
        <span class="pending-hint">点击可跳到对应日期</span>
      </div>
      <div class="pending-list" id="pendingList"></div>
    </div>

    <div class="plan-area">

      <section class="box">
        <div class="box-head">
          <span class="badge badge-plan">👥 人员</span>
          <span class="head-info" id="peopleInfo">双击文字改</span>
        </div>
        <div class="quick-row people-quick">
          <input class="qi qi-name" id="pName" type="text" placeholder="人员姓名（不限字数）" data-jump="1">
          <input class="qi qi-time" id="pStart" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" data-jump="1">
          <span class="qi-sep">→</span>
          <input class="qi qi-time" id="pEnd" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" data-jump="1">
          <input class="qi qi-note" id="pNote" type="text" placeholder="安排" maxlength="60" data-jump="1">
          <button class="qi-add" id="pAdd">添加</button>
        </div>
        <div class="p-header">
          <span>人员</span><span>时间</span><span>安排</span><span>✓</span>
        </div>
        <div class="box-body" id="peopleBody"></div>
      </section>

      <section class="box">
        <div class="box-head">
          <span class="badge badge-plan event">📌 其他安排</span>
          <span class="head-info" id="otherInfo">双击文字改</span>
        </div>
        <div class="quick-row other-quick">
          <input class="qi qi-name" id="oName" type="text" placeholder="安排" maxlength="60" data-jump="1">
          <input class="qi qi-time" id="oStart" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" data-jump="1">
          <span class="qi-sep">→</span>
          <input class="qi qi-time" id="oEnd" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" data-jump="1">
          <input class="qi qi-note" id="oNote" type="text" placeholder="备注" maxlength="30" data-jump="1">
          <button class="qi-add" id="oAdd">添加</button>
        </div>
        <div class="p-header other">
          <span>其他安排</span><span>时间</span><span>安排</span><span>✓</span>
        </div>
        <div class="box-body" id="otherBody"></div>
      </section>

    </div>

    <section class="box actual-area">
      <div class="box-head">
        <span class="badge badge-actual">✅ 实际</span>
        <span class="head-info" id="actualInfo">双击文字改 · 点 + 加时间段</span>
        <span class="head-total" id="actualTotal"></span>
      </div>
      <div class="quick-row actual">
        <input class="qi qi-order" id="aOrder" type="text" placeholder="单号 / 名称（如：加班）" maxlength="30" data-jump="1">
        <input class="qi qi-time" id="aStart" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" data-jump="1">
        <span class="qi-sep">→</span>
        <input class="qi qi-time" id="aEnd" type="text" inputmode="numeric" placeholder="HH:MM" maxlength="5" data-jump="1">
        <input class="qi qi-people" id="aPeople" type="number" min="1" value="1" placeholder="人" data-jump="1">
        <span class="or-sep">或</span>
        <input class="qi qi-num" id="aHour" type="number" min="0" max="24" value="0" data-jump="1">
        <span class="qi-sep">时</span>
        <input class="qi qi-num" id="aMin" type="number" min="0" max="59" value="0" data-jump="1">
        <span class="qi-sep">分</span>
        <span class="qi-preview zero" id="aPreview">
          <span class="label">用时</span>
          <span class="val">—</span>
        </span>
        <button class="qi-add" id="aAdd">添加</button>
      </div>
      <div class="box-body" id="actualBody">
        <div class="actual-grid" id="actualGrid"></div>
      </div>
    </section>

    <section class="box search-area" id="searchArea">

const timeToMin = t => {
  if (!t) return 0;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
};

function fmtDuration(min) {
  if (!min || min <= 0) return '—';
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (h && m) return h + 'h' + m + 'm';
  if (h) return h + 'h';
  return m + 'm';
}

function durationMin(start, end) {
  if (!start || !end) return 0;
  const s = timeToMin(start), e = timeToMin(end);
  return e > s ? e - s : 0;
}

function parseDurationInput(s) {
  if (s === null || s === undefined) return null;
  const t = String(s).trim().toLowerCase();
  if (!t) return 0;
  if (/^\d+$/.test(t)) return Math.max(0, parseInt(t, 10));
  const hm = t.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?$/);
  if (hm && (hm[1] || hm[2])) {
    return (parseInt(hm[1] || 0, 10) * 60) + parseInt(hm[2] || 0, 10);
  }
  const colon = t.match(/^(\d+)\s*[:：]\s*(\d+)$/);
  if (colon) return parseInt(colon[1], 10) * 60 + parseInt(colon[2], 10);
  const dec = t.match(/^(\d+(?:\.\d+)?)\s*(?:h|小时|时)$/);
  if (dec) return Math.round(parseFloat(dec[1]) * 60);
  return null;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,

}

/* ============================================================
 *  时间工具（支持 24:00）
 * ============================================================ */

/* 判断是否合法时间：支持 00:00–23:59，也支持 24:00 */
function isValidHourMin(h, min) {
  if (h === 24) return min === 0;   // 只允许 24:00
  return h >= 0 && h < 24 && min >= 0 && min < 60;
}

function isCompleteTime(str) {
  if (!str) return false;
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})$/);
  if (m) return isValidHourMin(+m[1], +m[2]);
  if (/^\d{4}$/.test(s)) {
    return isValidHourMin(+s.slice(0, 2), +s.slice(2));
  }
  return false;
}

function normalizeTime(str) {
  if (!str) return '';
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2}):(\d{1,2})$/);
  if (m) {
    const h = +m[1], min = +m[2];
    if (!isValidHourMin(h, min)) return '';
    if (h === 24) return '24:00';
    return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
  }
  if (/^\d{4}$/.test(s)) {
    const h = +s.slice(0, 2);
    const min = +s.slice(2);
    if (!isValidHourMin(h, min)) return '';
    if (h === 24) return '24:00';
    return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
  }
  return '';
}

function tryFormatTimeField(input) {
  const v = input.value;
  if (!v) return false;
  if (v.includes(':')) {
    const m = v.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return false;
    const h = +m[1], min = +m[2];
    if (!isValidHourMin(h, min)) return false;
    const nv = (h === 24)
      ? '24:00'
      : String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
    if (nv !== v) {
      input.value = nv;
      try { input.setSelectionRange(5, 5); } catch(e) {}
      return true;
    }
    return false;
  }
  if (/^\d{4}$/.test(v)) {
    const h = +v.slice(0, 2);
    const min = +v.slice(2);
    if (!isValidHourMin(h, min)) return false;
    const nv = (h === 24) ? '24:00' : v.slice(0, 2) + ':' + v.slice(2);
    input.value = nv;
    try { input.setSelectionRange(5, 5); } catch(e) {}
    return true;
  }
  return false;
}

function filterTimeInput(input) {
  const oldVal = input.value;
  let v = oldVal.replace(/[^\d:]/g, '');
  let cursorPos = 0;
  try { cursorPos = input.selectionStart || 0; } catch(e) {}

  if (v.includes(':')) {
    const parts = v.split(':');
    if (parts.length > 2) v = parts[0] + ':' + parts.slice(1).join('');
    if (v.length > 5) v = v.slice(0, 5);
    if (v !== oldVal) {
      input.value = v;
      const diff = oldVal.length - v.length;
      const np = Math.max(0, cursorPos - diff);
      try { input.setSelectionRange(np, np); } catch(e) {}
    }
    return;
  }

  if (!/^\d*$/.test(v)) { input.value = ''; return; }
  if (v.length > 4) v = v.slice(0, 4);

  if (v.length === 4) {
    const h = +v.slice(0, 2);
    const min = +v.slice(2);
    if (isValidHourMin(h, min)) {
      const nv = (h === 24) ? '24:00' : v.slice(0, 2) + ':' + v.slice(2);
      input.value = nv;
      try { input.setSelectionRange(5, 5); } catch(e) {}
      return;
    }
  }
  if (v !== oldVal) input.value = v;
}

function setupTimeField(input) {
  if (!input || input._timeFieldBound) return;
  input._timeFieldBound = true;
  input.addEventListener('input', () => {
    filterTimeInput(input);
    tryFormatTimeField(input);
  });
  input.addEventListener('blur', () => {
    const v = normalizeTime(input.value);
    if (v && v !== input.value) {
      input.value = v;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    } else if (!input.value.trim()) {
      /* 空字符串保持为空，不做修改 */
    }
  });
}

function attachAutoJump(startRef, endRef) {
  const startEl = (typeof startRef === 'string') ? $(startRef) : startRef;
  const endEl = (typeof endRef === 'string') ? $(endRef) : endRef;
  if (!startEl || !endEl) return;

  setupTimeField(startEl);
  setupTimeField(endEl);

  let jumpTimer = null;
  const scheduleJump = () => {
    if (jumpTimer) clearTimeout(jumpTimer);
    if (document.activeElement !== startEl) return;
    if (!isCompleteTime(startEl.value)) return;
    jumpTimer = setTimeout(() => {
      jumpTimer = null;
      if (document.activeElement === startEl) {
        const v = normalizeTime(startEl.value);
        if (v) startEl.value = v;
        endEl.focus();
        try { if (endEl.select) endEl.select(); } catch(e){}
      }
    }, 500);
  };
  startEl.addEventListener('input', scheduleJump);
  startEl.addEventListener('change', scheduleJump);
}

/* ============================================================

 * ============================================================ */
function getSiblingFields(el) {
  const container = el.closest('.quick-row, .a-add-form, .a-card, .sidebar, .box');
  if (!container) return [];
  return Array.from(container.querySelectorAll('input')).filter(x => {
    if (x.offsetParent === null) return false;
    if (x.type === 'hidden') return false;
    if (x.type === 'file') return false;
    return true;
  });
}

function focusFieldByOffset(el, offset) {
  const fields = getSiblingFields(el);
  const idx = fields.indexOf(el);
  if (idx < 0) return;
  const next = fields[idx + offset];
  if (next) {
    next.focus();
    try { next.select(); } catch(e){}
  }
}

function bindArrowNav() {
  document.addEventListener('keydown', e => {
    const el = document.activeElement;
    if (!el || el.tagName !== 'INPUT') return;
    if (el.type !== 'text' && el.type !== 'number') return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      const atEnd = el.selectionStart === el.value.length && el.selectionEnd === el.value.length;
      if (atEnd || el.value.length === 0) {
        e.preventDefault();
        focusFieldByOffset(el, +1);
      }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      const atStart = el.selectionStart === 0 && el.selectionEnd === 0;
      if (atStart || el.value.length === 0) {
        e.preventDefault();
        focusFieldByOffset(el, -1);
      }
    }
  });
}

function makeEditable(el, getVal, setVal, opts = {}) {
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (el.querySelector('input, textarea')) return;
    const oldVal = String(getVal() ?? '');
    const input = document.createElement('input');
    input.type = opts.type || 'text';
    if (opts.min !== undefined) input.min = opts.min;
    if (opts.maxlength) input.maxLength = opts.maxlength;
    input.value = oldVal;
    input.style.cssText = `
      width:100%; border:none; outline:none; background:#fff;
      font:inherit; color:inherit; text-align:inherit;
      padding:0; margin:0; border-radius:inherit;
    `;
    el.textContent = '';
    el.classList.add('editing');
    el.appendChild(input);
    input.focus();
    if (input.select) input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) {
        const v = input.value.trim();
        setVal(v);
        save();
        if (opts.onCommit) opts.onCommit(v);
      }
      el.classList.remove('editing');
      el.textContent = String(getVal() ?? '');
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
}

function makeMultiLineEditable(el, getVal, setVal, opts = {}) {
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (el.querySelector('input, textarea')) return;
    const oldVal = String(getVal() ?? '');
    const ta = document.createElement('textarea');
    ta.value = oldVal;
    ta.rows = Math.max(2, (oldVal.split('\n').length + 1));
    if (opts.maxlength) ta.maxLength = opts.maxlength;
    ta.style.cssText = `
      width:100%; border:none; outline:none; background:transparent;
      font:inherit; color:inherit; text-align:inherit;
      padding:0; margin:0; border-radius:inherit;
      resize: vertical; line-height: 1.5;
    `;
    el.textContent = '';
    el.classList.add('editing');
    el.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) {
        const v = ta.value.replace(/\s+$/,'');
        setVal(v);
        save();
        if (opts.onCommit) opts.onCommit(v);
      }
      el.classList.remove('editing');
      el.textContent = String(getVal() ?? '');
    };
    ta.addEventListener('blur', () => close(true));
    ta.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) {
        ev.preventDefault(); ta.blur();
      }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
}

/* 原地时间编辑：允许清空 */
function makeTextTimeEditable(el, getVal, setVal, opts = {}) {
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (el.querySelector('input')) return;
    const oldVal = String(getVal() ?? '');

      padding:0; margin:0; border-radius:inherit;
      letter-spacing:0.5px;
      font-variant-numeric: tabular-nums;
    `;
    el.textContent = '';
    el.classList.add('editing');
    el.appendChild(input);
    input.focus();
    input.select();
    let jumpTimer = null;
    const scheduleJump = () => {
      if (jumpTimer) clearTimeout(jumpTimer);
      if (!isCompleteTime(input.value)) return;
      jumpTimer = setTimeout(() => {
        jumpTimer = null;
        if (document.activeElement === input) input.blur();
      }, 500);
    };
    input.addEventListener('input', () => {
      filterTimeInput(input);
      tryFormatTimeField(input);
      scheduleJump();
    });
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (jumpTimer) { clearTimeout(jumpTimer); jumpTimer = null; }
      if (commit) {
        const raw = input.value.trim();
        if (raw === '') {
          /* 允许清空 */
          setVal('');
          save();
        } else {
          const v = normalizeTime(raw);
          if (v) { setVal(v); save(); }
          /* 无效输入：不保存，保留原值 */
        }
      }
      el.classList.remove('editing');
      el.textContent = String(getVal() ?? '');
      if (opts.onEditEnd) opts.onEditEnd(commit);
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
}

async function load() {

    setSyncStatus('加载中…', false);

    const { data: items, error: e1 } = await supa.from('schedule_items').select('*');
    const { data: notes, error: e2 } = await supa.from('schedule_notes').select('*');

    state.items = (items || []).map(it => ({
      id: it.id,
      date: it.date,
      status: it.status,
      kind: it.kind,
      done: it.done,
      title: it.title,
      sub: it.sub,
      start: it.start_time,
      end: it.end_time,
      minutes: it.minutes,
      people: it.people,
    }));

    state.notes = (notes || []).map(n => ({
      id: n.id,
      date: n.date,
      text: n.text,
    }));

    state.manualTotals = {};
    (totals || []).forEach(t => {
      state.manualTotals[t.date + '|' + t.order_key] = t.minutes;
    });

    if (!state.items.length && !state.notes.length) seed();

    setSyncStatus('已同步', false);
  } catch (e) {
    console.warn('从 Supabase 加载失败', e);
    setSyncStatus('离线模式', true);
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      state.items = d.items || [];
      state.notes = d.notes || [];
      state.manualTotals = d.manualTotals || {};
    } else {
      seed();
    }
  }
}

  const { y, m } = state.view;
  $('calMonth').textContent = `${y}年${m + 1}月`;

  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const today = todayKey();
  const marked = new Set(state.notes.map(n => n.date));

  const pendingDates = new Set();
  state.items.forEach(it => {
    if (it.status === 'plan' && !it.done) pendingDates.add(it.date);
  });

  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, i - offset + 1);
    const key = dk(d);
    const cls = ['cal-day'];
    if (d.getMonth() !== m) cls.push('out');
    if (key === today) cls.push('today');
    if (key === state.selected) cls.push('sel');
    if (marked.has(key)) cls.push('marked');
    if (pendingDates.has(key)) cls.push('has-pending');
    html += `<div class="${cls.join(' ')}" data-date="${key}">${d.getDate()}</div>`;
  }
  $('calGrid').innerHTML = html;
}

function onCalClick(e) {
  const cell = e.target.closest('.cal-day');
  if (!cell || !cell.dataset.date) return;
  selectDate(cell.dataset.date);
}

function onCalDblClick(e) {
  const cell = e.target.closest('.cal-day');
  if (!cell || !cell.dataset.date) return;
  const date = cell.dataset.date;
  const existing = state.notes.filter(n => n.date === date);
  if (existing.length) {
    if (confirm(`取消 ${parseKey(date).getMonth()+1}.${parseKey(date).getDate()} 的重点标记？`)) {
      state.notes = state.notes.filter(n => n.date !== date);
      save();
      renderCalendar();
      renderNotes();
    }
  } else {
    state.notes.push({ id: uid(), date, text: '' });
    save();
    renderCalendar();
    renderNotes();
    const rows = $('notesList').querySelectorAll('.note-text');
    const last = rows[rows.length - 1];
    if (last) last.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
  }
}

/* ============================================================
 *  重点提醒
 * ============================================================ */
function renderNotes() {
  const box = $('notesList');
  const notes = state.notes.slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!notes.length) {
    box.innerHTML = '<div class="empty-hint">双击日历日期添加</div>';
    return;
  }
  box.innerHTML = '';
  notes.forEach(note => {
    const row = document.createElement('div');
    row.className = 'note-row';

    const dateEl = document.createElement('span');
    dateEl.className = 'note-date';
    const d = parseKey(note.date);
    dateEl.textContent = `${d.getMonth() + 1}.${d.getDate()}`;
    makeEditable(dateEl,
      () => {
        const dd = parseKey(note.date);
        return `${dd.getMonth() + 1}.${dd.getDate()}`;
      },
      v => {
        const m = v.match(/^(\d{1,2})\s*[\.\/月-]\s*(\d{1,2})/);
        if (m) {
          const mm = parseInt(m[1], 10) - 1;
          const dd = parseInt(m[2], 10);
          const yr = parseKey(note.date).getFullYear();
          note.date = dk(new Date(yr, mm, dd));
        }
      },
      { maxlength: 8, onCommit: () => { renderCalendar(); renderNotes(); } }
    );

    const textEl = document.createElement('span');
    textEl.className = 'note-text';
    textEl.textContent = note.text;
    textEl.dataset.ph = '双击输入提醒（可换行）';
    makeMultiLineEditable(textEl, () => note.text, v => { note.text = v; }, { maxlength: 200 });

    const del = document.createElement('button');
    del.className = 'note-del';
    del.textContent = '×';
    del.title = '删除';
    del.addEventListener('click', e => {
      e.stopPropagation();
      state.notes = state.notes.filter(x => x.id !== note.id);
      save();
      renderNotes();
      renderCalendar();
    });

    row.append(dateEl, textEl, del);
    box.appendChild(row);
  });
}

/* ============================================================
 *  置顶：未完成计划（跨日期）
 * ============================================================ */
function renderPendingBanner() {
  const banner = $('pendingBanner');
  const list = $('pendingList');
  const cnt = $('pendingCount');

  const pending = state.items.filter(it => it.status === 'plan' && !it.done);
  if (!pending.length) {
    banner.classList.add('hide');
    return;
  }

  pending.sort((a, b) => {
    if (a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.start || '99:99').localeCompare(b.start || '99:99');
  });

  banner.classList.remove('hide');
  cnt.textContent = pending.length;

  const today = todayKey();

  list.innerHTML = '';
  pending.forEach(it => {
    const d = parseKey(it.date);
    const isToday = it.date === today;

    let dateLabel;
    if (isToday) {
      dateLabel = '今天';
    } else {
      const tomorrowDate = new Date();
      tomorrowDate.setDate(tomorrowDate.getDate() + 1);
      if (it.date === dk(tomorrowDate)) {
        dateLabel = '明天';
      } else {
        dateLabel = `${d.getMonth() + 1}.${d.getDate()}`;
      }
    }

    const timeStr = it.start
      ? (it.end ? `${it.start}–${it.end}` : it.start)
      : '全天';

    const kindName = it.kind === 'staff' ? '兼职'
                    : it.kind === 'guest' ? '客人'
                    : '日程';

    const el = document.createElement('div');
    el.className = 'pending-item ' + it.kind + (isToday ? ' today' : '');
    el.innerHTML = `
      <span class="date">${esc(dateLabel)}</span>
      <span class="time">${esc(timeStr)}</span>
      <span class="kind-badge">${kindName}</span>
      <span class="name">${esc(it.title || '未命名')}</span>
      ${it.sub ? `<span class="task">${esc(it.sub)}</span>` : ''}
    `;

    el.addEventListener('click', () => {
      if (it.date !== state.selected) {
        selectDate(it.date);
      }
      setTimeout(() => {
        const row = document.querySelector(`.p-row[data-id="${it.id}"]`);
        if (row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          row.classList.add('highlight');
          setTimeout(() => row.classList.remove('highlight'), 1400);
        }
      }, 120);
    });

    list.appendChild(el);
  });
}

/* ============================================================
 *  计划
 * ============================================================ */
function renderPlanPeople() {
  const body = $('peopleBody');
  const list = state.items
    .filter(it => it.date === state.selected && it.status === 'plan'

    .sort((a, b) => (a.start || '99:99').localeCompare(b.start || '99:99'));

function renderPlanOther() {
  const body = $('otherBody');
  const list = state.items
    .filter(it => it.date === state.selected && it.status === 'plan'
              && it.kind === 'event')
    .sort((a, b) => (a.start || '99:99').localeCompare(b.start || '99:99'));

  if (!list.length) {
    body.innerHTML = `<div class="empty-state"><span class="ico">📌</span>暂无其他安排</div>`;

  body.innerHTML = '';

  row.dataset.id = item.id;

  st.dataset.ph = '--:--';
  makeTextTimeEditable(st, () => item.start, v => { item.start = v; }, {

    save();

    renderCalendar();
  });

  row.append(name, tg, note, check, del);
