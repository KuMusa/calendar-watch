<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的日程表</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12.5px; line-height: 1.35; color: #1a1f36;
    background: radial-gradient(900px 500px at 4% -6%, #e4ecff 0%, transparent 55%),
                radial-gradient(800px 400px at 98% -2%, #ffe8f1 0%, transparent 52%), #eef2f9;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .app { display: flex; height: 100vh; height: 100dvh; padding: 8px; gap: 4px; overflow: hidden; }

  .splitter { flex-shrink: 0; position: relative; z-index: 10;
              background: transparent; touch-action: none; }
  .v-splitter { width: 10px; cursor: col-resize; }
  .h-splitter { height: 10px; cursor: row-resize; }
  .splitter::before { content: ''; position: absolute; background: #dde3ef;
                      border-radius: 3px; transition: background .15s; }
  .v-splitter::before { width: 4px; height: 40px; left: 50%; top: 50%;
                        transform: translate(-50%, -50%); }
  .h-splitter::before { height: 4px; width: 60px; left: 50%; top: 50%;
                        transform: translate(-50%, -50%); }
  .splitter:hover::before, .splitter.active::before { background: #5b86ff; }
  body.dragging { user-select: none; }
  body.dragging.v { cursor: col-resize; }
  body.dragging.h { cursor: row-resize; }

  /* ============ 侧栏 ============ */
  .sidebar {
    width: var(--sidebar-w, 240px);
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 8px;
    min-height: 0;
    overflow: hidden;
  }
  .side-toggle { display: flex; gap: 3px; padding: 3px; background: #fff; border-radius: 10px;
                 box-shadow: 0 2px 10px rgba(26,31,54,.06); flex-shrink: 0; }
  .seg-btn { flex: 1; height: 30px; border-radius: 7px; font-size: 12px; font-weight: 700;
             color: #8b93a7; transition: .15s; display: inline-flex; align-items: center;
             justify-content: center; gap: 4px; }
  .seg-btn:hover { background: #f5f8ff; color: #4f7cff; }
  .seg-btn.active { background: linear-gradient(140deg, #5b86ff, #3b66e6); color: #fff;
                    box-shadow: 0 3px 8px rgba(79,124,255,.28); }

  #sideCalendar {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-rows: minmax(0, 2fr) 10px minmax(0, 1fr);
    gap: 0;
  }
  #sideCalendar .card {
    min-height: 0;
    overflow: auto;
    margin: 0;
  }
  #sideCalendar .card::-webkit-scrollbar { width: 5px; }
  #sideCalendar .card::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }
  #sideCalendar .notes-card { display: flex; flex-direction: column; }
  #sideCalendar .notes-card .notes-list {
    flex: 1; min-height: 0; max-height: none;
  }
  #sideOrders {
    flex: 1; min-height: 0; display: none;
    flex-direction: column; gap: 8px;
    overflow: hidden;
  }
  #sideOrders .card {
    flex: 1; min-height: 0; overflow: auto; margin: 0;
  }
  #sideOrders .card::-webkit-scrollbar { width: 5px; }
  #sideOrders .card::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }

  .card { background: #fff; border-radius: 12px; padding: 10px;
          box-shadow: 0 2px 10px rgba(26,31,54,.06); flex-shrink: 0; }
  .cal-head { display: flex; align-items: center; margin-bottom: 8px; }
  .cal-month { font-size: 14px; font-weight: 800; }
  .cal-nav { margin-left: auto; display: flex; gap: 3px; }
  .nav-btn { height: 24px; min-width: 24px; padding: 0 6px; border-radius: 6px;
             border: 1px solid #e9edf5; background: #fff; color: #4a5368;
             font-size: 12px; font-weight: 700; display: grid; place-items: center; transition: .15s; }
  .nav-btn:hover { background: #eef3ff; border-color: #c8d8ff; color: #4f7cff; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
  .cal-week span { text-align: center; font-size: 9.5px; font-weight: 700; color: #b8bfcd; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day { aspect-ratio: 1; border-radius: 7px; border: 2px solid transparent;
             background: #f8fafd; display: grid; place-items: center;
             font-size: 11.5px; font-weight: 600; color: #1a1f36; cursor: pointer;
             transition: .14s; position: relative; user-select: none; }
  .cal-day:hover { background: #eef3ff; }
  .cal-day.out { color: #cdd4e2; background: transparent; }
  .cal-day.today { color: #ff7a2f; font-weight: 800; }
  .cal-day.today::after { content: ''; position: absolute; bottom: 2px; left: 50%;
                          transform: translateX(-50%); width: 3px; height: 3px;
                          border-radius: 50%; background: #ff8c42; }
  .cal-day.marked { border-color: #ff5a5f; color: #ff3b41; background: #fff5f5; font-weight: 800; }
  .cal-day.sel { background: linear-gradient(140deg, #5b86ff, #3b66e6); color: #fff;
                 box-shadow: 0 4px 12px rgba(79,124,255,.32); }
  .cal-day.sel.today { color: #fff; }
  .cal-day.sel.today::after { background: #fff; }
  .cal-day.sel.marked { border-color: #ff5a5f; }
  .cal-day.has-pending { box-shadow: inset 0 -3px 0 #f59e0b; }
  .cal-day.sel.has-pending { box-shadow: inset 0 -3px 0 #f59e0b, 0 4px 12px rgba(79,124,255,.32); }

  /* ★ 订单定位高亮 */
  .cal-day.dim-date { opacity: .18; }
  .cal-day.dim-date:hover { opacity: .55; background: #eef3ff; }
  /* ★ "今天"即使在变灰状态下，也保持可见（数字加粗+描边） */
  .cal-day.dim-date.today {
    opacity: 1;
    color: #ff7a2f;
    font-weight: 900;
    background: #fff4ec;
    border: 2px dashed #ff9d5c;
  }
  .cal-day.dim-date.today::after { background: #ff8c42; }

  .cal-day.highlight-date {
    background: linear-gradient(135deg, #f6f3ff, #ede5ff);
    color: #7743e0;
    font-weight: 900;
    border: 2px solid #c9b3f5;
    box-shadow: 0 3px 10px rgba(119,67,224,.2);
  }
  .cal-day.highlight-date:hover { background: #ede5ff; }
  /* 高亮日期正好是今天 → 更醒目 */
  .cal-day.highlight-date.today {
    color: #7743e0;
    background: linear-gradient(135deg, #fff0f8, #f0e4ff);
    border-color: #b39aff;
    font-weight: 900;
  }
  .cal-day.highlight-date.today::after { background: #7743e0; }
  .cal-day.highlight-date.sel {
    background: linear-gradient(140deg, #8b5cf6, #7743e0);
    color: #fff;
    border-color: #7743e0;
    box-shadow: 0 4px 14px rgba(119,67,224,.4);
  }
  .cal-day.highlight-date.sel.today::after { background: #fff; }

  /* ★ 高亮提示条 */
  .cal-highlight-tip {
    display: none;
    align-items: center; gap: 6px;
    padding: 6px 10px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #f6f3ff, #ede5ff);
    border: 1.5px solid #c9b3f5;
    border-radius: 8px;
    font-size: 11.5px; font-weight: 700; color: #7743e0;
    animation: slideDown .22s ease;
  }
  .cal-highlight-tip.show { display: flex; }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  .cal-highlight-tip .ord {
    background: #7743e0; color: #fff;
    padding: 1px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 800;
    font-variant-numeric: tabular-nums;
    max-width: 100px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .cal-highlight-tip .days { font-size: 10.5px; color: #9a7bdc; font-weight: 700; }
  .cal-highlight-tip .clr {
    margin-left: auto;
    width: 20px; height: 20px; border-radius: 5px;
    display: grid; place-items: center;
    font-size: 14px; color: #9a7bdc;
    cursor: pointer; transition: .14s;
  }
  .cal-highlight-tip .clr:hover { background: #e0d5ff; color: #7743e0; }

  .card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .card-title { font-size: 10.5px; font-weight: 800; color: #8b93a7;
                letter-spacing: .08em; text-transform: uppercase; }
  .mini-add { margin-left: auto; width: 18px; height: 18px; border-radius: 5px;
              border: 1px solid #e9edf5; background: #fff; color: #4f7cff;
              font-size: 13px; line-height: 1; display: grid; place-items: center; }

  .notes-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .note-row { display: grid; grid-template-columns: 16px auto minmax(0,1fr) auto;
              gap: 6px; padding: 5px 6px; margin: 0 -6px;
              border-radius: 7px; font-size: 12px; align-items: start; }
  .note-row:hover { background: #fff5f5; }
  .note-check {
    width: 16px; height: 16px; border-radius: 4px;
    border: 2px solid #cfd6e6; background: #fff;
    display: grid; place-items: center;
    transition: .14s; padding: 0; flex-shrink: 0;
    align-self: start; margin-top: 1px; cursor: pointer;
  }
  .note-check:hover { border-color: #4f7cff; transform: scale(1.08); }
  .note-check.on {
    background: linear-gradient(140deg, #16c58c, #0a8f66);
    border-color: #0a8f66;
    box-shadow: 0 2px 6px rgba(16,185,129,.32);
  }
  .note-check.on::after {
    content: ''; width: 3.5px; height: 7px;
    border: solid #fff; border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -2px);
  }
  .note-date { font-size: 10px; font-weight: 800; color: #ff3b41; background: #fff0f0;
               padding: 2px 5px; border-radius: 4px; outline: none; cursor: text;
               text-align: center; white-space: nowrap; align-self: start; margin-top: 1px; }
  .note-text { color: #1a1f36; font-weight: 500; outline: none; border-radius: 5px;
               padding: 1px 3px; margin: 0 -3px; cursor: text; white-space: pre-wrap;
               word-break: break-word; line-height: 1.5; min-height: 16px; }
  .note-text:empty::before { content: attr(data-ph); color: #b8bfcd; font-weight: 400; }
  .note-text.editing { background: #fff; box-shadow: 0 0 0 2px #ff5a5f; }
  .note-text.editing textarea { width: 100%; border: none; outline: none;
    background: transparent; font: inherit; color: inherit; resize: vertical;
    padding: 0; margin: 0; line-height: 1.5; min-height: 40px; }
  .note-del { width: 16px; height: 16px; border-radius: 4px; color: #cdd4e2;
              font-size: 13px; display: grid; place-items: center; flex-shrink: 0;
              opacity: 0; transition: .14s; align-self: start; margin-top: 1px; }
  .note-row:hover .note-del { opacity: 1; }
  .note-row.done .note-text { color: #b8bfcd; text-decoration: line-through; }
  .note-row.done .note-date { color: #b8bfcd; background: #f0f3fa; }
  .notes-done-toggle {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 8px; margin-top: 4px;
    border-radius: 6px; font-size: 11px; font-weight: 700;
    color: #8b93a7; cursor: pointer; transition: .14s;
    border-top: 1px dashed #eef2f9; user-select: none;
  }
  .notes-done-toggle:hover { background: #f8fafd; color: #4f7cff; }
  .notes-done-toggle .arrow { font-size: 9px; transition: transform .16s;
                              display: inline-block; color: #b8bfcd; }
  .notes-done-toggle.open .arrow { transform: rotate(90deg); color: #4f7cff; }
  .notes-done-toggle .count { margin-left: auto; background: #eef3ff; color: #4f7cff;
                              padding: 1px 7px; border-radius: 999px;
                              font-size: 10px; font-weight: 800; }
  .notes-done-group { display: none; flex-direction: column; gap: 4px; padding-top: 2px; }
  .notes-done-group.open { display: flex; }
  .empty-hint { font-size: 11px; color: #b8bfcd; text-align: center; padding: 6px 4px; }

  /* 订单视图 */
  .order-list { display: flex; flex-direction: column; gap: 5px; }
  .order-item { border: 1px solid #eef2f9; border-radius: 8px; background: #fbfcfe;
                overflow: hidden; }
  .order-item.open { background: #fff; border-color: #c8d8ff;
                     box-shadow: 0 3px 10px rgba(79,124,255,.1); }
  .order-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer;
                user-select: none; }
  .order-arrow { font-size: 9px; color: #b8bfcd; width: 10px; text-align: center;
                 transition: transform .16s; }
  .order-item.open .order-arrow { transform: rotate(90deg); color: #4f7cff; }
  .order-name { font-size: 12px; font-weight: 800; color: #0a8f66; flex: 1;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-time { font-size: 11.5px; font-weight: 800; color: #0a8f66;
                background: #e8f9f1; padding: 2px 8px; border-radius: 5px;
                font-variant-numeric: tabular-nums; }
  .order-detail { display: none; flex-direction: column; padding: 0 10px 8px; }
  .order-item.open .order-detail { display: flex; }
  .order-day { display: flex; align-items: center; gap: 6px; font-size: 11px;
               padding: 4px 0; border-top: 1px dashed #eef2f9; }
  .order-day-date { font-weight: 800; color: #4a5368; min-width: 40px; }
  .order-day-segs { flex: 1; color: #8b93a7; font-weight: 600;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-day-total { font-weight: 800; color: #0a8f66; }
  .order-meal-row { display: flex; align-items: center; gap: 6px;
                    padding: 6px 0 2px; border-top: 1px dashed #fde68a;
                    margin-top: 4px; font-size: 11px; }
  .order-meal-label { font-size: 10px; font-weight: 800; color: #b45309;
                      letter-spacing: .05em; text-transform: uppercase; flex-shrink: 0; }
  .order-meal-detail { color: #6b7280; font-weight: 600;
                       font-variant-numeric: tabular-nums;
                       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-meal-total { margin-left: auto; font-size: 11.5px; font-weight: 800;
                      color: #fff; background: linear-gradient(135deg, #fbbf24, #f59e0b);
                      padding: 1.5px 8px; border-radius: 4px;
                      font-variant-numeric: tabular-nums;
                      white-space: nowrap; flex-shrink: 0; }
  .order-meal-total.zero { background: #f0f3fa; color: #b8bfcd; }

  /* 成本汇总卡 */
  .order-cost-row {
    margin-top: 6px;
    padding: 8px 10px;
    background: linear-gradient(135deg, #f8faff, #f0f6ff);
    border: 1.5px solid #dde8ff;
    border-radius: 10px;
  }
  .oc-stats {
    display: flex; flex-wrap: wrap; gap: 8px 12px;
    margin-bottom: 8px;
  }
  .oc-stat { display: flex; flex-direction: column; gap: 1px; min-width: 46px; }
  .oc-lbl { font-size: 9.5px; font-weight: 800; color: #8b93a7;
            letter-spacing: .04em; text-transform: uppercase; }
  .oc-val { font-size: 13px; font-weight: 800; color: #1a1f36;
            font-variant-numeric: tabular-nums; }
  .oc-val.green { color: #0a8f66; }
  .oc-val.orange { color: #d97706; }
  .oc-val.purple { color: #7743e0; }
  .oc-val.zero { color: #b8bfcd; }
  .oc-total-line {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 7px; border-top: 1px dashed #c9b3f5;
  }
  .oc-total-label { font-size: 11px; font-weight: 800; color: #7743e0;
                    letter-spacing: .04em; }
  .oc-total-val {
    font-size: 15px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #7743e0);
    padding: 3px 11px; border-radius: 5px;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 6px rgba(119,67,224,.28);
  }
  .oc-total-val.zero { background: #f0f3fa; color: #b8bfcd; box-shadow: none; }

  /* ============ 主区 ============ */
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 7px; }
  .top-row { display: flex; align-items: center; gap: 8px; padding: 0 2px;
             flex-shrink: 0; min-height: 30px; flex-wrap: wrap; }
  .day-title { font-size: 16px; font-weight: 800; display: flex; align-items: center;
               gap: 7px; flex-shrink: 0; }
  .day-title small { font-size: 11.5px; font-weight: 600; color: #8b93a7; }
  .today-pill { font-size: 9.5px; font-weight: 800; padding: 2px 7px;
                border-radius: 999px; background: linear-gradient(135deg, #ff9d5c, #ff7a2f);
                color: #fff; box-shadow: 0 3px 8px rgba(255,122,47,.28); }
  .mobile-menu-btn { display: none; }
  .sidebar-mask { display: none; }
  .sync-status { font-size: 10.5px; font-weight: 700; padding: 3px 9px;
                 border-radius: 999px; background: #f0fdf8; color: #0a8f66;
                 border: 1px solid #c9eddc; display: inline-flex; align-items: center; gap: 4px; }
  .sync-status.err { background: #fff5f6; color: #e8455a; border-color: #ffd7db; }
  .sync-status .dot { width: 6px; height: 6px; border-radius: 50%;
                      background: currentColor; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .btn-ghost { height: 28px; padding: 0 11px; border-radius: 8px;
               border: 1.5px solid #e9edf5; background: #fff; color: #4a5368;
               font-size: 12px; font-weight: 700; display: inline-flex;
               align-items: center; gap: 4px; }
  .btn-ghost:hover { background: #f2f5ff; border-color: #cfdaff; color: #4f7cff; }
  .btn-ghost svg { width: 13px; height: 13px; }
  .top-search { margin-left: auto; position: relative; width: 240px; max-width: 40vw; }
  .top-search input { width: 100%; padding: 6px 30px 6px 32px;
                      border: 1.5px solid #e9edf5; border-radius: 9px;
                      font-size: 12px; background: #fff; outline: none; }
  .top-search input:focus { border-color: #4f7cff;
                            box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .top-search .ico { position: absolute; left: 10px; top: 50%;
                     transform: translateY(-50%); width: 13px; height: 13px;
                     color: #b8bfcd; pointer-events: none; }
  .top-search .clr { position: absolute; right: 5px; top: 50%;
                     transform: translateY(-50%); width: 18px; height: 18px;
                     border-radius: 5px; color: #b8bfcd; font-size: 13px;
                     line-height: 1; display: none; place-items: center; }
  .top-search .clr.show { display: grid; }
  .day-nav { display: flex; gap: 3px; }

  .pending-banner { background: linear-gradient(135deg, #fff9ec, #fff5d6);
                    border: 1.5px solid #ffd98a; border-radius: 12px;
                    padding: 8px 12px; flex-shrink: 0;
                    height: var(--pending-h, 176px);
                    min-height: 60px;
                    overflow: hidden; display: flex; flex-direction: column; }
  .pending-banner.hide { display: none; }
  .pending-title { font-size: 11px; font-weight: 800; color: #b45309;
                   letter-spacing: .05em; text-transform: uppercase;
                   margin-bottom: 6px; display: flex; align-items: center; gap: 7px;
                   flex-shrink: 0; }
  .pending-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b;
                        box-shadow: 0 0 0 3px rgba(245,158,11,.2); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.2);}
                     50%{box-shadow:0 0 0 5px rgba(245,158,11,.12);} }
  .pending-count { font-size: 10.5px; background: #f59e0b; color: #fff;
                   padding: 1px 7px; border-radius: 999px; font-weight: 800; }
  .pending-hint { font-size: 10.5px; color: #c5862c; font-weight: 500; margin-left: auto; }
  .pending-list { display: flex; flex-direction: column; gap: 4px;
                  overflow-y: auto; padding-right: 3px; min-height: 0; }
  .pending-item { display: flex; width: 100%; box-sizing: border-box;
                  align-items: center; gap: 6px; background: #fff;
                  border: 1px solid #ffe4a8; border-radius: 8px; padding: 4px 10px;
                  font-size: 12px; cursor: pointer; flex-shrink: 0; }
  .pending-item.staff { border-left: 3px solid #4f7cff; }
  .pending-item.guest { border-left: 3px solid #ec6ba0; }
  .pending-item.event { border-left: 3px solid #8b5cf6; }
  .pending-item.today { background: #fffdf5; }
  .pending-item .date { font-size: 10.5px; font-weight: 800; color: #b45309;
                        background: #ffedc9; padding: 1.5px 7px; border-radius: 5px;
                        flex-shrink: 0; white-space: nowrap; }
  .pending-item.today .date { background: linear-gradient(135deg, #ff9d5c, #ff7a2f); color: #fff; }
  .pending-item .time { font-size: 10.5px; font-weight: 800; color: #b45309;
                        background: #fff5d6; padding: 1.5px 6px; border-radius: 4px;
                        flex-shrink: 0; white-space: nowrap; }

    const el = document.activeElement;
    if (!el || el.tagName !== 'INPUT') return;
    if (el.type !== 'text' && el.type !== 'number') return;
    if (el.id === 'aOrder' && $('aOrderAC').classList.contains('show')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      const atEnd = el.selectionStart === el.value.length && el.selectionEnd === el.value.length;
      if (atEnd || el.value.length === 0) { e.preventDefault(); focusFieldByOffset(el, +1); }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      const atStart = el.selectionStart === 0 && el.selectionEnd === 0;
      if (atStart || el.value.length === 0) { e.preventDefault(); focusFieldByOffset(el, -1); }
    }
  });
}

function makeEditable(el, getVal, setVal, opts = {}) {

/* ============================================================
 *  兼职费计算（排除赵纯萍）
 * ============================================================ */
const PT_LIMIT_H = 10, PT_RATE_1 = 15, PT_RATE_2 = 20;
const PT_SPECIAL_NAME = '赵纯萍';

function ptCalcHours(s, e) {
  if (!s || !e || s === e) return 0;
  const [sh, sm] = s.split(':').map(Number);
  const [eh, em] = e.split(':').map(Number);
  let start = sh + sm/60, end = eh + em/60;
  if (end <= start) end += 24;
  return Math.max(0, end - start);
}
function ptNormalWage(record) {
  const h = ptCalcHours(record.start_time, record.end_time);
  if (h <= 0) return 0;
  const regular = Math.min(h, PT_LIMIT_H);
  const overtime = h - regular;
  return regular * PT_RATE_1 + overtime * PT_RATE_2;
}
function calcParttimeForDate(date) {
  let total = 0;
  state.parttimeRecords
    .filter(r => r.date === date && String(r.name || '').trim() !== PT_SPECIAL_NAME)
    .forEach(r => { total += ptNormalWage(r); });
  return Math.round(total * 100) / 100;
}
