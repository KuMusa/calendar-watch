<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>我的日程表</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 12.5px; line-height: 1.35; color: #1a1f36;
    background: radial-gradient(900px 500px at 4% -6%, #e4ecff 0%, transparent 55%),
                radial-gradient(800px 400px at 98% -2%, #ffe8f1 0%, transparent 52%), #eef2f9;
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font-family: inherit; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  .app { display: flex; height: 100vh; height: 100dvh; padding: 8px; gap: 8px; overflow: hidden; }

  /* ============ 侧栏 ============ */
  .sidebar { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
             min-height: 0; overflow-y: auto; overflow-x: hidden; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #dde3ef; border-radius: 3px; }
  .side-toggle { display: flex; gap: 3px; padding: 3px; background: #fff; border-radius: 10px;
                 box-shadow: 0 2px 10px rgba(26,31,54,.06); flex-shrink: 0; }
  .seg-btn { flex: 1; height: 30px; border-radius: 7px; font-size: 12px; font-weight: 700;
             color: #8b93a7; transition: .15s; display: inline-flex; align-items: center;
             justify-content: center; gap: 4px; }
  .seg-btn:hover { background: #f5f8ff; color: #4f7cff; }
  .seg-btn.active { background: linear-gradient(140deg, #5b86ff, #3b66e6); color: #fff;
                    box-shadow: 0 3px 8px rgba(79,124,255,.28); }
  #sideCalendar, #sideOrders { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
  #sideOrders { display: none; }
  .card { background: #fff; border-radius: 12px; padding: 10px;
          box-shadow: 0 2px 10px rgba(26,31,54,.06); flex-shrink: 0; }
  .cal-head { display: flex; align-items: center; margin-bottom: 8px; }
  .cal-month { font-size: 14px; font-weight: 800; }
  .cal-nav { margin-left: auto; display: flex; gap: 3px; }
  .nav-btn { height: 24px; min-width: 24px; padding: 0 6px; border-radius: 6px;
             border: 1px solid #e9edf5; background: #fff; color: #4a5368;
             font-size: 12px; font-weight: 700; display: grid; place-items: center; transition: .15s; }
  .nav-btn:hover { background: #eef3ff; border-color: #c8d8ff; color: #4f7cff; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 2px; }
  .cal-week span { text-align: center; font-size: 9.5px; font-weight: 700; color: #b8bfcd; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-day { aspect-ratio: 1; border-radius: 7px; border: 2px solid transparent;
             background: #f8fafd; display: grid; place-items: center;
             font-size: 11.5px; font-weight: 600; color: #1a1f36; cursor: pointer;
             transition: .14s; position: relative; user-select: none; }
  .cal-day:hover { background: #eef3ff; }
  .cal-day.out { color: #cdd4e2; background: transparent; }
  .cal-day.today { color: #ff7a2f; font-weight: 800; }
  .cal-day.today::after { content: ''; position: absolute; bottom: 2px; left: 50%;
                          transform: translateX(-50%); width: 3px; height: 3px;
                          border-radius: 50%; background: #ff8c42; }
  .cal-day.marked { border-color: #ff5a5f; color: #ff3b41; background: #fff5f5; font-weight: 800; }
  .cal-day.sel { background: linear-gradient(140deg, #5b86ff, #3b66e6); color: #fff;
                 box-shadow: 0 4px 12px rgba(79,124,255,.32); }
  .cal-day.sel.today { color: #fff; }
  .cal-day.sel.today::after { background: #fff; }
  .cal-day.has-pending { box-shadow: inset 0 -3px 0 #f59e0b; }
  .cal-day.sel.has-pending { box-shadow: inset 0 -3px 0 #f59e0b, 0 4px 12px rgba(79,124,255,.32); }

  .card-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .card-title { font-size: 10.5px; font-weight: 800; color: #8b93a7;
                letter-spacing: .08em; text-transform: uppercase; }
  .mini-add { margin-left: auto; width: 18px; height: 18px; border-radius: 5px;
              border: 1px solid #e9edf5; background: #fff; color: #4f7cff;
              font-size: 13px; line-height: 1; display: grid; place-items: center; }
  .notes-list { display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; }
  .note-row { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 6px;
              padding: 5px 6px; margin: 0 -6px; border-radius: 7px; font-size: 12px; align-items: start; }
  .note-row:hover { background: #fff5f5; }
  .note-date { font-size: 10px; font-weight: 800; color: #ff3b41; background: #fff0f0;
               padding: 2px 5px; border-radius: 4px; outline: none; cursor: text;
               text-align: center; white-space: nowrap; align-self: start; margin-top: 1px; }
  .note-text { color: #1a1f36; font-weight: 500; outline: none; border-radius: 5px;
               padding: 1px 3px; margin: 0 -3px; cursor: text; white-space: pre-wrap;
               word-break: break-word; line-height: 1.5; min-height: 16px; }
  .note-text:empty::before { content: attr(data-ph); color: #b8bfcd; font-weight: 400; }
  .note-text.editing { background: #fff; box-shadow: 0 0 0 2px #ff5a5f; }
  .note-text.editing textarea { width: 100%; border: none; outline: none;
    background: transparent; font: inherit; color: inherit; resize: vertical;
    padding: 0; margin: 0; line-height: 1.5; min-height: 40px; }
  .note-del { width: 16px; height: 16px; border-radius: 4px; color: #cdd4e2;
              font-size: 13px; display: grid; place-items: center; flex-shrink: 0;
              opacity: 0; transition: .14s; align-self: start; margin-top: 1px; }
  .note-row:hover .note-del { opacity: 1; }
  .empty-hint { font-size: 11px; color: #b8bfcd; text-align: center; padding: 6px 4px; }

  /* 订单 */
  .order-list { display: flex; flex-direction: column; gap: 5px; }
  .order-item { border: 1px solid #eef2f9; border-radius: 8px; background: #fbfcfe;
                overflow: hidden; }
  .order-item.open { background: #fff; border-color: #c8d8ff;
                     box-shadow: 0 3px 10px rgba(79,124,255,.1); }
  .order-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; }
  .order-arrow { font-size: 9px; color: #b8bfcd; width: 10px; text-align: center;
                 transition: transform .16s; }
  .order-item.open .order-arrow { transform: rotate(90deg); color: #4f7cff; }
  .order-name { font-size: 12px; font-weight: 800; color: #0a8f66; flex: 1;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-time { font-size: 11.5px; font-weight: 800; color: #0a8f66;
                background: #e8f9f1; padding: 2px 8px; border-radius: 5px;
                font-variant-numeric: tabular-nums; }
  .order-detail { display: none; flex-direction: column; padding: 0 10px 8px; }
  .order-item.open .order-detail { display: flex; }
  .order-day { display: flex; align-items: center; gap: 6px; font-size: 11px;
               padding: 4px 0; border-top: 1px dashed #eef2f9; }
  .order-day-date { font-weight: 800; color: #4a5368; min-width: 40px; }
  .order-day-segs { flex: 1; color: #8b93a7; font-weight: 600;
                    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-day-total { font-weight: 800; color: #0a8f66; }

  /* ============ 主区 ============ */
  .main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 7px; }
  .top-row { display: flex; align-items: center; gap: 8px; padding: 0 2px;
             flex-shrink: 0; min-height: 30px; flex-wrap: wrap; }
  .day-title { font-size: 16px; font-weight: 800; display: flex; align-items: center;
               gap: 7px; flex-shrink: 0; }
  .day-title small { font-size: 11.5px; font-weight: 600; color: #8b93a7; }
  .today-pill { font-size: 9.5px; font-weight: 800; padding: 2px 7px;
                border-radius: 999px; background: linear-gradient(135deg, #ff9d5c, #ff7a2f);
                color: #fff; box-shadow: 0 3px 8px rgba(255,122,47,.28); }
  .mobile-menu-btn { display: none; }
  .sidebar-mask { display: none; }
  .sync-status { font-size: 10.5px; font-weight: 700; padding: 3px 9px;
                 border-radius: 999px; background: #f0fdf8; color: #0a8f66;
                 border: 1px solid #c9eddc; display: inline-flex; align-items: center; gap: 4px; }
  .sync-status.err { background: #fff5f6; color: #e8455a; border-color: #ffd7db; }
  .sync-status .dot { width: 6px; height: 6px; border-radius: 50%;
                      background: currentColor; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .btn-ghost { height: 28px; padding: 0 11px; border-radius: 8px;
               border: 1.5px solid #e9edf5; background: #fff; color: #4a5368;
               font-size: 12px; font-weight: 700; display: inline-flex;
               align-items: center; gap: 4px; }
  .btn-ghost:hover { background: #f2f5ff; border-color: #cfdaff; color: #4f7cff; }
  .btn-ghost svg { width: 13px; height: 13px; }
  .top-search { margin-left: auto; position: relative; width: 240px; max-width: 40vw; }
  .top-search input { width: 100%; padding: 6px 30px 6px 32px;
                      border: 1.5px solid #e9edf5; border-radius: 9px;
                      font-size: 12px; background: #fff; outline: none; }
  .top-search input:focus { border-color: #4f7cff;
                            box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .top-search .ico { position: absolute; left: 10px; top: 50%;
                     transform: translateY(-50%); width: 13px; height: 13px;
                     color: #b8bfcd; pointer-events: none; }
  .top-search .clr { position: absolute; right: 5px; top: 50%;
                     transform: translateY(-50%); width: 18px; height: 18px;
                     border-radius: 5px; color: #b8bfcd; font-size: 13px;
                     line-height: 1; display: none; place-items: center; }
  .top-search .clr.show { display: grid; }
  .day-nav { display: flex; gap: 3px; }

  /* 未完成横幅 */
  .pending-banner { background: linear-gradient(135deg, #fff9ec, #fff5d6);
                    border: 1.5px solid #ffd98a; border-radius: 12px;
                    padding: 8px 12px; flex-shrink: 0; max-height: 176px;
                    overflow: hidden; display: flex; flex-direction: column; }
  .pending-banner.hide { display: none; }
  .pending-title { font-size: 11px; font-weight: 800; color: #b45309;
                   letter-spacing: .05em; text-transform: uppercase;
                   margin-bottom: 6px; display: flex; align-items: center; gap: 7px; }
  .pending-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b;
                        box-shadow: 0 0 0 3px rgba(245,158,11,.2); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.2);}
                     50%{box-shadow:0 0 0 5px rgba(245,158,11,.12);} }
  .pending-count { font-size: 10.5px; background: #f59e0b; color: #fff;
                   padding: 1px 7px; border-radius: 999px; font-weight: 800; }
  .pending-hint { font-size: 10.5px; color: #c5862c; font-weight: 500; margin-left: auto; }
  .pending-list { display: flex; flex-direction: column; gap: 4px;
                  overflow-y: auto; padding-right: 3px; }
  .pending-item { display: inline-flex; align-items: center; gap: 6px; background: #fff;
                  border: 1px solid #ffe4a8; border-radius: 8px; padding: 4px 10px;
                  font-size: 12px; cursor: pointer; max-width: 100%; }
  .pending-item.staff { border-left: 3px solid #4f7cff; }
  .pending-item.guest { border-left: 3px solid #ec6ba0; }
  .pending-item.event { border-left: 3px solid #8b5cf6; }
  .pending-item.today { background: #fffdf5; }
  .pending-item .date { font-size: 10.5px; font-weight: 800; color: #b45309;
                        background: #ffedc9; padding: 1.5px 7px; border-radius: 5px; }
  .pending-item.today .date { background: linear-gradient(135deg, #ff9d5c, #ff7a2f); color: #fff; }
  .pending-item .time { font-size: 10.5px; font-weight: 800; color: #b45309;
                        background: #fff5d6; padding: 1.5px 6px; border-radius: 4px; }
  .pending-item .name { font-weight: 800; color: #1a1f36;
                        overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
  .pending-item .task { font-size: 11.5px; color: #6b7280; font-weight: 500;
                        overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .pending-item .kind-badge { font-size: 9.5px; font-weight: 800;
                              padding: 1px 6px; border-radius: 4px; }
  .pending-item.staff .kind-badge { color: #3b5bbf; background: #eef3ff; }
  .pending-item.guest .kind-badge { color: #d1548a; background: #fff2f7; }
  .pending-item.event .kind-badge { color: #7743e0; background: #f6f3ff; }

  /* 通用 box */
  .box { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(26,31,54,.06);
         display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .box-head { display: flex; align-items: center; gap: 7px; padding: 5px 10px;
              border-bottom: 1px solid #f1f4fa; flex-shrink: 0; min-height: 28px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
           font-weight: 800; padding: 2px 9px; border-radius: 999px; }
  .badge-plan { color: #3b5bbf; background: #f5f8ff; border: 1.5px dashed #b3c5f7; }
  .badge-plan.event { color: #7743e0; background: #f8f5ff; border-color: #c9b3f5; }
  .badge-actual { color: #fff; background: linear-gradient(135deg, #16c58c, #0a8f66);
                  border: 1.5px solid #0a8f66; box-shadow: 0 3px 8px rgba(16,185,129,.24); }
  .badge-search { color: #4f7cff; background: #eef3ff; border: 1.5px solid #c8d8ff; }
  .head-info { font-size: 11px; font-weight: 600; color: #4a5368;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-info b { color: #0a8f66; font-weight: 800; }
  .head-total { margin-left: auto; font-size: 12.5px; font-weight: 800;
                color: #0a8f66; white-space: nowrap; }

  /* 快速添加行 */
  .quick-row { display: flex; align-items: center; gap: 4px; padding: 5px 9px;
               background: #fafbfe; border-bottom: 1px solid #f1f4fa;
               flex-shrink: 0; flex-wrap: wrap; }
  .qi { border: 1.5px solid #e9edf5; border-radius: 6px; padding: 4px 7px;
        font-size: 11.5px; color: #1a1f36; background: #fff; outline: none;
        min-width: 0; font-weight: 500; }
  .qi:focus { border-color: #4f7cff; box-shadow: 0 0 0 3px rgba(79,124,255,.1); }
  .qi::placeholder { color: #b8bfcd; font-weight: 400; }
  .qi-name { width: 62px; }
  .qi-note { flex: 1; min-width: 50px; }
  .qi-order { width: 62px; }
  .qi-time { width: 72px; text-align: center; letter-spacing: .5px;
             font-variant-numeric: tabular-nums; font-weight: 600; }
  .qi-people { width: 38px; text-align: center; }
  .qi-num { width: 42px; text-align: center; }
  .quick-row.people-quick .qi-name { flex: 1.4; width: auto; min-width: 120px; }
  .quick-row.people-quick .qi-note { flex: 1; min-width: 80px; }
  .quick-row.other-quick .qi-name { flex: 1.6; width: auto; min-width: 70px; }
  .quick-row.other-quick .qi-note { flex: 0.55; min-width: 42px; }
  .quick-row.actual .ac-wrap { flex: 1.2; min-width: 110px; display: flex; position: relative; }
  .ac-wrap .qi-order { flex: 1; width: 100%; }
  .qi-sep { color: #b8bfcd; font-size: 10.5px; font-weight: 700; }
  .or-sep { color: #4f7cff; font-size: 10.5px; font-weight: 800; padding: 0 3px;
            background: #eef3ff; border-radius: 4px; }
  .qi-preview { display: inline-flex; align-items: center; gap: 4px;
                font-size: 11.5px; font-weight: 800; color: #0a8f66;
                background: #f0fdf8; padding: 4px 10px; border-radius: 6px;
                border: 1.5px solid #c9eddc; min-width: 82px; justify-content: center; }
  .qi-preview .label { font-size: 10px; color: #5ec49b; font-weight: 700; }
  .qi-preview.zero { color: #b8bfcd; border-color: #e9edf5; background: #fafbfe; }
  .qi-preview.zero .val { color: #b8bfcd; }
  .qi-add { height: 26px; padding: 0 11px; border-radius: 6px;
            background: linear-gradient(140deg, #5b86ff, #3b66e6); color: #fff;
            font-size: 11px; font-weight: 700; box-shadow: 0 3px 8px rgba(79,124,255,.26); }
  .quick-row.actual .qi-add { background: linear-gradient(140deg, #16c58c, #0a8f66);
                              box-shadow: 0 3px 8px rgba(16,185,129,.26); }

  .box-body { flex: 1; min-height: 0; overflow-y: auto; padding: 3px 5px 6px; }
  .plan-area { flex: 0.9; min-height: 0; display: grid;
               grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 7px; }

  /* 计划行 */
  .p-header { display: grid; grid-template-columns: 16px minmax(0,1fr) 108px 130px 16px;
              gap: 12px; align-items: center; padding: 5px 12px; background: #f6f8fd;
              border-bottom: 1px solid #eef2f9; font-size: 10.5px; font-weight: 800;
              color: #4a5368; flex-shrink: 0; }
  .p-header.other { grid-template-columns: 16px 110px 108px minmax(0,1fr) 16px; }
  .p-header span:last-child { text-align: center; color: #8b93a7; }
  .p-row { position: relative; display: grid;
           grid-template-columns: 16px minmax(0,1fr) 108px 130px 16px;
           gap: 12px; align-items: center; padding: 5px 12px;
           border-radius: 7px; font-size: 12px; }
  .p-row.other { grid-template-columns: 16px 110px 108px minmax(0,1fr) 16px; }
  .p-row:hover { background: #f8fafd; }
  .p-row.highlight { background: #fff5d6; animation: flash 1.2s ease; }
  @keyframes flash { 0%{background:#ffeaa8;} 100%{background:#fff5d6;} }
  .p-name { font-weight: 800; color: #1a1f36; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap; outline: none;
            border-radius: 4px; padding: 1px 3px; margin: 0 -3px;
            cursor: text; font-size: 12.5px; }
  .p-name:empty::before { content: attr(data-ph); color: #b8bfcd; }
  .p-name.editing { background: #fff; box-shadow: 0 0 0 2px #4f7cff; }
  .p-time-group { display: inline-flex; align-items: center; gap: 2px;
                  background: #eef3ff; padding: 2.5px 7px; border-radius: 6px;
                  justify-self: start; }
  .p-time { font-size: 11px; font-weight: 800; color: #3b5bbf; padding: 0 2px;
            outline: none; min-width: 34px; text-align: center; cursor: text;
            font-variant-numeric: tabular-nums; }
  .p-time:empty::before { content: attr(data-ph); color: #a8b8e0; }
  .p-time.editing { background: #fff; box-shadow: 0 0 0 2px #4f7cff; }
  .p-time-sep { font-size: 10px; color: #6b8cd6; font-weight: 800; }
  .p-note { font-size: 12px; color: #1a1f36; font-weight: 700;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            outline: none; border-radius: 4px; padding: 1px 3px; margin: 0 -3px;
            cursor: text; }
  .p-note:empty::before { content: attr(data-ph); color: #b8bfcd; }
  .p-note.editing { background: #fff; box-shadow: 0 0 0 2px #4f7cff;
                    white-space: normal; overflow: visible; }
  .p-row.done .p-name, .p-row.done .p-note,
  .p-row.cancelled .p-name, .p-row.cancelled .p-note {
    color: #b8bfcd; text-decoration: line-through;
  }
  .p-row.done .p-time-group, .p-row.cancelled .p-time-group { opacity: .5; }
  .p-row.done .p-time, .p-row.cancelled .p-time { text-decoration: line-through; }
  .p-check { width: 16px; height: 16px; border-radius: 4px;
             border: 2px solid #cfd6e6; background: #fff;
             display: grid; place-items: center; justify-self: center; padding: 0; }
  .p-check:hover { border-color: #4f7cff; transform: scale(1.08); }
  .p-check.on::after { content: ''; width: 3.5px; height: 7px;
                       border: solid #fff; border-width: 0 2px 2px 0;
                       transform: rotate(45deg) translate(-1px, -2px); }
  .p-check-cancel.on { background: linear-gradient(140deg, #ff9a9e, #e8455a);
                       border-color: #e8455a; box-shadow: 0 2px 6px rgba(232,69,90,.32); }
  .p-check-done.on { background: linear-gradient(140deg, #16c58c, #0a8f66);
                     border-color: #0a8f66; box-shadow: 0 2px 6px rgba(16,185,129,.32); }
  .p-del { position: absolute; right: 34px; top: 50%; transform: translateY(-50%);
           width: 16px; height: 16px; border-radius: 4px; color: #cdd4e2;
           font-size: 13px; display: grid; place-items: center;
           opacity: 0; background: #fff; padding: 0; }

/* ============================================================
 *  Supabase 配置
 *
 *  ⚠️ 首次使用请在 Supabase SQL Editor 中执行：
 *
 *  ALTER TABLE schedule_items
 *    ADD COLUMN IF NOT EXISTS cancelled boolean DEFAULT false;

 *    people integer DEFAULT 0
 *  );
 *  ALTER TABLE schedule_fees ADD COLUMN IF NOT EXISTS lunch numeric DEFAULT 0;
 *  ALTER TABLE schedule_fees ADD COLUMN IF NOT EXISTS dinner numeric DEFAULT 0;
 *  ALTER TABLE schedule_fees ADD COLUMN IF NOT EXISTS people integer DEFAULT 0;
 * ============================================================ */
const SUPABASE_URL = 'https://evwiybzodraxzxrjosrs.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OWCPSt65AWrsBXtTBhi1Zg_5oX1zeM6';
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const STORE_KEY = 'schedule-cloud-v1';
const MOBILE_BREAK = 768;

const state = {
  items: [],
  notes: [],
  manualTotals: {},
  manualFees: {},
  dayMeta: {},
  view: { y: 0, m: 0 },
  selected: '',
  keyword: '',
  sideTab: 'calendar',
};

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayKey = () => dk(new Date());
const isMobile = () => window.matchMedia(`(max-width: ${MOBILE_BREAK}px)`).matches;
const timeToMin = t => { if (!t) return 0; const [h,m] = t.split(':').map(Number); return h*60+m; };

function fmtDuration(min) {
  if (!min || min <= 0) return '—';
  const h = Math.floor(min/60), m = min%60;
  if (h && m) return h + 'h' + m + 'm';
  if (h) return h + 'h';
  return m + 'm';
}
function durationMin(start, end) {
  if (!start || !end) return 0;
  const s = timeToMin(start), e = timeToMin(end);
  return e > s ? e - s : 0;
}
function parseDurationInput(s) {
  if (s === null || s === undefined) return null;
  const t = String(s).trim().toLowerCase();
  if (!t) return 0;
  if (/^\d+$/.test(t)) return Math.max(0, parseInt(t, 10));
  const hm = t.match(/^(?:(\d+)\s*h)?\s*(?:(\d+)\s*m)?$/);
  if (hm && (hm[1] || hm[2])) return (parseInt(hm[1]||0,10)*60) + parseInt(hm[2]||0,10);
  const colon = t.match(/^(\d+)\s*[:：]\s*(\d+)$/);
  if (colon) return parseInt(colon[1],10)*60 + parseInt(colon[2],10);
  const dec = t.match(/^(\d+(?:\.\d+)?)\s*(?:h|小时|时)$/);
  if (dec) return Math.round(parseFloat(dec[1])*60);
  return null;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function totalKey(date, order) { return `${date}|${order || ''}`; }

/* ------- 时间工具 ------- */
function isValidHourMin(h, min) { if (h === 24) return min === 0; return h>=0 && h<24 && min>=0 && min<60; }
function isCompleteTime(str) {
  if (!str) return false;
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2}):(\d{2})$/);
  if (m) return isValidHourMin(+m[1], +m[2]);
  if (/^\d{4}$/.test(s)) return isValidHourMin(+s.slice(0,2), +s.slice(2));
  return false;
}
function normalizeTime(str) {
  if (!str) return '';
  const s = String(str).trim();
  let m = s.match(/^(\d{1,2}):(\d{1,2})$/);
  if (m) {
    const h = +m[1], min = +m[2];
    if (!isValidHourMin(h, min)) return '';
    if (h === 24) return '24:00';
    return String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
  }
  if (/^\d{4}$/.test(s)) {
    const h = +s.slice(0,2), min = +s.slice(2);
    if (!isValidHourMin(h, min)) return '';
    if (h === 24) return '24:00';
    return String(h).padStart(2,'0') + ':' + String(min).padStart(2,'0');
  }
  return '';
}
function tryFormatTimeField(input) {
  const v = input.value;
  if (!v) return false;
  if (v.includes(':')) {
    const m = v.match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return false;
    const h = +m[1], min = +m[2];
    if (!isValidHourMin(h, min)) return false;
    const nv = (h === 24) ? '24:00' : String(h).padStart(2,'0')+':'+String(min).padStart(2,'0');
    if (nv !== v) { input.value = nv; try { input.setSelectionRange(5,5); } catch(e){} return true; }
    return false;
  }
  if (/^\d{4}$/.test(v)) {
    const h = +v.slice(0,2), min = +v.slice(2);
    if (!isValidHourMin(h, min)) return false;
    const nv = (h === 24) ? '24:00' : v.slice(0,2) + ':' + v.slice(2);
    input.value = nv;
    try { input.setSelectionRange(5,5); } catch(e){}
    return true;
  }
  return false;
}
function filterTimeInput(input) {
  const oldVal = input.value;
  let v = oldVal.replace(/[^\d:]/g, '');
  let cursorPos = 0;
  try { cursorPos = input.selectionStart || 0; } catch(e){}
  if (v.includes(':')) {
    const parts = v.split(':');
    if (parts.length > 2) v = parts[0] + ':' + parts.slice(1).join('');
    if (v.length > 5) v = v.slice(0,5);
    if (v !== oldVal) {
      input.value = v;
      const diff = oldVal.length - v.length;
      const np = Math.max(0, cursorPos - diff);
      try { input.setSelectionRange(np, np); } catch(e){}
    }
    return;
  }
  if (!/^\d*$/.test(v)) { input.value = ''; return; }
  if (v.length > 4) v = v.slice(0,4);
  if (v.length === 4) {
    const h = +v.slice(0,2), min = +v.slice(2);
    if (isValidHourMin(h, min)) {
      const nv = (h === 24) ? '24:00' : v.slice(0,2)+':'+v.slice(2);
      input.value = nv;
      try { input.setSelectionRange(5,5); } catch(e){}
      return;
    }
  }
  if (v !== oldVal) input.value = v;
}
function setupTimeField(input) {
  if (!input || input._timeFieldBound) return;
  input._timeFieldBound = true;
  input.addEventListener('input', () => { filterTimeInput(input); tryFormatTimeField(input); });
  input.addEventListener('blur', () => {
    const v = normalizeTime(input.value);
    if (v && v !== input.value) { input.value = v; input.dispatchEvent(new Event('input', { bubbles: true })); }
  });
}
function attachAutoJump(startRef, endRef) {
  const startEl = (typeof startRef === 'string') ? $(startRef) : startRef;
  const endEl = (typeof endRef === 'string') ? $(endRef) : endRef;
  if (!startEl || !endEl) return;
  setupTimeField(startEl);
  setupTimeField(endEl);
  let t = null;
  const jump = () => {
    if (t) clearTimeout(t);
    if (document.activeElement !== startEl) return;
    if (!isCompleteTime(startEl.value)) return;
    t = setTimeout(() => {
      t = null;
      if (document.activeElement === startEl) {
        const v = normalizeTime(startEl.value);
        if (v) startEl.value = v;
        endEl.focus();
        try { if (endEl.select) endEl.select(); } catch(e){}
      }
    }, 500);
  };
  startEl.addEventListener('input', jump);
  startEl.addEventListener('change', jump);
}

/* ------- 方向键 ------- */
function getSiblingFields(el) {
  const c = el.closest('.quick-row, .a-add-form, .a-card, .sidebar, .box');
  if (!c) return [];
  return Array.from(c.querySelectorAll('input')).filter(x =>
    x.offsetParent !== null && x.type !== 'hidden' && x.type !== 'file');
}
function focusFieldByOffset(el, offset) {
  const fields = getSiblingFields(el);
  const idx = fields.indexOf(el);
  if (idx < 0) return;
  const next = fields[idx + offset];
  if (next) { next.focus(); try { next.select(); } catch(e){} }
}
function bindArrowNav() {
  document.addEventListener('keydown', e => {
    const el = document.activeElement;
    if (!el || el.tagName !== 'INPUT') return;
    if (el.type !== 'text' && el.type !== 'number') return;
    if (el.id === 'aOrder' && $('aOrderAC').classList.contains('show')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
      const atEnd = el.selectionStart === el.value.length && el.selectionEnd === el.value.length;
      if (atEnd || el.value.length === 0) { e.preventDefault(); focusFieldByOffset(el, +1); }
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      const atStart = el.selectionStart === 0 && el.selectionEnd === 0;
      if (atStart || el.value.length === 0) { e.preventDefault(); focusFieldByOffset(el, -1); }
    }
  });
}

/* ------- 原地编辑 ------- */
function makeEditable(el, getVal, setVal, opts = {}) {
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (el.querySelector('input, textarea')) return;
    const oldVal = String(getVal() ?? '');
    const input = document.createElement('input');
    input.type = opts.type || 'text';
    if (opts.maxlength) input.maxLength = opts.maxlength;
    input.value = oldVal;
    input.style.cssText = `width:100%;border:none;outline:none;background:#fff;font:inherit;color:inherit;text-align:inherit;padding:0;margin:0;border-radius:inherit;`;
    el.textContent = '';
    el.classList.add('editing');
    el.appendChild(input);
    input.focus();
    if (input.select) input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) { const v = input.value.trim(); setVal(v); save(); if (opts.onCommit) opts.onCommit(v); }
      el.classList.remove('editing');
      el.textContent = String(getVal() ?? '');
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
}
function makeMultiLineEditable(el, getVal, setVal, opts = {}) {
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (el.querySelector('input, textarea')) return;
    const oldVal = String(getVal() ?? '');
    const ta = document.createElement('textarea');
    ta.value = oldVal;
    ta.rows = Math.max(2, (oldVal.split('\n').length + 1));
    if (opts.maxlength) ta.maxLength = opts.maxlength;
    ta.style.cssText = `width:100%;border:none;outline:none;background:transparent;font:inherit;color:inherit;text-align:inherit;padding:0;margin:0;border-radius:inherit;resize:vertical;line-height:1.5;`;
    el.textContent = '';
    el.classList.add('editing');
    el.appendChild(ta);
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) { const v = ta.value.replace(/\s+$/,''); setVal(v); save(); if (opts.onCommit) opts.onCommit(v); }
      el.classList.remove('editing');
      el.textContent = String(getVal() ?? '');
    };
    ta.addEventListener('blur', () => close(true));
    ta.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); ta.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
}
function makeTextTimeEditable(el, getVal, setVal, opts = {}) {
  el.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (el.querySelector('input')) return;
    const oldVal = String(getVal() ?? '');
    const input = document.createElement('input');
    input.type = 'text';
    input.inputMode = 'numeric';
    input.value = oldVal;
    input.placeholder = 'HH:MM';
    input.maxLength = 5;
    input.style.cssText = `width:100%;border:none;outline:none;background:#fff;font:inherit;color:inherit;text-align:center;padding:0;margin:0;border-radius:inherit;letter-spacing:0.5px;font-variant-numeric:tabular-nums;`;
    el.textContent = '';
    el.classList.add('editing');
    el.appendChild(input);
    input.focus();
    input.select();
    let t = null;
    const sched = () => {
      if (t) clearTimeout(t);
      if (!isCompleteTime(input.value)) return;
      t = setTimeout(() => { t = null; if (document.activeElement === input) input.blur(); }, 500);
    };
    input.addEventListener('input', () => { filterTimeInput(input); tryFormatTimeField(input); sched(); });
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (t) { clearTimeout(t); t = null; }
      if (commit) {
        const raw = input.value.trim();
        if (raw === '') { setVal(''); save(); }
        else { const v = normalizeTime(raw); if (v) { setVal(v); save(); } }
      }
      el.classList.remove('editing');
      el.textContent = String(getVal() ?? '');
      if (opts.onEditEnd) opts.onEditEnd(commit);
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
}

/* ------- 同步状态 ------- */
function setSyncStatus(text, isErr) {
  const el = $('syncStatus'), txt = $('syncText');
  if (!el || !txt) return;
  txt.textContent = text;
  el.classList.toggle('err', !!isErr);

/* ============================================================
 *  ★ 安全保存（upsert 模式，失败不清空云端）
 * ============================================================ */
async function save() {
  const snapshot = {
    items: state.items,
    notes: state.notes,
    manualTotals: state.manualTotals,
    manualFees: state.manualFees,
    dayMeta: state.dayMeta,
  };
  localStorage.setItem(STORE_KEY, JSON.stringify(snapshot));

  try {
    setSyncStatus('同步中…', false);

    /* ===== schedule_items ===== */
    if (state.items.length) {
      const rows = state.items.map(it => ({
        id: it.id, date: it.date, status: it.status, kind: it.kind,
        done: !!it.done, cancelled: !!it.cancelled,
        title: it.title || '', sub: it.sub || '',
        start_time: it.start || '', end_time: it.end || '',
        minutes: it.minutes || 0, people: it.people || 1,
      }));
      const { error } = await supa.from('schedule_items').upsert(rows);
      if (error) throw new Error('schedule_items 保存失败：' + error.message);

      const { data: existing } = await supa.from('schedule_items').select('id');
      const newIds = new Set(rows.map(r => r.id));
      const toDelete = (existing || []).filter(x => !newIds.has(x.id)).map(x => x.id);
      if (toDelete.length) {
        await supa.from('schedule_items').delete().in('id', toDelete);
      }
    } else {
      await supa.from('schedule_items').delete().neq('id', '');
    }

    /* ===== schedule_notes ===== */
    if (state.notes.length) {
      const rows = state.notes.map(n => ({ id: n.id, date: n.date, text: n.text || '' }));
      const { error } = await supa.from('schedule_notes').upsert(rows);
      if (error) throw new Error('schedule_notes 保存失败：' + error.message);
      const { data: existing } = await supa.from('schedule_notes').select('id');
      const newIds = new Set(rows.map(r => r.id));
      const toDelete = (existing || []).filter(x => !newIds.has(x.id)).map(x => x.id);
      if (toDelete.length) {
        await supa.from('schedule_notes').delete().in('id', toDelete);
      }
    } else {
      await supa.from('schedule_notes').delete().neq('id', '');
    }

    /* ===== schedule_totals ===== */
    const totalsRows = Object.entries(state.manualTotals).map(([key, minutes]) => {
      const [date, orderKey] = key.split('|');
      return { id: date + '|' + orderKey, date, order_key: orderKey, minutes };
    });
    if (totalsRows.length) {
      const { error } = await supa.from('schedule_totals').upsert(totalsRows);
      if (error) throw new Error('schedule_totals 保存失败：' + error.message);
      const { data: existing } = await supa.from('schedule_totals').select('id');
      const newIds = new Set(totalsRows.map(r => r.id));
      const toDelete = (existing || []).filter(x => !newIds.has(x.id)).map(x => x.id);
      if (toDelete.length) {
        await supa.from('schedule_totals').delete().in('id', toDelete);
      }
    } else {
      await supa.from('schedule_totals').delete().neq('id', '');
    }

    /* ===== schedule_fees ===== */
    try {
      const allDates = new Set([
        ...Object.keys(state.manualFees),
        ...Object.keys(state.dayMeta),
      ]);
      const feeRows = Array.from(allDates).map(date => {
        const meta = state.dayMeta[date] || {};
        return {
          date,
          amount: state.manualFees[date] || 0,
          lunch: meta.lunch || 0,
          dinner: meta.dinner || 0,
          people: meta.people || 0,
        };
      });
      if (feeRows.length) {
        const { error } = await supa.from('schedule_fees').upsert(feeRows);
        if (error) console.warn('费用同步失败（可忽略）', error);
        else {
          const { data: existing } = await supa.from('schedule_fees').select('date');
          const newDates = new Set(feeRows.map(r => r.date));
          const toDelete = (existing || []).filter(x => !newDates.has(x.date)).map(x => x.date);
          if (toDelete.length) {
            await supa.from('schedule_fees').delete().in('date', toDelete);
          }
        }
      }
    } catch (feeErr) { console.warn('费用同步异常', feeErr); }

    setSyncStatus('已同步', false);
  } catch (e) {
    console.warn('保存失败', e);
    setSyncStatus('同步失败: ' + (e.message || e), true);
  }
}

/* ============================================================
 *  加载（云端为空时优先从本地缓存恢复）
 * ============================================================ */
async function load() {
  try {
    setSyncStatus('加载中…', false);
    const { data: items, error: e1 } = await supa.from('schedule_items').select('*');
    const { data: notes, error: e2 } = await supa.from('schedule_notes').select('*');
    const { data: totals, error: e3 } = await supa.from('schedule_totals').select('*');
    if (e1 || e2 || e3) throw (e1 || e2 || e3);

    state.items = (items || []).map(it => ({
      id: it.id, date: it.date, status: it.status, kind: it.kind,
      done: it.done, cancelled: !!it.cancelled,
      title: it.title, sub: it.sub, start: it.start_time, end: it.end_time,
      minutes: it.minutes, people: it.people,
    }));
    state.notes = (notes || []).map(n => ({ id: n.id, date: n.date, text: n.text }));
    state.manualTotals = {};
    (totals || []).forEach(t => { state.manualTotals[t.date + '|' + t.order_key] = t.minutes; });

    state.manualFees = {};
    state.dayMeta = {};
    try {
      const { data: fees, error: e4 } = await supa.from('schedule_fees').select('*');
      if (!e4 && fees) {
        fees.forEach(f => {
          const amt = Number(f.amount);
          if (!isNaN(amt) && amt > 0) state.manualFees[f.date] = amt;
          const meta = {};
          const lunch = Number(f.lunch);
          const dinner = Number(f.dinner);
          const people = Number(f.people);
          if (!isNaN(lunch) && lunch > 0) meta.lunch = lunch;
          if (!isNaN(dinner) && dinner > 0) meta.dinner = dinner;
          if (!isNaN(people) && people > 0) meta.people = Math.round(people);
          if (Object.keys(meta).length) state.dayMeta[f.date] = meta;
        });
      }
    } catch (feeErr) { console.warn('费用加载失败', feeErr); }

    /* ★ 云端为空时，优先从本地缓存恢复，只有本地也没有才用示例数据 */
    if (!state.items.length && !state.notes.length) {
      const raw = localStorage.getItem(STORE_KEY);
      let restored = false;
      if (raw) {
        try {
          const d = JSON.parse(raw);
          if ((d.items && d.items.length) || (d.notes && d.notes.length)) {
            state.items = d.items || [];
            state.notes = d.notes || [];
            state.manualTotals = d.manualTotals || {};
            state.manualFees = d.manualFees || {};
            state.dayMeta = d.dayMeta || {};
            restored = true;
            console.warn('[数据恢复] 云端为空，已从本地缓存恢复', state.items.length, '条记录');
            setSyncStatus('已从本地缓存恢复', false);
            setTimeout(() => save(), 500);
          }
        } catch (err) { console.warn('本地缓存解析失败', err); }
      }
      if (!restored) seed();
    } else {
      setSyncStatus('已同步', false);
    }
  } catch (e) {
    console.warn('加载失败', e);
    setSyncStatus('离线模式', true);
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      try {
        const d = JSON.parse(raw);
        state.items = d.items || [];
        state.notes = d.notes || [];
        state.manualTotals = d.manualTotals || {};
        state.manualFees = d.manualFees || {};
        state.dayMeta = d.dayMeta || {};
      } catch (err) { seed(); }
    } else seed();
  }
}

/* ------- 日历 ------- */
function renderCalendar() {
  const { y, m } = state.view;
  $('calMonth').textContent = `${y}年${m+1}月`;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const today = todayKey();
  const marked = new Set(state.notes.map(n => n.date));
  const pendingDates = new Set();
  state.items.forEach(it => {
    if (it.status === 'plan' && !it.done && !it.cancelled) pendingDates.add(it.date);
  });
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, i - offset + 1);
    const key = dk(d);
    const cls = ['cal-day'];
    if (d.getMonth() !== m) cls.push('out');
    if (key === today) cls.push('today');
    if (key === state.selected) cls.push('sel');
    if (marked.has(key)) cls.push('marked');
    if (pendingDates.has(key)) cls.push('has-pending');
    html += `<div class="${cls.join(' ')}" data-date="${key}">${d.getDate()}</div>`;
  }
  $('calGrid').innerHTML = html;
}
function onCalClick(e) {
  const cell = e.target.closest('.cal-day');
  if (!cell || !cell.dataset.date) return;
  selectDate(cell.dataset.date);
  if (isMobile()) setTimeout(closeSidebar, 150);
}
function onCalDblClick(e) {
  const cell = e.target.closest('.cal-day');
  if (!cell || !cell.dataset.date) return;
  const date = cell.dataset.date;
  const existing = state.notes.filter(n => n.date === date);
  if (existing.length) {
    if (confirm(`取消 ${parseKey(date).getMonth()+1}.${parseKey(date).getDate()} 的重点标记？`)) {
      state.notes = state.notes.filter(n => n.date !== date);
      save(); renderCalendar(); renderNotes();
    }
  } else {
    state.notes.push({ id: uid(), date, text: '' });
    save(); renderCalendar(); renderNotes();
    const rows = $('notesList').querySelectorAll('.note-text');
    const last = rows[rows.length - 1];
    if (last) last.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
  }
}

/* ------- 提醒 ------- */
function renderNotes() {
  const box = $('notesList');
  const notes = state.notes.slice().sort((a, b) => a.date.localeCompare(b.date));
  if (!notes.length) { box.innerHTML = '<div class="empty-hint">双击日历日期添加</div>'; return; }
  box.innerHTML = '';
  notes.forEach(note => {
    const row = document.createElement('div');
    row.className = 'note-row';
    const dateEl = document.createElement('span');
    dateEl.className = 'note-date';
    const d = parseKey(note.date);
    dateEl.textContent = `${d.getMonth()+1}.${d.getDate()}`;
    makeEditable(dateEl,
      () => { const dd = parseKey(note.date); return `${dd.getMonth()+1}.${dd.getDate()}`; },
      v => {
        const m = v.match(/^(\d{1,2})\s*[\.\/月-]\s*(\d{1,2})/);
        if (m) {
          const mm = parseInt(m[1], 10) - 1;
          const dd = parseInt(m[2], 10);
          const yr = parseKey(note.date).getFullYear();
          note.date = dk(new Date(yr, mm, dd));
        }
      },
      { maxlength: 8, onCommit: () => { renderCalendar(); renderNotes(); } }
    );
    const textEl = document.createElement('span');
    textEl.className = 'note-text';

  Object.values(byDateOrder).forEach(item => {

    if (!byOrder[key]) byOrder[key] = { order: item.order, days: [], total: 0 };
    const tKey = totalKey(item.date, item.order);

/* ------- 实际 ------- */
function groupActualByOrder() {
  const list = state.items.filter(it => it.date === state.selected && it.status === 'actual');
  const groups = {};
  list.forEach(it => {
    const key = (it.sub || '').trim() || '__no_' + it.id;
    if (!groups[key]) groups[key] = { order: (it.sub || '').trim(), records: [] };
    groups[key].records.push(it);
  });
  Object.values(groups).forEach(g => {
    g.records.sort((a, b) => {
      const aHas = a.start && a.end ? 1 : 0;
      const bHas = b.start && b.end ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return timeToMin(a.start) - timeToMin(b.start);
    });
  });
  return Object.values(groups).sort((a, b) => {
    const aMin = a.records[0] ? timeToMin(a.records[0].start) : 9999;
    const bMin = b.records[0] ? timeToMin(b.records[0].start) : 9999;
    return aMin - bMin;
  });
}
function recordMinutes(r) {
  if (r.start && r.end) return durationMin(r.start, r.end);
  if (r.minutes) return Number(r.minutes) || 0;
  return 0;
}
function autoGroupTotalMin(g) {
  let total = 0;
  g.records.forEach(r => { total += recordMinutes(r) * Math.max(1, Number(r.people) || 1); });
  return total;
}
function groupTotalMin(g) {
  const key = totalKey(state.selected, g.order);
  if (state.manualTotals[key] !== undefined) return state.manualTotals[key];
  return autoGroupTotalMin(g);
}
function isManualTotal(g) {
  return state.manualTotals[totalKey(state.selected, g.order)] !== undefined;
}

/* ★ 按用时比例分配今日午餐费与晚餐费 */
function calcMealAllocation() {
  const meta = state.dayMeta[state.selected] || {};
  const lunchTotal  = Number(meta.lunch)  || 0;
  const dinnerTotal = Number(meta.dinner) || 0;

  const groups = groupActualByOrder();
  const orderMins = groups.map(g => ({
    order: g.order,
    min: groupTotalMin(g),
  }));
  const totalMin = orderMins.reduce((s, o) => s + o.min, 0);

  const result = {};
  if (!orderMins.length) return result;

  if (totalMin <= 0) {
    orderMins.forEach(o => {
      result[o.order] = { lunch: 0, dinner: 0, total: 0 };
    });
    return result;
  }

  let lunchSum = 0, dinnerSum = 0;
  orderMins.forEach((o, i) => {
    let l, d;
    if (i === orderMins.length - 1) {
      l = Math.round((lunchTotal  - lunchSum)  * 100) / 100;
      d = Math.round((dinnerTotal - dinnerSum) * 100) / 100;
    } else {
      const ratio = o.min / totalMin;
      l = Math.round(lunchTotal  * ratio * 100) / 100;
      d = Math.round(dinnerTotal * ratio * 100) / 100;
      lunchSum  += l;
      dinnerSum += d;
    }
    result[o.order] = {
      lunch:  l,
      dinner: d,
      total:  Math.round((l + d) * 100) / 100,
    };
  });

  return result;
}

function renderFeeBar(totalMin) {

function beginOrderRename(g, orderEl) {
  if (orderEl.querySelector('input')) return;
  const oldVal = g.order;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = oldVal;
  input.maxLength = 30;
  input.style.cssText = `width:100%;border:none;outline:none;background:#fff;font:inherit;color:inherit;text-align:left;padding:0;margin:0;border-radius:inherit;`;
  orderEl.textContent = '';
  orderEl.classList.add('editing');
  orderEl.appendChild(input);
  input.focus(); input.select();
  let closed = false;
  const close = (commit) => {
    if (closed) return;
    closed = true;
    if (commit) {
      const v = input.value.trim();
      const oldKey = totalKey(state.selected, oldVal);
      const newKey = totalKey(state.selected, v);
      if (state.manualTotals[oldKey] !== undefined && oldKey !== newKey) {
        state.manualTotals[newKey] = state.manualTotals[oldKey];
        delete state.manualTotals[oldKey];
      }
      g.order = v;
      g.records.forEach(r => { r.sub = v; });
      save();
    }
    orderEl.classList.remove('editing');
    orderEl.textContent = g.order || '';
    if (commit) renderActual();
  };
  input.addEventListener('blur', () => close(true));
  input.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
    if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
  });
}

    const ppl = Math.max(1, Number(afPeople.value) || 1);
    let newRec;
    if (s && en) {
      if (en <= s) { alert('结束时间必须晚于开始时间'); afEnd.focus(); return; }
      newRec = { id: uid(), date: state.selected, status: 'actual', kind: 'staff',
        title: '', sub: g.order, start: s, end: en, minutes: 0, people: ppl };
    } else if (h > 0 || m > 0) {
      newRec = { id: uid(), date: state.selected, status: 'actual', kind: 'staff',
        title: '', sub: g.order, start: s || '', end: '', minutes: h * 60 + m, people: ppl };
    } else if (s) {
      newRec = { id: uid(), date: state.selected, status: 'actual', kind: 'staff',
        title: '', sub: g.order, start: s, end: '', minutes: 0, people: ppl };
    } else {
      alert('请至少填写开始时间，或在时/分中填写时长');
      afStart.focus(); return;
    }
    state.items.push(newRec);
    save(); renderActual();
    if (state.keyword) renderSearchResults();
  });
  [afStart, afEnd, afHour, afMin, afPeople].forEach(el => {
    el.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); afOk.click(); }
      if (ev.key === 'Escape') { ev.preventDefault(); closeForm(); }
    });
  });

  const foot = document.createElement('div');
  foot.className = 'a-card-foot';
  const lbl = document.createElement('span');
  lbl.className = 'a-total-label'; lbl.textContent = '合计';
  const dur = document.createElement('span');
  dur.className = 'a-dur';
  const totalMin = groupTotalMin(g);
  if (totalMin > 0) dur.textContent = fmtDuration(totalMin);
  else { dur.textContent = '—'; dur.classList.add('zero'); }
  if (isManualTotal(g)) dur.classList.add('manual');
  dur.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (dur.querySelector('input')) return;
    const isManual = isManualTotal(g);
    const autoMin = autoGroupTotalMin(g);
    const oldTxt = isManual
      ? (fmtDuration(totalMin) === '—' ? '' : fmtDuration(totalMin))
      : (fmtDuration(autoMin) === '—' ? '' : fmtDuration(autoMin));
    const input = document.createElement('input');
    input.type = 'text'; input.value = oldTxt; input.maxLength = 10;
    input.style.cssText = `width:100%;border:none;outline:none;background:transparent;font:inherit;color:inherit;text-align:center;padding:0;margin:0;border-radius:inherit;`;
    const original = dur.textContent;
    dur.textContent = '';
    dur.classList.add('editing');
    dur.classList.remove('manual');
    dur.appendChild(input);
    input.focus(); input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      const key = totalKey(state.selected, g.order);
      if (commit) {
        const raw = input.value.trim();
        if (raw === '' || /^0(m|h)?$/.test(raw.toLowerCase())) delete state.manualTotals[key];
        else {
          const parsed = parseDurationInput(raw);
          if (parsed !== null && parsed >= 0) {
            if (parsed === 0) delete state.manualTotals[key];
            else state.manualTotals[key] = parsed;
          }
        }
        save();
      }
      dur.classList.remove('editing');
      if (commit) renderActual();
      else { dur.textContent = original; if (isManualTotal(g)) dur.classList.add('manual'); }
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
  foot.append(lbl, dur);
  card.append(head, times, addWrap, foot);

  /* ★ 分摊餐费行 */
  const alloc = calcMealAllocation();
  const myAlloc = alloc[g.order] || { lunch: 0, dinner: 0, total: 0 };
  const mealRow = document.createElement('div');
  mealRow.className = 'a-meal-row';
  mealRow.innerHTML = `
    <span class="a-meal-label">分摊餐费</span>
    <span class="a-meal-detail">午 ¥${myAlloc.lunch.toFixed(2)} · 晚 ¥${myAlloc.dinner.toFixed(2)}</span>
    <span class="a-meal-total${myAlloc.total > 0 ? '' : ' zero'}">
      ¥${myAlloc.total.toFixed(2)}
    </span>
  `;
  card.appendChild(mealRow);

  return card;
}

function createTimeRow(rec, g) {

  } else if (rec.start) {
    const st = document.createElement('span');
    st.className = 'a-time-piece'; st.textContent = rec.start;

    sep.className = 'a-time-sep'; sep.textContent = '→';
    const et = document.createElement('span');
    et.className = 'a-time-piece'; et.textContent = '--:--';
    makeTextTimeEditable(st, () => rec.start, v => { rec.start = v; }, {
      onEditEnd: (commit) => {
        if (!commit) { renderActual(); return; }
        setTimeout(() => {
          if (document.body.contains(et)) et.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
        }, 80);
      }
    });
    makeTextTimeEditable(et, () => rec.end, v => { rec.end = v; }, { onEditEnd: () => renderActual() });
    timeRow.append(st, sep, et);
  } else {
    const chip = document.createElement('span');
    chip.className = 'a-min-chip';
    chip.textContent = fmtDuration(rec.minutes) === '—' ? '0m' : fmtDuration(rec.minutes);
    chip.addEventListener('dblclick', e => {
      e.stopPropagation();
      if (chip.querySelector('input')) return;
      const oldTxt = fmtDuration(rec.minutes) === '—' ? '' : fmtDuration(rec.minutes);
      const input = document.createElement('input');
      input.type = 'text'; input.value = oldTxt; input.maxLength = 10;
      input.style.cssText = `width:100%;border:none;outline:none;background:#fff;font:inherit;color:inherit;text-align:center;padding:0;margin:0;border-radius:inherit;`;
      chip.textContent = '';
      chip.classList.add('editing');
      chip.appendChild(input);
      input.focus(); input.select();
      let closed = false;
      const close = (commit) => {
        if (closed) return;
        closed = true;
        if (commit) {
          const parsed = parseDurationInput(input.value);
          if (parsed !== null) rec.minutes = parsed;
          save();
        }
        chip.classList.remove('editing');
        chip.textContent = fmtDuration(rec.minutes) === '—' ? '0m' : fmtDuration(rec.minutes);
        if (commit) renderActual();
      };
      input.addEventListener('blur', () => close(true));
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
        if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
      });
    });
    timeRow.appendChild(chip);
  }

  const ppl = document.createElement('span');
  ppl.className = 'a-ppl';
  ppl.textContent = Math.max(1, Number(rec.people) || 1) + '人';
  ppl.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (ppl.querySelector('input')) return;
    const oldVal = String(Math.max(1, Number(rec.people) || 1));
    const input = document.createElement('input');
    input.type = 'number'; input.min = 1; input.value = oldVal;
    input.style.cssText = `width:100%;border:none;outline:none;background:#fff;font:inherit;color:inherit;text-align:center;padding:0;margin:0;border-radius:inherit;`;
    ppl.textContent = '';
    ppl.classList.add('editing');
    ppl.appendChild(input);
    input.focus(); input.select();
    let closed = false;
    const close = (commit) => {
      if (closed) return;
      closed = true;
      if (commit) { rec.people = Math.max(1, Number(input.value) || 1); save(); }
      ppl.classList.remove('editing');
      ppl.textContent = Math.max(1, Number(rec.people) || 1) + '人';
      if (commit) renderActual();
    };
    input.addEventListener('blur', () => close(true));
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
      if (ev.key === 'Escape') { ev.preventDefault(); close(false); }
    });
  });
  timeRow.appendChild(ppl);

  const segDur = document.createElement('span');
  segDur.className = 'a-seg-dur';
  const m = recordMinutes(rec);
  const p = Math.max(1, Number(rec.people) || 1);
  if (m > 0) segDur.textContent = '= ' + fmtDuration(m * p);
  else { segDur.textContent = '= —'; segDur.classList.add('zero'); }
  timeRow.appendChild(segDur);

  const segDel = document.createElement('button');
  segDel.className = 'a-time-del';
  segDel.textContent = '×';
  segDel.addEventListener('click', e => {
    e.stopPropagation();
    if (g.records.length <= 1 && !rec.start && !rec.end) {
      if (!confirm(`删除「${g.order || '未填'}」的最后一个时间段？`)) return;
      state.items = state.items.filter(x => x.id !== rec.id);
      const key = totalKey(state.selected, g.order);
      delete state.manualTotals[key];
      save(); renderActual();
      return;
    }
    state.items = state.items.filter(x => x.id !== rec.id);
    save(); renderActual();
    if (state.keyword) renderSearchResults();
  });
  timeRow.appendChild(segDel);
  return timeRow;
}

/* ------- 单号汇总 ------- */
function dayOrderMinutes(date, order, records) {
  const key = totalKey(date, order);
  if (state.manualTotals[key] !== undefined) return state.manualTotals[key];
  let t = 0;
  records.forEach(r => { t += recordMinutes(r) * Math.max(1, Number(r.people) || 1); });
  return t;
}
function openOrderModal(order, fallbackRecords) {
  const norm = String(order || '').trim();
  let recs;
  if (norm) recs = state.items.filter(it => it.status === 'actual' && String(it.sub || '').trim() === norm);
  else recs = (fallbackRecords || []).slice();
  if (!recs.length) recs = (fallbackRecords || []).slice();
  if (!recs.length) return;
  const byDate = {};
  recs.forEach(r => { (byDate[r.date] = byDate[r.date] || []).push(r); });
  const dates = Object.keys(byDate).sort();
  let grandTotal = 0, totalSegs = 0;
  const today = todayKey();
  const bodyHtml = dates.map(date => {
    const recsOfDay = byDate[date];
    recsOfDay.sort((a, b) => {
      const aHas = a.start && a.end ? 1 : 0;
      const bHas = b.start && b.end ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return timeToMin(a.start) - timeToMin(b.start);
    });
    const dayMin = norm
      ? dayOrderMinutes(date, norm, recsOfDay)
      : recsOfDay.reduce((s, r) => s + recordMinutes(r) * Math.max(1, Number(r.people) || 1), 0);
    grandTotal += dayMin;
    totalSegs += recsOfDay.length;
    const d = parseKey(date);
    const w = ['日','一','二','三','四','五','六'][d.getDay()];
    const isToday = date === today;
    const segsHtml = recsOfDay.map(r => {
      const ppl = Math.max(1, Number(r.people) || 1);
      const mm = recordMinutes(r);
      const segMin = mm * ppl;
      let timeStr;
      if (r.start && r.end) timeStr = `${r.start} → ${r.end}`;
      else if (r.start) timeStr = `${r.start} → --:--`;
      else { const dm = fmtDuration(r.minutes); timeStr = `时长 ${dm === '—' ? '0m' : dm}`; }
      return `<div class="om-seg">
        <span class="om-time">${esc(timeStr)}</span>
        <span class="om-ppl">${ppl}人</span>
        <span class="om-dur${segMin ? '' : ' zero'}">${segMin ? '= ' + fmtDuration(segMin) : '= —'}</span>
      </div>`;
    }).join('');
    return `<div class="om-day">
      <div class="om-day-head">
        <span class="om-date">${d.getMonth()+1}月${d.getDate()}日 周${w}${isToday ? ' · 今天' : ''}</span>
        <span class="om-day-total">${dayMin ? fmtDuration(dayMin) : '—'}</span>
      </div>
      ${segsHtml}
    </div>`;
  }).join('');
  $('omTitle').textContent = norm || '未填单号';
  $('omSub').textContent = `${dates.length} 天 · ${totalSegs} 个时间段`;
  $('omBody').innerHTML = bodyHtml;
  $('omTotal').textContent = `所有天数总用时 ${grandTotal ? fmtDuration(grandTotal) : '—'}`;
  $('orderModal').classList.add('show');
}
function closeOrderModal() { const m = $('orderModal'); if (m) m.classList.remove('show'); }

/* ------- 搜索 ------- */
function renderSearchResults() {
  const kw = state.keyword.trim().toLowerCase();
  const area = $('searchArea'), body = $('searchBody'), info = $('searchInfo');
  if (!kw) { area.classList.remove('show'); document.body.classList.remove('searching'); return; }
  area.classList.add('show');
  document.body.classList.add('searching');
  const results = state.items.filter(it => {
    const bag = [it.title, it.sub,
      it.status === 'plan' ? '计划' : '实际',
      it.kind === 'staff' ? '兼职' : it.kind === 'guest' ? '客人' : '其他',
    ].join(' ').toLowerCase();
    return bag.includes(kw);
  }).sort((a, b) => {
    if (a.date !== b.date) return b.date.localeCompare(a.date);
    return (a.start || '99:99').localeCompare(b.start || '99:99');
  });
  info.textContent = `“${state.keyword.trim()}” · 找到 ${results.length} 条`;
  if (!results.length) {
    body.innerHTML = `<div class="empty-state"><span class="ico">🔍</span><span class="msg">没有找到相关记录</span></div>`;
    return;
  }
  body.innerHTML = '';
  results.forEach(it => {
    const d = parseKey(it.date);
    const isPlan = it.status === 'plan';
    const w = ['日','一','二','三','四','五','六'][d.getDay()];
    const el = document.createElement('div');
    el.className = 'sr-item';
    el.dataset.status = it.status;
    const dateStr = `${d.getMonth()+1}.${d.getDate()} 周${w}`;
    let timeStr;
    if (it.start && it.end) timeStr = `${it.start}-${it.end}`;
    else if (it.start) timeStr = it.start;
    else if (it.minutes) timeStr = fmtDuration(it.minutes);
    else timeStr = '全天';
    el.innerHTML = `
      <div class="sr-date">${esc(dateStr)}</div>
      <div class="sr-type ${isPlan ? 'plan' : 'actual'}">${isPlan ? '计划' : '实际'}</div>
      <div class="sr-main">
        ${it.sub ? `<span class="sr-order">${esc(it.sub)}</span>` : ''}
        <span class="sr-name">${esc(it.title || (isPlan ? '未命名' : '单号'))}</span>
      </div>
      <div class="sr-time ${isPlan ? 'plan' : ''}">${esc(timeStr)}</div>
    `;
    el.addEventListener('click', () => { clearSearch(); selectDate(it.date); });
    body.appendChild(el);
  });
}
function clearSearch() {
  state.keyword = '';
  $('searchInput').value = '';
  $('searchClear').classList.remove('show');
  renderSearchResults();
}

/* ------- 自动补全 ------- */
let acIndex = -1;
function getAllOrderNames() {
  const set = new Set();
  state.items.forEach(it => {
    if (it.status === 'actual') {
      const s = String(it.sub || '').trim();
      if (s) set.add(s);
    }
  });
  return Array.from(set).sort();
}
function hideAC() {
  const acList = $('aOrderAC');
  if (!acList) return;
  acList.classList.remove('show');
  acList.innerHTML = '';
  acIndex = -1;
}
function positionAC() {
  const input = $('aOrder'), acList = $('aOrderAC');
  if (!input || !acList) return;
  if (isMobile()) return;
  const r = input.getBoundingClientRect();
  acList.style.left = r.left + 'px';
  acList.style.top = (r.bottom + 4) + 'px';
  acList.style.width = Math.max(r.width, 180) + 'px';
}
function updateAC() {
  const input = $('aOrder'), acList = $('aOrderAC');
  if (!input || !acList) return;
  const val = input.value.trim().toLowerCase();
  if (!val) { hideAC(); return; }
  const all = getAllOrderNames();
  const matches = all.filter(n => n.toLowerCase().includes(val) && n.toLowerCase() !== val);
  if (!matches.length) { hideAC(); return; }
  acList.innerHTML = '';
  matches.slice(0, 10).forEach(n => {
    const el = document.createElement('div');
    el.className = 'ac-item';
    el.dataset.val = n;
    el.innerHTML = `<span>${esc(n)}</span><span class="ac-hint">选择</span>`;
    el.addEventListener('mousedown', ev => {
      ev.preventDefault();
      input.value = n;
      hideAC();
      input.focus();
      try { input.setSelectionRange(n.length, n.length); } catch(e){}
    });
    acList.appendChild(el);
  });
  if (isMobile()) {
    const r = input.getBoundingClientRect();
    acList.style.top = (r.bottom + 4) + 'px';
  } else positionAC();
  acList.classList.add('show');
  acIndex = -1;
}
function updateACActive(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === acIndex));
  if (acIndex >= 0 && items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' });
}

/* ------- 添加 ------- */
function addPlan(kind, nameEl, startEl, endEl, noteEl, onDone) {
  const name = $(nameEl).value.trim();
  if (!name) { $(nameEl).focus(); return; }
  const sN = normalizeTime($(startEl).value);
  const eN = normalizeTime($(endEl).value);
  if (sN) $(startEl).value = sN;
  if (eN) $(endEl).value = eN;
  state.items.push({
    id: uid(), date: state.selected, status: 'plan', kind: kind,
    done: false, cancelled: false,
    title: name, start: sN, end: eN,
    sub: $(noteEl).value.trim(),
  });
  $(nameEl).value = ''; $(startEl).value = ''; $(endEl).value = ''; $(noteEl).value = '';
  $(nameEl).focus();
  save(); onDone(); renderPendingBanner(); renderCalendar();
  if (state.keyword) renderSearchResults();
}
function addActual() {
  hideAC();
  const order = $('aOrder').value.trim();
  if (!order) { $('aOrder').focus(); return; }
  const sN = normalizeTime($('aStart').value);
  const eN = normalizeTime($('aEnd').value);
  if (sN) $('aStart').value = sN;
  if (eN) $('aEnd').value = eN;
  const start = $('aStart').value, end = $('aEnd').value;
  const hour = Math.max(0, parseInt($('aHour').value, 10) || 0);
  const min = Math.max(0, parseInt($('aMin').value, 10) || 0);
  const people = Math.max(1, Number($('aPeople').value) || 1);
  let payload;
  if (start && end) {
    if (end <= start) { alert('结束时间必须晚于开始时间'); $('aEnd').focus(); return; }
    payload = { start, end, minutes: 0, people };
  } else if (hour > 0 || min > 0) {
    payload = { start: start || '', end: '', minutes: hour * 60 + min, people };
  } else if (start) {
    payload = { start, end: '', minutes: 0, people };
  } else {
    alert('请至少填写开始时间，或在时/分中填写时长');
    $('aStart').focus(); return;
  }
  state.items.push({
    id: uid(), date: state.selected, status: 'actual', kind: 'staff',
    title: '', sub: order, ...payload,
  });
  $('aOrder').value = ''; $('aStart').value = ''; $('aEnd').value = '';
  $('aHour').value = 0; $('aMin').value = 0; $('aPeople').value = 1;
  updatePreview();
  $('aOrder').focus();
  save(); renderActual();
  if (state.keyword) renderSearchResults();
}
function updatePreview() {
  const sRaw = $('aStart').value, eRaw = $('aEnd').value;
  const s = normalizeTime(sRaw) || sRaw;
  const e = normalizeTime(eRaw) || eRaw;
  const hour = Math.max(0, parseInt($('aHour').value, 10) || 0);
  const min = Math.max(0, parseInt($('aMin').value, 10) || 0);
  const people = Math.max(1, Number($('aPeople').value) || 1);
  const el = $('aPreview'), valEl = el.querySelector('.val');
  let totalMin = 0;
  if (s && e) totalMin = durationMin(s, e);
  else if (hour > 0 || min > 0) totalMin = hour * 60 + min;
  if (!totalMin) { el.classList.add('zero'); valEl.textContent = '—'; }
  else { el.classList.remove('zero'); valEl.textContent = fmtDuration(totalMin * people); }
}

/* ------- 日期 ------- */
function renderDay() {
  const d = parseKey(state.selected);
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  const isToday = state.selected === todayKey();
  $('dayTitle').innerHTML =
    `${d.getMonth()+1}月${d.getDate()}日 <small>星期${w}</small>` +
    (isToday ? ' <span class="today-pill">今天</span>' : '');
}
function selectDate(key) {
  state.selected = key;
  const d = parseKey(key);
  if (d.getMonth() !== state.view.m || d.getFullYear() !== state.view.y) {
    state.view.y = d.getFullYear();
    state.view.m = d.getMonth();
  }
  renderCalendar(); renderDay();
  renderPlanPeople(); renderPlanOther(); renderActual();
}
function shiftDay(delta) {
  const d = parseKey(state.selected);
  d.setDate(d.getDate() + delta);
  selectDate(dk(d));
}
function shiftMonth(delta) {
  let m = state.view.m + delta, y = state.view.y;
  if (m < 0) { m = 11; y--; }
  if (m > 11) { m = 0; y++; }
  state.view.y = y; state.view.m = m;
  renderCalendar(); renderOrderView();
}

function exportData() {
