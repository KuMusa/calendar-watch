    exportedAt: new Date().toISOString(),
    items: state.items, notes: state.notes,
    manualTotals: state.manualTotals,
    manualFees: state.manualFees,
    dayMeta: state.dayMeta,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const t = new Date();
  const stamp = `${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}`;
  a.href = url;
  a.download = `schedule-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function importData(file) {
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || typeof data !== 'object') throw new Error('文件内容无法识别');
    const items = Array.isArray(data.items) ? data.items : [];
    const notes = Array.isArray(data.notes) ? data.notes : [];
    const manualTotals = (data.manualTotals && typeof data.manualTotals === 'object') ? data.manualTotals : {};
    const manualFees = (data.manualFees && typeof data.manualFees === 'object') ? data.manualFees : {};
    const dayMeta = (data.dayMeta && typeof data.dayMeta === 'object') ? data.dayMeta : {};
    const msg = `导入将用文件覆盖当前所有数据\n\n文件内容：${items.length} 条日程 / ${notes.length} 条提醒\n当前数据：${state.items.length} 条日程 / ${state.notes.length} 条提醒\n\n确定继续？`;
    if (!confirm(msg)) return;
    state.items = items; state.notes = notes;
    state.manualTotals = manualTotals;
    state.manualFees = manualFees;
    state.dayMeta = dayMeta;
    await save();
    renderCalendar(); renderNotes(); renderDay();
    renderPlanPeople(); renderPlanOther(); renderActual();
    renderPendingBanner(); renderSearchResults();
    alert('导入成功！');
  } catch (e) {
    console.error('导入失败', e);
    alert('导入失败：' + (e.message || '文件格式不正确'));
  }
}

/* ★ 通用费用输入绑定（改动时自动刷新卡片分摊） */
function bindMoneyInput(inputEl, key, isInt) {
  if (!inputEl) return;
  let t = null;

  const apply = (val, silent) => {
    const v = isInt ? parseInt(val, 10) : parseFloat(val);
    if (isNaN(v) || v <= 0) {
      if (silent) inputEl.value = '';
      if (key === 'amount') delete state.manualFees[state.selected];
      else {
        const meta = state.dayMeta[state.selected] || {};
        delete meta[key];
        if (Object.keys(meta).length === 0) delete state.dayMeta[state.selected];
        else state.dayMeta[state.selected] = meta;
      }
      return;
    }
    const finalV = isInt ? Math.max(0, Math.round(v)) : Math.round(v * 100) / 100;
    if (!silent) inputEl.value = finalV;
    if (key === 'amount') state.manualFees[state.selected] = finalV;
    else {
      if (!state.dayMeta[state.selected]) state.dayMeta[state.selected] = {};
      state.dayMeta[state.selected][key] = finalV;
    }
  };

  inputEl.addEventListener('input', e => {
    if (t) clearTimeout(t);
    const val = e.target.value;
    t = setTimeout(() => {
      t = null;
      apply(val, false);
      save();
      renderActual();   /* ★ 让分摊实时刷新 */
    }, 600);
  });
  inputEl.addEventListener('blur', e => {
    if (t) { clearTimeout(t); t = null; }
    apply(e.target.value, true);
    save();
    renderActual();     /* ★ 让分摊实时刷新 */
  });
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
function bind() {
  $('mobileMenuBtn').addEventListener('click', toggleSidebar);
  $('sidebarMask').addEventListener('click', closeSidebar);
  $('tabCalendar').onclick = () => switchSideTab('calendar');
  $('tabOrders').onclick = () => switchSideTab('orders');

  $('calPrev').onclick = () => shiftMonth(-1);
  $('calNext').onclick = () => shiftMonth(1);
  $('calGrid').addEventListener('click', onCalClick);
  $('calGrid').addEventListener('dblclick', onCalDblClick);

  $('dayPrev').onclick = () => shiftDay(-1);
  $('dayNext').onclick = () => shiftDay(1);
  $('dayToday').onclick = () => selectDate(todayKey());

  const searchInput = $('searchInput');
  searchInput.addEventListener('input', e => {
    state.keyword = e.target.value;
    $('searchClear').classList.toggle('show', state.keyword.length > 0);
    renderSearchResults();
  });
  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); clearSearch(); searchInput.blur(); }
  });
  $('searchClear').onclick = () => { clearSearch(); searchInput.focus(); };
  $('searchClear2').onclick = clearSearch;

  $('exportBtn').onclick = exportData;
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files && e.target.files[0];
    if (f) await importData(f);
    e.target.value = '';
  };

  $('noteAdd').onclick = () => {
    const existing = state.notes.find(n => n.date === state.selected);
    if (existing) {
      renderNotes();
      const rows = $('notesList').querySelectorAll('.note-text');
      for (const r of rows) {
        if (r.textContent === existing.text || !existing.text) {
          r.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
          break;
        }
      }
      return;
    }
    state.notes.push({ id: uid(), date: state.selected, text: '' });
    save(); renderCalendar(); renderNotes();
    const rows = $('notesList').querySelectorAll('.note-text');
    const last = rows[rows.length - 1];
    if (last) last.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));
  };

  $('pAdd').onclick = () => addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople);
  $('pName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople); } });
  $('pNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople); } });
  $('pEnd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlan('staff', 'pName', 'pStart', 'pEnd', 'pNote', renderPlanPeople); } });

  $('oAdd').onclick = () => addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther);
  $('oName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther); } });
  $('oNote').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther); } });
  $('oEnd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addPlan('event', 'oName', 'oStart', 'oEnd', 'oNote', renderPlanOther); } });

  $('aAdd').onclick = addActual;
  const acInput = $('aOrder'), acList = $('aOrderAC');
  acInput.addEventListener('input', () => updateAC());
  acInput.addEventListener('focus', () => { if (acInput.value.trim()) updateAC(); });
  acInput.addEventListener('blur', () => setTimeout(hideAC, 160));
  acInput.addEventListener('keydown', e => {
    if (acList.classList.contains('show')) {
      const items = acList.querySelectorAll('.ac-item');
      if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex+1, items.length-1); updateACActive(items); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = Math.max(acIndex-1, -1); updateACActive(items); return; }
      if (e.key === 'Enter' && acIndex >= 0 && items[acIndex]) {
        e.preventDefault();
        acInput.value = items[acIndex].dataset.val;
        hideAC();
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); hideAC(); return; }
    }
    if (e.key === 'Enter') { e.preventDefault(); addActual(); }
  });
  window.addEventListener('resize', () => {
    if (acList.classList.contains('show')) {
      if (isMobile()) {
        const r = acInput.getBoundingClientRect();
        acList.style.top = (r.bottom + 4) + 'px';
      } else positionAC();
    }
    if (!isMobile()) closeSidebar();
  });
  window.addEventListener('scroll', () => {
    if (acList.classList.contains('show')) {
      if (isMobile()) {
        const r = acInput.getBoundingClientRect();
        acList.style.top = (r.bottom + 4) + 'px';
      } else positionAC();
    }
  }, true);

  $('aEnd').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addActual(); } });
  ['aStart', 'aEnd', 'aPeople', 'aHour', 'aMin'].forEach(id => {
    $(id).addEventListener('input', updatePreview);
    $(id).addEventListener('change', updatePreview);
  });

  /* 五个费用输入框事件 */
  bindMoneyInput($('actualFeeInput'), 'amount', false);
  bindMoneyInput($('lunchFeeInput'), 'lunch', false);
  bindMoneyInput($('dinnerFeeInput'), 'dinner', false);
  bindMoneyInput($('peopleCountInput'), 'people', true);

  attachAutoJump('pStart', 'pEnd');
  attachAutoJump('oStart', 'oEnd');
  attachAutoJump('aStart', 'aEnd');

  $('omClose').onclick = closeOrderModal;
  $('omOk').onclick = closeOrderModal;
  $('orderModal').addEventListener('click', e => {
    if (e.target === $('orderModal')) closeOrderModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if ($('orderModal').classList.contains('show')) closeOrderModal();
      else if ($('sidebar').classList.contains('open')) closeSidebar();
    }
  });

  bindArrowNav();

  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      e.preventDefault();
      searchInput.focus();
      searchInput.select();
    }
  });
}

/* ============================================================
 *  启动（含登录检查）
 * ============================================================ */
async function init() {
  /* ★ 登录检查（仅在独立打开 schedule.html 时执行） */
  if (window.top === window.self) {
    try {
      const { data: { session } } = await supa.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
    } catch (e) {
      window.location.href = 'index.html'; return;
    }
  }

  const t = new Date();
  state.view.y = t.getFullYear();
  state.view.m = t.getMonth();
  state.selected = dk(t);

  await load();
  bind();
  renderCalendar(); renderNotes(); renderDay();
  renderPlanPeople(); renderPlanOther(); renderActual();
  renderPendingBanner(); renderSearchResults(); renderOrderView();

  supa
    .channel('schedule-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_items' },
      async () => {
        await load();
        renderCalendar(); renderPlanPeople(); renderPlanOther();
        renderActual(); renderPendingBanner();
      })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_notes' },
      async () => { await load(); renderNotes(); renderCalendar(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'schedule_totals' },
      async () => { await load(); renderActual(); })
    .subscribe();
}

init();
</script>
