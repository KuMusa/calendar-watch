<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef2f9; color: #1a1f36;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ============ 登录层 ============ */
  #login {
    position: fixed; inset: 0; z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background:
      radial-gradient(900px 500px at 4% -6%, #e4ecff 0%, transparent 55%),
      radial-gradient(800px 400px at 98% -2%, #ffe8f1 0%, transparent 52%),
      #eef2f9;
    transition: opacity .25s;
  }
  #login.hide { opacity: 0; pointer-events: none; }
  .login-card {
    width: 350px; max-width: 100%;
    background: #fff; border-radius: 20px;
    padding: 32px 28px 26px;
    box-shadow: 0 24px 70px rgba(26,31,54,.13);
    text-align: center;
  }
  .login-logo {
    width: 54px; height: 54px; margin: 0 auto 14px;
    border-radius: 16px;
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    display: grid; place-items: center;
    font-size: 24px;
    box-shadow: 0 10px 24px rgba(79,124,255,.3);
  }
  .login-card h1 { font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .login-card .sub { font-size: 12px; color: #8b93a7; margin: 6px 0 20px; }
  .pwd-wrap { position: relative; margin-bottom: 12px; }
  .pwd-wrap input {
    width: 100%; height: 44px;
    padding: 0 42px 0 14px;
    border: 1.5px solid #e6ebf5; border-radius: 11px;
    font-size: 14px; font-family: inherit; color: #1a1f36;
    background: #fafbfe; outline: none; transition: .16s;
  }
  .pwd-wrap input:focus { border-color: #4f7cff; background: #fff; box-shadow: 0 0 0 4px rgba(79,124,255,.1); }
  .pwd-wrap input::placeholder { color: #b8bfcd; }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 32px; height: 32px; border-radius: 8px;
    display: grid; place-items: center;
    color: #b8bfcd; font-size: 15px;
  }
  .eye:hover { background: #eef3ff; color: #4f7cff; }
  #loginBtn {
    width: 100%; height: 44px; border-radius: 11px;
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    color: #fff; font-size: 14px; font-weight: 700;
    letter-spacing: .06em;
    box-shadow: 0 8px 20px rgba(79,124,255,.28);
    transition: .16s;
  }
  #loginBtn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(79,124,255,.34); }
  #loginBtn:active { transform: translateY(0) scale(.985); }
  #loginBtn:disabled { opacity: .6; transform: none; cursor: not-allowed; box-shadow: none; }
  .login-msg { font-size: 12px; font-weight: 600; min-height: 18px; margin-top: 12px; color: #e8455a; }
  .login-msg.ok { color: #0a8f66; }
  .login-foot { font-size: 10.5px; color: #cdd4e2; margin-top: 16px; }

  /* ============ 主体 ============ */
  #shell { display: flex; flex-direction: column; height: 100%; }
  #shell[hidden] { display: none; }

  .topbar {
    height: 48px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    background: #fff;
    border-bottom: 1px solid #e9edf5;
    box-shadow: 0 1px 8px rgba(26,31,54,.05);
    position: relative; z-index: 20;
  }
  .brand {
    font-size: 13.5px; font-weight: 800; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 7px;
    flex-shrink: 0; padding-right: 10px;
    border-right: 1px solid #eef2f9;
    color: #1a1f36;
  }
  .brand .logo-sq {
    width: 24px; height: 24px; border-radius: 7px;
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    display: grid; place-items: center;
    font-size: 12px;
    box-shadow: 0 3px 8px rgba(79,124,255,.3);
  }

  .tabs { display: flex; gap: 4px; flex-shrink: 0; }
  .tab {
    height: 32px; padding: 0 14px;
    border-radius: 9px;
    font-size: 12.5px; font-weight: 700;
    color: #6b7280;
    display: inline-flex; align-items: center; gap: 5px;
    transition: .15s;
    white-space: nowrap;
  }
  .tab:hover { background: #f2f5ff; color: #4f7cff; }
  .tab.active {
    background: linear-gradient(140deg, #5b86ff, #3b66e6);
    color: #fff;
    box-shadow: 0 4px 12px rgba(79,124,255,.26);
  }
  .tab.active:hover { color: #fff; }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .user-chip {
    font-size: 11px; font-weight: 600; color: #6b7280;
    background: #f6f8fd; padding: 4px 10px; border-radius: 999px;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .btn-logout {
    height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1.5px solid #e9edf5; background: #fff;
    font-size: 12px; font-weight: 700; color: #6b7280;
    transition: .15s;
  }
  .btn-logout:hover { background: #fff5f6; border-color: #ffd7db; color: #e8455a; }

  #frame { flex: 1; width: 100%; border: 0; display: block; min-height: 0; background: #eef2f9; }

  @media (max-width: 620px) {
    .brand span.txt { display: none; }
    .brand { padding-right: 6px; }
    .tab { padding: 0 10px; font-size: 12px; }
    .tab span.ico { display: none; }
    .user-chip { display: none; }
    .topbar { padding: 0 8px; gap: 6px; }
  }
</style>
</head>
<body>

<!-- ================= 登录层 ================= -->
<div id="login">
  <form class="login-card" id="loginForm">
    <div class="login-logo">🔐</div>
    <h1>工作台</h1>
    <div class="sub">请输入访问密码</div>

    <div class="pwd-wrap">
      <input type="password" id="pwd" placeholder="密码" autocomplete="current-password" required>
      <button type="button" class="eye" id="eyeBtn" title="显示/隐藏">👁</button>
    </div>

    <button type="submit" id="loginBtn">登 录</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-foot">仅限授权用户访问</div>
  </form>
</div>

<!-- ================= 主界面 ================= -->
<div id="shell" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo-sq">⚡</span><span class="txt">工作台</span></div>
    <nav class="tabs">
      <button class="tab active" data-page="parttime.html"><span class="ico">📋</span>兼职签到</button>
      <button class="tab" data-page="schedule.html"><span class="ico">🗓️</span>我的日程</button>
    </nav>
    <div class="topbar-right">
      <span class="user-chip" id="userChip"></span>
      <button class="btn-logout" id="logoutBtn">退出</button>
    </div>
  </header>
  <iframe id="frame" title="内容"></iframe>
</div>

<script>
/* ============================================================
 *  ★★★ 配置区 —— 只需要改下面这一行 ★★★
 * ============================================================ */
const SUPABASE_URL = 'https://evwiybzodraxzxrjosrs.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_OWCPSt65AWrsBXtTBhi1Zg_5oX1zeM6';

/* ★ 你的登录账号邮箱
 *   在 Supabase 后台 → Authentication → Users → Add user 创建时填的那个邮箱。
 *   不必是真实邮箱，格式正确即可，例如 admin@parttime.local
 *   密码就是你在那里设置的密码，改密码也在那里改。 */
const LOGIN_EMAIL = '1104936143@qq.com';
/* ============================================================ */

const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const $ = id => document.getElementById(id);
const loginLayer = $('login');
const shell = $('shell');
const pwdInput = $('pwd');
const loginBtn = $('loginBtn');
const loginMsg = $('loginMsg');

let currentPage = '';

/* ---------- 显示 / 隐藏 ---------- */
function showLogin(msg, isOk) {
  loginLayer.classList.remove('hide');
  shell.hidden = true;
  if (msg) {
    loginMsg.textContent = msg;
    loginMsg.classList.toggle('ok', !!isOk);
  }
}

function showApp(session) {
  loginLayer.classList.add('hide');
  shell.hidden = false;
  loginMsg.textContent = '';
  pwdInput.value = '';
  const em = session && session.user ? session.user.email : '';
  $('userChip').textContent = em || '已登录';
  const first = document.querySelector('.tab.active');
  if (first && !currentPage) switchPage(first);
}

/* ---------- 登录 ---------- */
async function doLogin(pwd) {
  loginBtn.disabled = true;
  loginMsg.textContent = '登录中…';
  loginMsg.classList.remove('ok');
  try {
    const { data, error } = await supa.auth.signInWithPassword({
      email: LOGIN_EMAIL,
      password: pwd,
    });
    if (error) throw error;
    showApp(data.session);
  } catch (e) {
    console.warn(e);
    const m = String(e.message || e);
    let zh = '登录失败，请重试';
    if (/Invalid login credentials/i.test(m)) zh = '密码错误';
    else if (/Email not confirmed/i.test(m)) zh = '账号未确认（请在 Supabase 后台把用户设为 Auto Confirm）';
    else if (/fetch|network|Failed to fetch/i.test(m)) zh = '网络错误，请检查网络后重试';
    showLogin(zh);
  } finally {
    loginBtn.disabled = false;
  }
}

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const pwd = pwdInput.value;
  if (!pwd) { showLogin('请输入密码'); return; }
  doLogin(pwd);
});

/* 显示/隐藏密码 */
$('eyeBtn').addEventListener('click', () => {
  pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
  pwdInput.focus();
});

/* ---------- 页面切换 ---------- */
function switchPage(tabEl) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabEl.classList.add('active');
  const page = tabEl.dataset.page;
  if (page === currentPage) return;
  currentPage = page;
  $('frame').src = page;
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchPage(tab));
});

/* ---------- 退出 ---------- */
$('logoutBtn').addEventListener('click', async () => {
  if (!confirm('确定退出登录？')) return;
  await supa.auth.signOut();
  currentPage = '';
  $('frame').src = 'about:blank';
  showLogin('已退出登录', true);
});

/* ---------- 启动 ---------- */
(async function boot() {
  try {
    const { data: { session } } = await supa.auth.getSession();
    if (session) showApp(session);
    else showLogin('');
  } catch (e) {
    console.warn(e);
    showLogin('初始化失败：' + (e.message || e));
  }
})();

/* 会话变化（token 过期 / 其他标签页退出） */
supa.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    currentPage = '';
    $('frame').src = 'about:blank';
    showLogin('登录已过期，请重新登录');
  } else if (event === 'SIGNED_IN' && session) {
    showApp(session);
  }
});
</script>
</body>
</html>
